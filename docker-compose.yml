services:
  neurun:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data          # 持久化用户数据
    environment:
      - NEURUN_DATA_DIR=/app/data
      - NEURUN_INVITE_CODES_FILE=/app/data/invite-codes.json
      - NEURUN_COROS_CREDENTIAL_KEY=${NEURUN_COROS_CREDENTIAL_KEY:-}
      - NEURUN_AI_API_KEY=${NEURUN_AI_API_KEY:-}
      - NEURUN_AI_BASE_URL=${NEURUN_AI_BASE_URL:-https://api.deepseek.com}
      - NEURUN_AI_MODEL=${NEURUN_AI_MODEL:-deepseek-chat}
      - NEURUN_AI_MAX_CONCURRENCY=${NEURUN_AI_MAX_CONCURRENCY:-32}
      - NEURUN_AI_MAX_PENDING=${NEURUN_AI_MAX_PENDING:-64}
      - NEURUN_AI_WAIT_TIMEOUT_SECONDS=${NEURUN_AI_WAIT_TIMEOUT_SECONDS:-5}
    restart: unless-stopped
