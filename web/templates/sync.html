<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>neurun — 同步</title>
<style>
[data-theme="fresh"] {
  --bg:#e8efe9; --bg-card:#fff; --text:#1a2e23; --text-secondary:#5a7d6e; --text-muted:#8aa89a;
  --accent:#2d9d6f; --accent-glow:rgba(45,157,111,.1); --recovery:#3b82b6; --recovery-glow:rgba(59,130,246,.08);
  --performance:#22a86e; --performance-glow:rgba(34,168,110,.08); --sleep:#7c6fcf; --sleep-glow:rgba(124,111,207,.08);
  --warning:#d4a017; --danger:#dc5b51; --hrv:#3b9fc6;
  --card-shadow:0 2px 8px rgba(0,0,0,.06); --card-shadow-hover:0 8px 30px rgba(0,0,0,.1);
  --border-subtle:#dde5df; --bg-subtle:#f0f4f0;
}
[data-theme="sport"] {
  --bg:#f0f0f0; --bg-card:#fff; --text:#171717; --text-secondary:#525252; --text-muted:#a3a3a3;
  --accent:#f15b2a; --accent-glow:rgba(241,91,42,.08); --recovery:#2563eb; --recovery-glow:rgba(37,99,235,.08);
  --performance:#16a34a; --performance-glow:rgba(22,163,74,.08); --sleep:#7c3aed; --sleep-glow:rgba(124,58,237,.08);
  --warning:#eab308; --danger:#ef4444; --hrv:#0891b2;
  --card-shadow:0 2px 10px rgba(0,0,0,.07); --card-shadow-hover:0 10px 35px rgba(0,0,0,.1);
  --border-subtle:#ebebeb; --bg-subtle:#f5f5f5;
}
[data-theme="dark"] {
  --bg:#0b1120; --bg-card:#1a2333; --text:#e2e8f0; --text-secondary:#94a3b8; --text-muted:#64748b;
  --accent:#34d399; --accent-glow:rgba(52,211,153,.12); --recovery:#60a5fa; --recovery-glow:rgba(96,165,250,.1);
  --performance:#4ade80; --performance-glow:rgba(74,222,128,.1); --sleep:#a78bfa; --sleep-glow:rgba(167,139,250,.1);
  --warning:#fbbf24; --danger:#f87171; --hrv:#22d3ee;
  --card-shadow:0 2px 10px rgba(0,0,0,.35); --card-shadow-hover:0 10px 30px rgba(0,0,0,.5);
  --border-subtle:#243044; --bg-subtle:#151e2c;
}
*{margin:0;padding:0;box-sizing:border-box}
html{min-width:320px;background:var(--bg)}
body{min-width:320px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input{font:inherit}
.container{width:100%;max-width:560px;margin:0 auto;padding:12px 12px calc(112px + env(safe-area-inset-bottom))}

/* Shared app navigation */
.app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 12px}
.app-brand{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px;font-weight:800;letter-spacing:.2px}
.app-brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:11px;background:var(--accent);color:#fff;font-size:17px;font-weight:900}
.app-nav{position:fixed;z-index:50;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 24px),520px);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border:1px solid var(--border-subtle);border-radius:22px;background:color-mix(in srgb,var(--bg-card) 92%,transparent);box-shadow:0 12px 40px rgba(0,0,0,.22);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.app-nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;min-height:54px;padding:6px 5px;border-radius:16px;color:var(--text-muted);text-decoration:none;transition:color .2s,background .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app-nav-item[aria-current="page"]{background:var(--accent-glow);color:var(--accent)}
.app-nav-icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app-nav-label{font-size:10px;font-weight:750;line-height:1;letter-spacing:.2px}
.theme-bar{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--border-subtle);border-radius:14px;background:var(--bg-card);box-shadow:var(--card-shadow)}
.theme-btn{min-height:40px;border:1px solid transparent;padding:6px 10px;border-radius:10px;font-size:11px;font-weight:650;cursor:pointer;background:transparent;color:var(--text-muted);transition:color .2s,background .2s,border-color .2s;letter-spacing:.2px}
.theme-btn.active{background:var(--accent);color:#fff}
.btn{padding:8px 18px;border-radius:20px;border:1px solid var(--border-subtle);background:transparent;color:var(--text-secondary);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-size:15px;padding:10px 28px}
.btn.primary:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Card */
.card{background:var(--bg-card);border-radius:16px;padding:32px;box-shadow:var(--card-shadow);margin-bottom:16px}
.card.sync-target{scroll-margin-top:16px;border:1px solid var(--accent);box-shadow:0 0 0 3px var(--accent-glow),var(--card-shadow)}
.card h2{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}
.card-subtitle{font-size:12px;color:var(--text-muted);margin-bottom:20px}
.mode-badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:12px;background:var(--accent-glow);color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.5px;margin-left:6px;vertical-align:2px}

/* Form */
.form-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group.grow{flex:1;min-width:150px}
.form-group label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.form-group input[type=date],.form-group input[type=number]{padding:8px 12px;border-radius:10px;border:1px solid var(--border-subtle);background:var(--bg-subtle);color:var(--text);font-size:14px;outline:none;font-family:inherit;transition:border-color .2s}
.form-group input:focus{border-color:var(--accent)}
.form-group input[type=number]{width:72px;text-align:center}
.single-date-picker{display:grid;gap:12px;margin-bottom:16px}.selected-date{display:grid;gap:2px;padding:14px 16px;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--border-subtle));border-radius:14px;background:linear-gradient(135deg,var(--accent-glow),var(--bg-card));}.selected-date span{font-size:10px;font-weight:750;letter-spacing:.6px;color:var(--accent);text-transform:uppercase}.selected-date strong{font-size:18px;color:var(--text);line-height:1.35}.selected-date small{font-size:12px;color:var(--text-secondary)}.date-picker-actions{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:stretch}.date-step{display:grid;place-items:center;min-height:48px;border:1px solid var(--border-subtle);border-radius:12px;background:var(--bg-subtle);color:var(--text-secondary);font-size:22px;cursor:pointer;transition:border-color .2s,color .2s,background .2s}.date-step:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}.date-step:disabled{opacity:.35;cursor:not-allowed}.date-input-label{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:9px;min-height:48px;padding:0 12px;border:1px solid var(--border-subtle);border-radius:12px;background:var(--bg-card);color:var(--text-secondary);cursor:pointer}.date-input-label span{font-size:11px;font-weight:700;color:var(--text-muted);white-space:nowrap}.date-input-label input[type=date]{min-width:0;width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:14px;font-weight:700;cursor:pointer;color-scheme:light}.date-shortcuts{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:18px}.date-shortcuts button{min-height:34px;padding:5px 12px;border:1px solid var(--border-subtle);border-radius:999px;background:var(--bg-subtle);color:var(--text-secondary);font-size:12px;font-weight:650;cursor:pointer;transition:border-color .2s,color .2s,background .2s}.date-shortcuts button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}.date-selection-help{flex:1;min-width:150px;color:var(--text-muted);font-size:11px;line-height:1.45;text-align:right}
.range-arrow{color:var(--text-muted);padding-bottom:9px}
.check-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.check-row label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);cursor:pointer}
.check-row input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}

/* Status */
.status-row{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:13px;color:var(--text-secondary)}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--text-muted);flex-shrink:0}
.status-dot.ok{background:var(--performance)}
.result-msg{font-size:15px;font-weight:600;color:var(--accent);text-align:center;padding:16px 0;line-height:1.6}
.result-msg a{color:var(--recovery)}
.result-msg.error{color:var(--danger)}
.task-card{border:1px solid color-mix(in srgb,var(--accent) 28%,var(--border-subtle));padding:24px}
.task-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.task-title{font-size:16px;font-weight:750;color:var(--text)}
.task-range{margin-top:3px;color:var(--text-muted);font-size:11px}
.task-badge{flex-shrink:0;padding:4px 10px;border-radius:999px;background:var(--accent-glow);color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.4px}
.task-badge.queued{background:color-mix(in srgb,var(--warning) 12%,transparent);color:var(--warning)}
.task-badge.failed,.task-badge.interrupted{background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger)}
.task-badge.succeeded{background:var(--performance-glow);color:var(--performance)}
.task-progress{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:14px}
.task-progress-step{height:7px;border-radius:999px;background:var(--bg-subtle);border:1px solid var(--border-subtle);transition:background .25s,border-color .25s}
.task-progress-step.done{background:var(--accent);border-color:var(--accent)}
.task-progress-step.current{background:color-mix(in srgb,var(--accent) 55%,var(--bg-subtle));border-color:var(--accent)}
.task-stage{font-size:14px;font-weight:650;color:var(--text);margin-bottom:4px}
.task-detail{font-size:12px;color:var(--text-secondary);line-height:1.65}
.task-detail.error{color:var(--danger)}
.task-item-progress{margin-top:12px;padding:12px;border-radius:11px;background:var(--bg-subtle);border:1px solid var(--border-subtle)}
.task-item-copy{display:flex;justify-content:space-between;gap:10px;margin-bottom:7px;color:var(--text-secondary);font-size:10px;line-height:1.4}
.task-item-copy span:last-child{color:var(--text-muted);text-align:right}
.task-item-track{height:6px;overflow:hidden;border-radius:999px;background:var(--border-subtle)}
.task-item-bar{width:0;height:100%;border-radius:inherit;background:var(--accent);transition:width .25s ease}
.task-meta{margin-top:10px;color:var(--text-muted);font-size:10px}
.task-actions{display:flex;justify-content:flex-end;margin-top:16px}
.history-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;transition:background .15s}
.history-row:hover{background:var(--bg-subtle)}

/* Sync calendar */
.calendar-card{padding:24px}
.calendar-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.calendar-title{font-size:17px;font-weight:750;letter-spacing:.2px}
.calendar-nav{display:flex;align-items:center;gap:6px}
.calendar-nav-btn{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid var(--border-subtle);border-radius:50%;background:var(--bg-subtle);color:var(--text-secondary);font-size:18px;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.calendar-nav-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.calendar-nav-btn:disabled{opacity:.35;cursor:not-allowed}
.calendar-summary{min-height:20px;margin-bottom:16px;color:var(--text-secondary);font-size:12px}
.calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calendar-weekdays{margin-bottom:6px;color:var(--text-muted);font-size:10px;font-weight:700;text-align:center}
.calendar-day{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;aspect-ratio:1;border:1px solid transparent;border-radius:12px;background:var(--bg-subtle);color:var(--text-secondary);font:inherit;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.calendar-day:hover:not(:disabled){transform:translateY(-1px);border-color:var(--accent)}
.calendar-day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.calendar-day.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
.calendar-day.today{outline:2px solid color-mix(in srgb,var(--accent) 72%,white);outline-offset:1px;box-shadow:0 0 0 4px var(--accent-glow)}
.calendar-day-number{font-size:13px;font-weight:700;line-height:1}
.calendar-day-detail{font-size:8px;line-height:1;color:currentColor;opacity:.78;white-space:nowrap}
.calendar-day.status-synced{background:var(--performance-glow);color:var(--performance);border-color:color-mix(in srgb,var(--performance) 34%,transparent)}
.calendar-day.status-partial{background:var(--accent-glow);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.calendar-day.status-failed{background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.calendar-day.status-syncing{background:color-mix(in srgb,var(--warning) 12%,transparent);color:var(--warning);border-color:color-mix(in srgb,var(--warning) 35%,transparent)}
.calendar-day.status-unsynced{color:var(--text-muted)}
.calendar-day.status-future{background:transparent;color:var(--text-muted);opacity:.35;cursor:not-allowed}
.calendar-empty{aspect-ratio:1}
.calendar-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:16px;color:var(--text-muted);font-size:10px}
.calendar-legend-item{display:inline-flex;align-items:center;gap:5px}
.calendar-legend-dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted)}
.calendar-legend-dot.synced{background:var(--performance)}
.calendar-legend-dot.partial{background:var(--accent)}
.calendar-legend-dot.failed{background:var(--danger)}
.calendar-legend-dot.syncing{background:var(--warning)}
.calendar-loading,.calendar-error{grid-column:1/-1;padding:28px 0;text-align:center;color:var(--text-muted);font-size:12px}
.calendar-error{color:var(--danger)}
.footer{text-align:center;padding:40px 0 20px;font-size:11px;color:var(--text-muted)}
.footer span{background:linear-gradient(135deg,var(--accent),#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700}
@media(min-width:641px){
  .container{padding:24px 20px 80px}
  .app-header{padding-bottom:20px}
  .app-brand{display:none}
  .app-nav{position:static;transform:none;width:auto;display:flex;padding:4px;border-radius:24px;box-shadow:var(--card-shadow);-webkit-backdrop-filter:none;backdrop-filter:none}
  .app-nav-item{flex-direction:row;gap:7px;min-width:84px;min-height:40px;padding:8px 16px;border-radius:20px}
  .app-nav-icon{width:17px;height:17px}
  .app-nav-label{font-size:12px}
  .theme-btn{min-height:36px;border-radius:20px;padding:5px 12px}
}
@media(hover:hover){
  .app-nav-item:hover{color:var(--accent);background:var(--accent-glow)}
  .theme-btn:hover{opacity:.82}
}
@media(max-width:480px){
  .container{padding-inline:12px}
  .calendar-card{padding:18px 14px}
  .calendar-weekdays,.calendar-grid{gap:4px}
  .calendar-day{border-radius:9px}
  .calendar-day-number{font-size:12px}
  .calendar-day-detail{font-size:7px}
  .date-selection-help{flex-basis:100%;text-align:left}
}
</style>
</head>
<body data-theme="dark">

<div class="container">

<header class="app-header">
  <div class="app-brand" aria-hidden="true"><span class="app-brand-mark">n</span><span>neurun</span></div>
  <nav class="app-nav" aria-label="主要导航">
    <a href="/training" class="app-nav-item" data-nav-item>
      <svg class="app-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h3l2-5 4 10 2-5h5"/><path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg>
      <span class="app-nav-label">训练</span>
    </a>
    <a href="/reports" class="app-nav-item" data-nav-item>
      <svg class="app-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      <span class="app-nav-label">报告</span>
    </a>
    <a href="/sync" class="app-nav-item" data-nav-item aria-current="page">
      <svg class="app-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7h-3.5A7 7 0 0 0 5 9M20 3v4h-4M4 17h3.5A7 7 0 0 0 19 15M4 21v-4h4"/></svg>
      <span class="app-nav-label">同步</span>
    </a>
    <a href="/profile" class="app-nav-item" data-nav-item>
      <svg class="app-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c.5-4 3-6 7-6s6.5 2 7 6"/></svg>
      <span class="app-nav-label">我的</span>
    </a>
  </nav>
  <div class="theme-bar" role="group" aria-label="主题">
    <button class="theme-btn active" data-theme="dark" onclick="setTheme('dark')">暗黑</button>
    <button class="theme-btn" data-theme="sport" onclick="setTheme('sport')">运动</button>
    <button class="theme-btn" data-theme="fresh" onclick="setTheme('fresh')">清新</button>
  </div>
</header>

<!-- Sync Calendar -->
<section class="card calendar-card" aria-labelledby="calendarMonthLabel">
  <div class="calendar-header">
    <div>
      <div class="calendar-title" id="calendarMonthLabel">同步日历</div>
    </div>
    <div class="calendar-nav">
      <button class="calendar-nav-btn" id="calendarPrev" type="button" aria-label="上个月" onclick="moveCalendarMonth(-1)">‹</button>
      <button class="calendar-nav-btn" id="calendarNext" type="button" aria-label="下个月" onclick="moveCalendarMonth(1)">›</button>
    </div>
  </div>
  <div class="calendar-summary" id="calendarSummary" aria-live="polite">正在读取同步记录...</div>
  <div class="calendar-weekdays" aria-hidden="true">
    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
  </div>
  <div class="calendar-grid" id="syncCalendar" aria-label="逐日同步状态">
    <div class="calendar-loading">加载中...</div>
  </div>
  <div class="calendar-legend" aria-label="同步状态图例">
    <span class="calendar-legend-item"><i class="calendar-legend-dot synced"></i>已同步</span>
    <span class="calendar-legend-item"><i class="calendar-legend-dot partial"></i>部分完成</span>
    <span class="calendar-legend-item"><i class="calendar-legend-dot failed"></i>失败</span>
    <span class="calendar-legend-item"><i class="calendar-legend-dot syncing"></i>同步中</span>
    <span class="calendar-legend-item"><i class="calendar-legend-dot"></i>未同步</span>
  </div>
</section>

<!-- Single-day Sync -->
<div class="card" id="single-sync">
  <h2>单日补同步</h2>
  <div class="card-subtitle">从上方日历选择，或直接修改日期；只拉取并保存数据，不生成报告。</div>

  <div class="single-date-picker" aria-label="选择单日同步日期">
    <div class="selected-date" aria-live="polite"><span>本次同步目标</span><strong id="singleDateLabel">—</strong><small id="singleDateHint">可从上方日历改选</small></div>
    <div class="date-picker-actions">
      <button class="date-step" id="singleDatePrev" type="button" aria-label="前一天" onclick="shiftSingleDate(-1)">‹</button>
      <label class="date-input-label" for="singleDate"><span>修改日期</span><input type="date" id="singleDate" aria-label="选择同步日期"></label>
      <button class="date-step" id="singleDateNext" type="button" aria-label="后一天" onclick="shiftSingleDate(1)">›</button>
    </div>
  </div>
  <div class="date-shortcuts" role="group" aria-label="同步日期快捷选择"><button type="button" onclick="setSingleDateOffset(-1)">昨天</button><button type="button" onclick="setSingleDateOffset(0)">今天</button><span class="date-selection-help">日历中的选择会自动带到这里</span></div>

  <div class="check-row">
    <label><input type="checkbox" id="singleForce"> 强制覆盖该日已有数据</label>
  </div>

  <div style="text-align:center">
    <button class="btn primary sync-action" id="singleSyncBtn" data-label="📥 同步这一天" onclick="doSingleSync()">📥 同步这一天</button>
  </div>
</div>

<!-- Batch Sync -->
<div class="card">
  <h2>📚 批量同步 <span class="mode-badge">BATCH</span></h2>
  <div class="card-subtitle">按明确的开始和结束日期批量补齐数据，不生成日报。</div>

  <div class="form-row">
    <div class="form-group grow">
      <label>开始日期</label>
      <input type="date" id="batchFromDate">
    </div>
    <span class="range-arrow">→</span>
    <div class="form-group grow">
      <label>结束日期</label>
      <input type="date" id="batchToDate">
    </div>
  </div>

  <div class="check-row">
    <label><input type="checkbox" id="batchForce"> 强制覆盖范围内已有数据</label>
  </div>

  <div style="text-align:center">
    <button class="btn primary sync-action" id="batchSyncBtn" data-label="📦 同步日期范围" onclick="doBatchSync()">📦 同步日期范围</button>
  </div>
</div>

<div id="syncResult"></div>

<section class="card task-card" id="syncTaskCard" aria-live="polite" hidden>
  <div class="task-header">
    <div>
      <div class="task-title">同步任务</div>
      <div class="task-range" id="syncTaskRange"></div>
    </div>
    <span class="task-badge queued" id="syncTaskBadge">已排队</span>
  </div>
  <div class="task-progress" id="syncTaskProgress" aria-label="同步阶段进度"></div>
  <div class="task-stage" id="syncTaskStage">等待执行</div>
  <div class="task-detail" id="syncTaskDetail">任务已接纳，可以关闭或刷新页面。</div>
  <div class="task-item-progress" id="syncTaskItemProgress" hidden>
    <div class="task-item-copy"><span id="syncTaskItemCount"></span><span id="syncTaskItemContext"></span></div>
    <div class="task-item-track" role="progressbar" id="syncTaskItemTrack" aria-label="当前阶段已处理项" aria-valuemin="0"><div class="task-item-bar" id="syncTaskItemBar"></div></div>
  </div>
  <div class="task-meta" id="syncTaskMeta"></div>
  <div class="task-actions"><a class="btn" id="syncTaskAction" href="#" hidden></a></div>
</section>

<!-- Status Card -->
<div class="card">
  <h2>📊 连接状态</h2>
  <div class="status-row"><span class="status-dot" id="statusDot"></span><span id="statusText">加载中...</span></div>
  <div class="status-row" style="font-size:12px;color:var(--text-muted)" id="statusDetail"></div>
</div>

<div class="footer">Built with <span>neurun</span></div>

</div>

<script>
var savedTheme=localStorage.getItem('neurun-theme')||'dark';
document.body.setAttribute('data-theme',savedTheme);
document.querySelectorAll('.theme-btn').forEach(function(b){b.classList.toggle('active',b.dataset.theme===savedTheme)});
function setTheme(t){document.body.setAttribute('data-theme',t);localStorage.setItem('neurun-theme',t);document.querySelectorAll('.theme-btn').forEach(function(b){b.classList.toggle('active',b.dataset.theme===t)})}

function localDateString(d){
  var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
var now=new Date(),today=localDateString(now),monthAgo=new Date(now);
monthAgo.setDate(monthAgo.getDate()-30);
var requestedReportDate=new URLSearchParams(location.search).get('date');
var syncQuery=new URLSearchParams(location.search),syncSource=syncQuery.get('from')||'',requestedReturnTo=syncQuery.get('return_to')||'';
if(!/^\d{4}-\d{2}-\d{2}$/.test(requestedReportDate||'')||requestedReportDate>today){requestedReportDate=''}
document.getElementById('singleDate').value=requestedReportDate||today;
document.getElementById('singleDate').max=today;
document.getElementById('batchFromDate').value=localDateString(monthAgo);
document.getElementById('batchToDate').value=today;

var initialCalendarDate=requestedReportDate?new Date(requestedReportDate+'T00:00:00'):now;
var calendarCursor=new Date(initialCalendarDate.getFullYear(),initialCalendarDate.getMonth(),1);
var activeSyncTaskId=null,syncPollTimer=null,syncPollFailures=0,syncPollInFlight=false,calendarDaysByDate={};
var ACTIVE_SYNC_TASK_KEY='neurun-sync-active-task';
var calendarLabels={
  synced:'已同步',partial:'部分完成',failed:'同步失败',syncing:'同步中',
  unsynced:'未同步',future:'未来日期'
};

function calendarMonthKey(){
  return calendarCursor.getFullYear()+'-'+String(calendarCursor.getMonth()+1).padStart(2,'0');
}

function moveCalendarMonth(offset){
  calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+offset,1);
  loadSyncCalendar();
}

function selectCalendarDate(syncDate){
  document.getElementById('singleDate').value=syncDate;
  updateSingleDateUI();
  document.querySelectorAll('.calendar-day').forEach(function(day){
    day.classList.toggle('selected',day.dataset.date===syncDate);
  });
  document.getElementById('singleDate').scrollIntoView({behavior:'smooth',block:'center'});
}

function formatSingleDate(value){
  var parsed=new Date(value+'T00:00:00');
  if(isNaN(parsed.getTime()))return '请选择日期';
  return (parsed.getMonth()+1)+' 月 '+parsed.getDate()+' 日 · '+['周日','周一','周二','周三','周四','周五','周六'][parsed.getDay()];
}
function updateSingleDateUI(){
  var input=document.getElementById('singleDate'),value=input.value,next=document.getElementById('singleDateNext');
  document.getElementById('singleDateLabel').textContent=formatSingleDate(value);
  var selectedDay=calendarDaysByDate[value],hint=document.getElementById('singleDateHint');
  if(selectedDay){
    var status=calendarLabels[selectedDay.status]||selectedDay.status;
    var activityCount=Number(selectedDay.running_count)||Number(selectedDay.activity_count)||0;
    hint.textContent=status+(activityCount?' · 已发现 '+activityCount+(selectedDay.running_count?' 次跑步':' 条运动'):'');
  }else{hint.textContent='可从上方日历改选';}
  next.disabled=!value||value>=today;
  document.querySelectorAll('.calendar-day').forEach(function(day){day.classList.toggle('selected',day.dataset.date===value)});
}
function shiftSingleDate(offset){
  var input=document.getElementById('singleDate'),selected=input.value||today,parsed=new Date(selected+'T00:00:00');
  parsed.setDate(parsed.getDate()+offset);
  var value=localDateString(parsed);
  if(value>today)return;
  input.value=value;
  var cursorKey=calendarMonthKey(),nextKey=value.slice(0,7);
  updateSingleDateUI();
  if(cursorKey!==nextKey){calendarCursor=new Date(parsed.getFullYear(),parsed.getMonth(),1);loadSyncCalendar()}
}
function setSingleDateOffset(offset){
  var value=localDateString(new Date(now.getFullYear(),now.getMonth(),now.getDate()+offset));
  document.getElementById('singleDate').value=value;
  var parsed=new Date(value+'T00:00:00');
  calendarCursor=new Date(parsed.getFullYear(),parsed.getMonth(),1);
  updateSingleDateUI();loadSyncCalendar();
}
document.getElementById('singleDate').addEventListener('change',function(){
  var value=this.value;if(!value||value>today){this.value=today}
  var parsed=new Date(this.value+'T00:00:00');calendarCursor=new Date(parsed.getFullYear(),parsed.getMonth(),1);
  updateSingleDateUI();loadSyncCalendar();
});

function anchorRequestedSyncDate(){
  if(!requestedReportDate)return;
  var requestedCard=document.getElementById('single-sync');
  requestedCard.classList.add('sync-target');
  requestedCard.scrollIntoView({behavior:'smooth',block:'start'});
}

function renderSyncCalendar(payload){
  var grid=document.getElementById('syncCalendar'),summary=document.getElementById('calendarSummary');
  var parts=payload.month.split('-'),year=Number(parts[0]),month=Number(parts[1]);
  document.getElementById('calendarMonthLabel').textContent=year+' 年 '+month+' 月';
  calendarDaysByDate={};payload.days.forEach(function(day){calendarDaysByDate[day.date]=day});
  grid.innerHTML='';

  var firstWeekday=new Date(year,month-1,1).getDay();
  for(var blank=0;blank<firstWeekday;blank++){
    var spacer=document.createElement('span');
    spacer.className='calendar-empty';
    spacer.setAttribute('aria-hidden','true');
    grid.appendChild(spacer);
  }

  payload.days.forEach(function(day){
    var dayDate=new Date(day.date+'T00:00:00');
    var button=document.createElement('button');
    var label=calendarLabels[day.status]||day.status;
    var details=[];
    if(day.running_count){details.push(day.running_count+' 条跑步')}
    else if(day.activity_count){details.push(day.activity_count+' 条运动')}
    if(day.has_health){details.push('有健康数据')}
    button.type='button';
    button.className='calendar-day status-'+day.status+(day.date===today?' today':'')+(day.date===document.getElementById('singleDate').value?' selected':'');
    button.dataset.date=day.date;
    button.disabled=day.status==='future';
    if(day.date===today){button.setAttribute('aria-current','date')}
    button.setAttribute('aria-label',(dayDate.getMonth()+1)+'月'+dayDate.getDate()+'日，'+label+(details.length?'，'+details.join('，'):''));
    button.title=label+(details.length?' · '+details.join(' · '):'');
    if(!button.disabled){button.addEventListener('click',function(){selectCalendarDate(day.date)})}

    var number=document.createElement('span');
    number.className='calendar-day-number';
    number.textContent=String(dayDate.getDate());
    button.appendChild(number);
    var detail=document.createElement('span');
    detail.className='calendar-day-detail';
    detail.textContent=day.running_count?day.running_count+' 次跑':(day.activity_count?day.activity_count+' 次':label);
    button.appendChild(detail);
    grid.appendChild(button);
  });

  var s=payload.summary||{},eligible=(s.total_days||0)-(s.future||0);
  var text='已同步 '+(s.synced||0)+' / '+eligible+' 天';
  if(s.partial){text+=' · '+s.partial+' 天部分完成'}
  if(s.failed){text+=' · '+s.failed+' 天失败'}
  if(s.latest_synced_date){text+=' · 已同步至 '+s.latest_synced_date}
  summary.textContent=text;

  var currentMonthStart=new Date(now.getFullYear(),now.getMonth(),1);
  document.getElementById('calendarNext').disabled=calendarCursor>=currentMonthStart;
  updateSingleDateUI();
  anchorRequestedSyncDate();
}

async function loadSyncCalendar(){
  var grid=document.getElementById('syncCalendar'),summary=document.getElementById('calendarSummary');
  grid.innerHTML='<div class="calendar-loading">加载中...</div>';
  summary.textContent='正在读取同步记录...';
  try{
    var r=await fetch('/api/sync/calendar?month='+encodeURIComponent(calendarMonthKey()),{cache:'no-store'});
    var payload=await r.json();
    if(r.status===401){location.href='/setup';return}
    if(!r.ok){throw new Error(payload.message||'同步日历加载失败')}
    renderSyncCalendar(payload);
  }catch(e){
    grid.innerHTML='<div class="calendar-error"></div>';
    grid.firstChild.textContent=e.message||'同步日历加载失败';
    summary.textContent='暂时无法读取同步记录';
  }
}

async function loadStatus(){
  try{
    var r=await fetch('/api/status');
    if(r.status===401){location.href='/setup';return}
    var d=await r.json();
    var dot=document.getElementById('statusDot'),txt=document.getElementById('statusText'),dtl=document.getElementById('statusDetail');
    if(d.token_status==='active'){dot.className='status-dot ok';txt.textContent='已连接';dtl.textContent=(d.last_sync?'上次同步: '+d.last_sync:'尚未同步')}
    else{dot.className='status-dot';txt.textContent='未连接';dtl.textContent=''}
  }catch(e){}
}

function showSyncError(message){
  var el=document.getElementById('syncResult'),msg=document.createElement('div');
  el.innerHTML='';msg.className='result-msg error';msg.textContent='❌ '+message;el.appendChild(msg);
}

function setSyncButtonsBusy(busy){
  document.querySelectorAll('.sync-action').forEach(function(button){
    button.disabled=busy;
    if(!busy){button.textContent=button.dataset.label}
  });
}

function saveActiveSyncTask(taskId){
  activeSyncTaskId=taskId;
  try{localStorage.setItem(ACTIVE_SYNC_TASK_KEY,taskId)}catch(e){}
}

function clearActiveSyncTask(){
  activeSyncTaskId=null;
  if(syncPollTimer){clearTimeout(syncPollTimer);syncPollTimer=null}
  try{localStorage.removeItem(ACTIVE_SYNC_TASK_KEY)}catch(e){}
}

function resetTaskCard(){
  clearActiveSyncTask();
  document.getElementById('syncTaskCard').hidden=true;
  setSyncButtonsBusy(false);
}

function renderSyncTask(task){
  var card=document.getElementById('syncTaskCard'),badge=document.getElementById('syncTaskBadge');
  var progress=task.progress||{kind:'stage',current:0,total:4,label:'等待执行'};
  var current=Math.max(0,Math.min(Number(progress.current)||0,Number(progress.total)||4));
  var total=Math.max(1,Number(progress.total)||4),segments=document.getElementById('syncTaskProgress');
  var statusLabels={queued:'已排队',running:'同步中',succeeded:'已完成',failed:'失败',interrupted:'已中断'};
  card.hidden=false;badge.className='task-badge '+task.status;badge.textContent=statusLabels[task.status]||task.status;
  document.getElementById('syncTaskRange').textContent=(task.from_date||'')+(task.to_date&&task.to_date!==task.from_date?' → '+task.to_date:'');
  segments.innerHTML='';
  for(var i=1;i<=total;i++){
    var segment=document.createElement('span');
    segment.className='task-progress-step'+(task.status==='succeeded'&&i<=current?' done':(i<current?' done':(i===current?' current':'')));
    segments.appendChild(segment);
  }
  var stage=document.getElementById('syncTaskStage'),detail=document.getElementById('syncTaskDetail');
  stage.textContent=progress.label||statusLabels[task.status]||'同步任务';detail.className='task-detail';
  if(task.status==='queued')detail.textContent='任务已接纳，可以关闭或刷新页面。';
  else if(task.status==='running')detail.textContent='阶段 '+current+' / '+total+'；进度来自实际处理事件，不按耗时估算。';
  else if(task.status==='succeeded')detail.textContent=(task.result&&task.result.message)||'数据同步和备份已完成。';
  else{detail.className='task-detail error';detail.textContent=(task.error&&task.error.message)||'同步任务未完成。'}

  var items=progress.items,itemBox=document.getElementById('syncTaskItemProgress');
  var itemTotal=items?Math.max(0,Number(items.total)||0):0;
  var itemCurrent=items?Math.max(0,Math.min(Number(items.current)||0,itemTotal)):0;
  itemBox.hidden=!(task.status==='running'&&itemTotal>0);
  if(!itemBox.hidden){
    var percent=Math.round(itemCurrent/itemTotal*100);
    var metricLabels={daily_summary:'每日概览',daily_health:'每日健康',sleep:'睡眠',activities:'活动',body_battery:'身体电量',stress:'压力',heart_rate:'心率',training_readiness:'训练准备度',hrv:'HRV',respiration:'呼吸',steps:'步数',calories:'卡路里'};
    var outcomeLabels={completed:'完成',skipped:'跳过',failed:'失败',started:'准备中'};
    document.getElementById('syncTaskItemCount').textContent='已处理 '+itemCurrent+' / '+itemTotal+' 项（'+percent+'%）';
    document.getElementById('syncTaskItemContext').textContent=[items.date,metricLabels[items.metric]||items.metric,outcomeLabels[items.outcome]||''].filter(Boolean).join(' · ');
    document.getElementById('syncTaskItemBar').style.width=percent+'%';
    var itemTrack=document.getElementById('syncTaskItemTrack');itemTrack.setAttribute('aria-valuenow',String(itemCurrent));itemTrack.setAttribute('aria-valuemax',String(itemTotal));
  }
  document.getElementById('syncTaskMeta').textContent='任务 '+task.task_id+(task.updated_at?' · 更新于 '+task.updated_at.replace('T',' ').replace('Z',' UTC'):'');

  var action=document.getElementById('syncTaskAction');action.hidden=true;action.onclick=null;
  if(task.status==='succeeded'){
    var returnDate=requestedReportDate||task.to_date||task.from_date||'';
    action.hidden=false;
    if(requestedReturnTo&&requestedReturnTo.startsWith('/')){action.href=requestedReturnTo;action.textContent=syncSource==='training'?'返回训练页':'返回上一页'}
    else{action.href='/reports?tab=daily'+(returnDate?'&date='+encodeURIComponent(returnDate):'');action.textContent='前往报告页'}
  }else if(task.status==='failed'||task.status==='interrupted'){
    action.hidden=false;
    if(task.error&&task.error.action==='reauthorize'){
      action.href='/setup';action.textContent='重新绑定';
    }else{
      action.href='#';action.textContent='重新发起';action.onclick=function(event){event.preventDefault();resetTaskCard()};
    }
  }
  setSyncButtonsBusy(task.status==='queued'||task.status==='running');
}

function scheduleSyncTaskPoll(taskId,delayMs){
  if(syncPollTimer){clearTimeout(syncPollTimer)}
  syncPollTimer=setTimeout(function(){pollSyncTask(taskId)},delayMs);
}

async function pollSyncTask(taskId){
  if(!taskId||syncPollInFlight||taskId!==activeSyncTaskId)return;
  syncPollInFlight=true;
  try{
    var r=await fetch('/api/sync/tasks/'+encodeURIComponent(taskId),{cache:'no-store'});
    var task=await r.json();
    if(r.status===401){location.href='/login';return}
    if(r.status===404){resetTaskCard();return}
    if(!r.ok){throw new Error(task.message||'任务状态读取失败')}
    renderSyncTask(task);syncPollFailures=0;
    if(task.status==='queued'||task.status==='running'){
      var retryAfter=Number(r.headers.get('Retry-After'))||1;
      scheduleSyncTaskPoll(taskId,Math.max(1,retryAfter)*1000);
    }else{
      clearActiveSyncTask();setSyncButtonsBusy(false);
      loadStatus();
      if(task.status==='succeeded'){
        if(task.to_date){var syncedEnd=new Date(task.to_date+'T00:00:00');calendarCursor=new Date(syncedEnd.getFullYear(),syncedEnd.getMonth(),1)}
        loadSyncCalendar();
      }
    }
  }catch(e){
    syncPollFailures+=1;
    var delays=[1000,2000,4000,5000],delay=delays[Math.min(syncPollFailures-1,delays.length-1)];
    document.getElementById('syncTaskCard').hidden=false;
    document.getElementById('syncTaskDetail').textContent='网络暂时不可用，正在自动恢复任务状态…';
    scheduleSyncTaskPoll(taskId,delay);
  }finally{syncPollInFlight=false}
}

async function submitSync(btn,body){
  if(activeSyncTaskId){pollSyncTask(activeSyncTaskId);return}
  setSyncButtonsBusy(true);btn.innerHTML='<span class="spinner"></span>正在发起...';
  document.getElementById('syncResult').innerHTML='';
  try{
    var r=await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var d=await r.json();
    if((r.status===202||r.status===409)&&d.task_id){
      saveActiveSyncTask(d.task_id);
      renderSyncTask({task_id:d.task_id,status:'queued',from_date:d.from_date||body.from_date||body.date,to_date:d.to_date||body.to_date||body.date,progress:{kind:'stage',current:0,total:4,label:'等待执行'}});
      scheduleSyncTaskPoll(d.task_id,200);
    }else if(r.status===401){
      showSyncError(d.message||'登录已失效');setSyncButtonsBusy(false);
    }else{
      showSyncError(d.message||'同步任务发起失败');setSyncButtonsBusy(false);
    }
  }catch(e){
    showSyncError('网络错误: '+e.message);setSyncButtonsBusy(false);
  }
}

function doSingleSync(){
  var syncDate=document.getElementById('singleDate').value;
  if(!syncDate){showSyncError('请选择单日同步日期');return}
  submitSync(document.getElementById('singleSyncBtn'),{
    mode:'single',date:syncDate,force:document.getElementById('singleForce').checked
  });
}

function doBatchSync(){
  var fromDate=document.getElementById('batchFromDate').value,toDate=document.getElementById('batchToDate').value;
  if(!fromDate||!toDate){showSyncError('请选择批量同步的开始和结束日期');return}
  if(fromDate>toDate){showSyncError('开始日期不能晚于结束日期');return}
  submitSync(document.getElementById('batchSyncBtn'),{
    mode:'batch',from_date:fromDate,to_date:toDate,force:document.getElementById('batchForce').checked
  });
}

loadSyncCalendar();
updateSingleDateUI();
loadStatus();
if(requestedReportDate){
  var requestedCard=document.getElementById('single-sync');
  requestedCard.classList.add('sync-target');
}
try{
  var restoredTaskId=localStorage.getItem(ACTIVE_SYNC_TASK_KEY);
  if(restoredTaskId){saveActiveSyncTask(restoredTaskId);setSyncButtonsBusy(true);pollSyncTask(restoredTaskId)}
}catch(e){}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&activeSyncTaskId){
    if(syncPollTimer){clearTimeout(syncPollTimer);syncPollTimer=null}
    pollSyncTask(activeSyncTaskId);
  }
});
</script>
</body>
</html>
