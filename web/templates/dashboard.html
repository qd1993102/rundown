<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>neurun — 训练日报</title>
<style>
/* ═══════════════════════════════════════════
   neurun Dashboard — 复用 render.py 三主题系统
   ═══════════════════════════════════════════ */

[data-theme="fresh"] {
  --bg:#e8efe9; --bg-card:#fff; --text:#1a2e23; --text-secondary:#5a7d6e; --text-muted:#8aa89a;
  --accent:#2d9d6f; --accent-glow:rgba(45,157,111,.1); --recovery:#3b82b6; --recovery-glow:rgba(59,130,246,.08);
  --performance:#22a86e; --performance-glow:rgba(34,168,110,.08); --sleep:#7c6fcf; --sleep-glow:rgba(124,111,207,.08);
  --warning:#d4a017; --danger:#dc5b51; --hrv:#3b9fc6;
  --card-shadow:0 2px 8px rgba(0,0,0,.06); --card-shadow-hover:0 8px 30px rgba(0,0,0,.1);
  --border-subtle:#dde5df; --bg-subtle:#f0f4f0;
}
[data-theme="sport"] {
  --bg:#f0f0f0; --bg-card:#fff; --text:#171717; --text-secondary:#525252; --text-muted:#a3a3a3;
  --accent:#f15b2a; --accent-glow:rgba(241,91,42,.08); --recovery:#2563eb; --recovery-glow:rgba(37,99,235,.08);
  --performance:#16a34a; --performance-glow:rgba(22,163,74,.08); --sleep:#7c3aed; --sleep-glow:rgba(124,58,237,.08);
  --warning:#eab308; --danger:#ef4444; --hrv:#0891b2;
  --card-shadow:0 2px 10px rgba(0,0,0,.07); --card-shadow-hover:0 10px 35px rgba(0,0,0,.1);
  --border-subtle:#ebebeb; --bg-subtle:#f5f5f5;
}
[data-theme="dark"] {
  --bg:#0b1120; --bg-card:#1a2333; --text:#e2e8f0; --text-secondary:#94a3b8; --text-muted:#64748b;
  --accent:#34d399; --accent-glow:rgba(52,211,153,.12); --recovery:#60a5fa; --recovery-glow:rgba(96,165,250,.1);
  --performance:#4ade80; --performance-glow:rgba(74,222,128,.1); --sleep:#a78bfa; --sleep-glow:rgba(167,139,250,.1);
  --warning:#fbbf24; --danger:#f87171; --hrv:#22d3ee;
  --card-shadow:0 2px 10px rgba(0,0,0,.35); --card-shadow-hover:0 10px 30px rgba(0,0,0,.5);
  --border-subtle:#243044; --bg-subtle:#151e2c;
}

*{margin:0;padding:0;box-sizing:border-box}
html{min-width:320px;background:var(--bg)}
body{min-width:320px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.container{width:100%;max-width:720px;margin:0 auto;padding:12px 12px calc(112px + env(safe-area-inset-bottom))}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ── Shared app navigation ── */
.app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 12px}
.app-brand{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px;font-weight:800;letter-spacing:.2px}
.app-brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:11px;background:var(--accent);color:#fff;font-size:17px;font-weight:900}
.app-nav{position:fixed;z-index:50;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 24px),520px);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border:1px solid var(--border-subtle);border-radius:22px;background:color-mix(in srgb,var(--bg-card) 92%,transparent);box-shadow:0 12px 40px rgba(0,0,0,.22);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.app-nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;min-height:54px;padding:6px 5px;border-radius:16px;color:var(--text-muted);text-decoration:none;transition:color .2s,background .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app-nav-item[aria-current="page"]{background:var(--accent-glow);color:var(--accent)}
.app-nav-icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app-nav-label{font-size:10px;font-weight:750;line-height:1;letter-spacing:.2px}
.theme-bar{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--border-subtle);border-radius:14px;background:var(--bg-card);box-shadow:var(--card-shadow)}
.theme-btn{min-height:40px;border:1px solid transparent;padding:6px 10px;border-radius:10px;font-size:11px;font-weight:650;cursor:pointer;background:transparent;color:var(--text-muted);transition:color .2s,background .2s,border-color .2s;letter-spacing:.2px}
.theme-btn.active{background:var(--accent);color:#fff}

/* ── Buttons ── */
.btn{min-height:44px;padding:9px 16px;border-radius:12px;border:1px solid var(--border-subtle);background:transparent;color:var(--text-secondary);font-size:13px;font-weight:700;cursor:pointer;transition:color .2s,background .2s,border-color .2s,opacity .2s;letter-spacing:.3px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Report toolbar ── */
.report-toolbar{display:grid;gap:12px;margin-bottom:16px;padding:16px;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:18px;box-shadow:var(--card-shadow)}
.report-eyebrow{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--accent)}
.report-title{font-size:24px;line-height:1.25;letter-spacing:-.5px}
.report-date-label{margin-top:3px;font-size:12px;color:var(--text-muted)}
.report-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.date-control{min-width:0}
.date-control input{width:100%;min-height:44px;padding:8px 11px;border-radius:12px;border:1px solid var(--border-subtle);background:var(--bg-subtle);color:var(--text);font-size:14px;outline:none;color-scheme:dark}
[data-theme="fresh"] .date-control input,[data-theme="sport"] .date-control input{color-scheme:light}
.date-control input:focus-visible,.btn:focus-visible,.theme-btn:focus-visible,.app-nav-item:focus-visible{outline:3px solid var(--accent-glow);outline-offset:2px;border-color:var(--accent)}
.save-status{min-height:20px;font-size:12px;color:var(--text-muted)}
.save-status.success{color:var(--performance)}
.save-status.error{color:var(--danger)}

/* ── Loading ── */
.loading{text-align:center;padding:64px 20px;color:var(--text-muted);font-size:14px}
.loading .spinner{width:20px;height:20px;border-width:2px;margin-bottom:12px;display:block;margin-left:auto;margin-right:auto}

/* ── Plan Strip ── */
.plan-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px;background:var(--accent-glow);border-radius:14px;padding:14px;border:1px solid var(--border-subtle)}
.plan-item{flex:1;text-align:center}
.plan-val{display:block;font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;font-size:15px;font-weight:700;color:var(--text)}
.plan-lbl{display:block;font-size:10px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.plan-execution-summary{display:grid;gap:10px;margin-bottom:16px;padding:16px;border-radius:16px;background:var(--bg-card);box-shadow:var(--card-shadow);border-left:3px solid var(--accent)}
.plan-execution-summary h2{font-size:16px}.plan-execution-summary p{color:var(--text-secondary);font-size:13px}.plan-execution-meta{display:flex;flex-wrap:wrap;gap:7px}.plan-execution-meta span{padding:4px 8px;border-radius:999px;background:var(--bg-subtle);color:var(--text-secondary);font-size:11px;font-weight:700}
.plan-execution-guidance{margin:0;color:var(--text-secondary);font-size:13px}.plan-execution-summary ul.plan-execution-guidance{margin:0;padding-left:18px}
.today-conclusion{display:grid;gap:8px;margin:0 0 16px;padding:16px;border-radius:16px;background:var(--accent-glow);border:1px solid var(--border-subtle)}.today-conclusion h2{font-size:16px}.today-conclusion p{font-size:14px;color:var(--text-secondary);line-height:1.7}.report-evidence{margin-top:24px;border-radius:16px;background:var(--bg-card);box-shadow:var(--card-shadow)}.report-evidence summary{min-height:52px;display:flex;align-items:center;padding:0 16px;cursor:pointer;color:var(--text);font-size:14px;font-weight:750}.report-evidence-body{padding:0 12px 14px}.report-evidence .section-title{margin:18px 4px 10px}

/* ── Hero Grid ── */
.hero-grid{display:grid;grid-template-columns:repeat(var(--visible-count,3),minmax(0,1fr));gap:8px;margin-bottom:16px}
.hero-card{min-width:0;background:var(--bg-card);border-radius:14px;padding:16px 6px;box-shadow:var(--card-shadow);text-align:center;transition:transform .15s,box-shadow .15s}
.hero-value{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;font-size:clamp(23px,8vw,30px);font-weight:800;letter-spacing:-1px;line-height:1;margin-bottom:5px;white-space:nowrap}
.hero-value span{font-size:10px;font-weight:500;opacity:.55;margin-left:2px}
.hero-value.sleep{color:var(--sleep)}.hero-value.recovery{color:var(--recovery)}.hero-value.readiness{color:var(--performance)}
.hero-label{font-size:11px;color:var(--text-secondary);font-weight:700}
.hero-sub{font-size:10px;color:var(--text-muted);margin-top:2px;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Metric Strip ── */
.metric-strip{display:grid;grid-template-columns:repeat(min(var(--visible-count,2),2),minmax(0,1fr));gap:8px;margin-bottom:24px}
.metric-item{background:var(--bg-card);border-radius:12px;padding:16px 10px;text-align:center;box-shadow:var(--card-shadow)}
.metric-val{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;font-size:23px;font-weight:700;letter-spacing:-.5px;line-height:1}
.metric-val.hrv{color:var(--hrv)}.metric-val.rhr{color:var(--performance)}.metric-val.bb{color:var(--accent)}.metric-val.stress{color:var(--sleep)}
.metric-lbl{font-size:10px;color:var(--text-muted);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}

/* ── Section Titles ── */
.deep-table{width:100%;border-collapse:collapse;margin:4px 0 10px}.deep-table td{padding:5px 8px;font-size:13px;border-bottom:1px solid var(--border-subtle)}.deep-table td:first-child{color:var(--text-muted);white-space:nowrap;width:100px}.deep-block-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin:12px 4px 4px}.deep-p{margin:4px 4px;font-size:13px;color:var(--text-secondary);line-height:1.7}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-muted);margin:24px 0 10px}

/* ── Session Cards ── */
.session-cards{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.session-card{background:var(--bg-card);border-radius:16px;padding:16px;box-shadow:var(--card-shadow);display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:12px;transition:box-shadow .15s}
.session-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:var(--accent-glow)}
.session-info{flex:1;min-width:0}
.session-name{font-weight:600;font-size:15px;color:var(--text)}
.session-type{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
.session-metrics{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-top:12px;border-top:1px solid var(--border-subtle)}
.session-metric{text-align:center}
.session-metric .val{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;font-size:18px;font-weight:700;color:var(--text)}
.session-metric .lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.activity-summary-strip{display:flex;gap:12px;margin-bottom:14px;font-size:13px;color:var(--text-secondary);flex-wrap:wrap}
.activity-summary-strip span{background:var(--bg-card);padding:7px 12px;border-radius:12px;box-shadow:var(--card-shadow);font-weight:600}

/* ── Rest Day ── */
.rest-card{background:var(--bg-card);border-radius:16px;padding:28px 18px;text-align:center;box-shadow:var(--card-shadow);margin-bottom:8px}
.rest-emoji{font-size:48px;margin-bottom:8px}
.rest-card h3{font-size:18px;color:var(--text);margin-bottom:4px}
.rest-detail{font-size:13px;color:var(--text-secondary)}

/* ── Load Card ── */
.load-card{background:var(--bg-card);border-radius:16px;padding:20px 16px;box-shadow:var(--card-shadow);margin-bottom:8px}
.load-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}
.load-header h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted)}
.load-score{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;font-size:38px;font-weight:800;letter-spacing:-1px;color:var(--text)}
.load-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.load-stat{text-align:center}
.load-stat .val{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;font-size:20px;font-weight:700;color:var(--text)}
.load-stat .lbl{font-size:11px;color:var(--text-muted)}

/* ── Plan Execution Card ── */
.plan-exec-card{background:var(--bg-card);border-radius:16px;padding:16px;box-shadow:var(--card-shadow);margin-bottom:12px;border-left:3px solid var(--accent)}
.quality-banner{margin-bottom:12px;padding:10px 12px;border-radius:12px;background:var(--bg-subtle);border:1px solid var(--border-subtle);color:var(--text-secondary);font-size:12px}
.pe-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;padding:5px 0;font-size:13px}
.pe-label{color:var(--text-muted);min-width:64px}
.pe-val{color:var(--text);font-weight:500;text-align:right}

/* ── AI Insight ── */
.ai-section{background:var(--bg-card);border-radius:16px;padding:18px 16px;box-shadow:var(--card-shadow);margin-bottom:8px;border-left:3px solid var(--accent)}
.ai-conclusion{font-size:15px;color:var(--text);line-height:1.75;font-weight:500;padding:13px 14px;background:var(--accent-glow);border-radius:12px;margin-bottom:14px;overflow-wrap:anywhere}
.ai-block{margin-bottom:10px}
.ai-block h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;color:var(--text-muted)}
.ai-block ul{list-style:none}
.ai-block li{font-size:13px;color:var(--text-secondary);padding:2px 0}
.ai-model{font-size:10px;color:var(--text-muted);margin-top:12px;text-align:right}

/* ── Empty / Footer ── */
.empty-state{text-align:center;padding:60px 20px}
.empty-state .icon{font-size:48px;margin-bottom:16px}
.empty-state h2{font-size:18px;color:var(--text);margin-bottom:8px}
.empty-state p{font-size:13px;color:var(--text-muted);margin-bottom:24px;line-height:1.6}
.footer{text-align:center;padding:36px 0 20px;font-size:11px;color:var(--text-muted);letter-spacing:1px;font-weight:500}
.footer span{background:linear-gradient(135deg,var(--accent),#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700}

@media(min-width:641px){
  .container{padding:24px 20px 80px}
  .app-header{padding-bottom:20px}
  .app-brand{display:none}
  .app-nav{position:static;transform:none;width:auto;display:flex;padding:4px;border-radius:24px;box-shadow:var(--card-shadow);-webkit-backdrop-filter:none;backdrop-filter:none}
  .app-nav-item{flex-direction:row;gap:7px;min-width:84px;min-height:40px;padding:8px 16px;border-radius:20px}
  .app-nav-icon{width:17px;height:17px}
  .app-nav-label{font-size:12px}
  .theme-btn{min-height:36px;border-radius:20px;padding:5px 12px}
  .report-toolbar{grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:20px 22px}
  .report-controls{grid-template-columns:150px auto}
  .save-status{grid-column:1/-1}
  .plan-strip{grid-template-columns:repeat(4,1fr);padding:14px 18px}
  .hero-grid{gap:14px;margin-bottom:24px}
  .hero-card{padding:24px 18px}
  .hero-value{font-size:38px}
  .hero-value span{font-size:16px;margin-left:4px}
  .hero-label{font-size:13px}
  .hero-sub{font-size:11px}
  .metric-strip{grid-template-columns:repeat(var(--visible-count,4),minmax(0,1fr));gap:10px;margin-bottom:32px}
  .metric-item{padding:18px 12px}
  .metric-val{font-size:26px}
  .session-card{grid-template-columns:44px minmax(0,1fr) auto;padding:18px 20px;gap:16px}
  .session-metrics{grid-column:auto;display:flex;gap:20px;padding-top:0;border-top:0}
  .rest-card{padding:36px}
  .load-card{padding:28px}
  .load-stats{display:flex;gap:24px;justify-content:center;margin-top:18px}
  .plan-exec-card{padding:20px 24px}
  .pe-row{display:flex;justify-content:space-between;gap:16px}
  .ai-section{padding:28px}
  .ai-conclusion{font-size:16px;padding:14px 18px}
}

@media(hover:hover){
  .app-nav-item:hover{color:var(--accent);background:var(--accent-glow)}
  .theme-btn:hover{opacity:.82}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary:hover{color:#fff;opacity:.86}
  .hero-card:hover{transform:translateY(-2px);box-shadow:var(--card-shadow-hover)}
  .session-card:hover{box-shadow:var(--card-shadow-hover)}
}

@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>

<!-- Loading -->
<div class="loading" id="loading"><span class="spinner"></span>加载中...</div>

<!-- Dashboard -->
<div id="dashboard" style="display:none">

  <main id="reportContent" style="display:none">

  <div class="quality-banner" id="qualityBanner" hidden></div>
  <section class="today-conclusion" id="todayConclusion" hidden></section>

        <div class="hero-card"><div class="hero-value recovery" id="heroRecovery">—<span>/100</span></div><div class="hero-label">恢复评分</div><div class="hero-sub" id="heroRecoveryLevel">—</div></div>
        <div class="hero-card"><div class="hero-value readiness" id="heroReadiness">—</div><div class="hero-label">训练准备</div><div class="hero-sub" id="heroReadinessLevel">—</div></div>

<script>
function $(id){return document.getElementById(id)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var currentReport=null;

// ── Theme ──
var savedTheme = localStorage.getItem('neurun-theme')||'dark';
document.body.setAttribute('data-theme', savedTheme);
document.querySelectorAll('.theme-btn').forEach(function(b){
  b.classList.toggle('active', b.dataset.theme===savedTheme);
});

function setTheme(t){
  document.body.setAttribute('data-theme', t);
  localStorage.setItem('neurun-theme', t);
  document.querySelectorAll('.theme-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.theme===t);
  });
}

// ── Render ──
function render(d){
  currentReport=d&&d.has_data?d:null;
  var report=currentReport||{};
  $('loading').style.display='none';
  $('dashboard').style.display='block';
  $('reportContent').style.display=currentReport?'block':'none';
  $('emptyState').style.display=currentReport?'none':'block';
  $('saveImageBtn').disabled=!currentReport;
  $('saveStatus').textContent='';
  $('saveStatus').className='save-status';
  if(!d.has_data){
    $('reportDateLabel').textContent='所选日期尚未生成日报';
    return;
  }
  $('reportDateLabel').textContent=(d.report_date||'最新')+' · 训练与恢复概览';
  var quality=report.data_readiness||'unknown',qualityBanner=$('qualityBanner');
  if(quality==='complete'){qualityBanner.hidden=true}
  else{qualityBanner.hidden=false;qualityBanner.textContent=quality==='limited'?'这是一份数据不完整的受限报告，部分结论已省略。':'这份旧报告没有数据完整性快照，可信范围未知。'}

  var execution=d.plan_execution_summary||{},executionArea=$('planExecutionSummary');
  if(execution.headline){
    var executionGoal=execution.goal||{},executionWeek=execution.week||{},executionPlanned=execution.planned||{},executionActual=execution.actual||{};
    var meta=[];
    if(executionGoal.name)meta.push('<span>'+esc(executionGoal.name)+(executionGoal.target_date?' · '+esc(executionGoal.target_date):'')+'</span>');
    if(executionGoal.days_to_goal!=null)meta.push('<span>'+(executionGoal.days_to_goal>=0?'距目标 '+esc(executionGoal.days_to_goal)+' 天':'目标日已过')+'</span>');
    if(execution.phase&&execution.phase.name)meta.push('<span>'+esc(execution.phase.name)+'</span>');
    if(executionWeek.target_km!=null)meta.push('<span>本周已记录 '+esc(executionWeek.recorded_km||0)+' / '+esc(executionWeek.target_km)+' km</span>');
    if(executionPlanned.title)meta.push('<span>计划：'+esc(executionPlanned.title)+'</span>');
    if(executionActual.summary)meta.push('<span>实际：'+esc(executionActual.summary)+'</span>');
    var comparison=execution.comparison||{},prescription=executionPlanned.training_prescription||{},prescriptionTargets=prescription.targets||{},feel=prescriptionTargets.feel||{};
    if(comparison.target!=null)meta.push('<span>'+esc(comparison.primary_metric||'目标')+' '+esc(comparison.actual==null?'—':comparison.actual)+' / '+esc(comparison.target)+'</span>');
    if(feel.label)meta.push('<span>强度：'+esc(feel.label)+'</span>');
    var prescriptionHtml='';
    if((prescription.blocks||[]).length){var criteria=prescription.completion_criteria||[],criteriaItems=Array.isArray(criteria)?criteria:[criteria.minimum_completed_repetitions?'最低完成 '+criteria.minimum_completed_repetitions+' 组':'',criteria.quality_rule||''].filter(Boolean),structure=comparison.planned_structure||prescription.blocks.map(function(block){return (({warmup:'热身',main:'主体',recovery:'恢复段',cooldown:'放松'})[block.role]||block.role)+'：'+(block.duration_minutes?block.duration_minutes+' 分钟 · ':'')+(block.instruction||'按处方完成')}).join('；');prescriptionHtml='<div class="plan-exec-card"><div class="pe-row"><span class="pe-label">课程结构</span><span class="pe-val">'+esc(structure)+'</span></div><div class="pe-row"><span class="pe-label">完成要求</span><span class="pe-val">'+criteriaItems.map(esc).join('；')+'</span></div></div>'}
    var action=execution.sync_url?'<a class="btn primary" href="'+esc(execution.sync_url)+'">补齐同步数据</a>':'<a class="btn" href="'+esc(execution.training_url||'/training')+'">查看训练安排</a>';
    var advice=execution.guidance?'<p class="plan-execution-guidance">调整建议：'+esc(execution.guidance)+'</p>':'';
    var cautions=(execution.caution||[]).map(function(item){return '<li>'+esc(item)+'</li>'}).join('');
    if(cautions)advice+='<ul class="plan-execution-guidance">'+cautions+'</ul>';
    executionArea.innerHTML='<h2>🎯 计划执行与目标进展</h2><p>'+esc(execution.headline)+'</p><div class="plan-execution-meta">'+meta.join('')+'</div>'+prescriptionHtml+advice+action;
    executionArea.hidden=false;
  }else{executionArea.hidden=true;executionArea.replaceChildren()}

  var sl=d.last_night_sleep||{}, rc=d.recovery||{}, mo=d.this_morning||{};
  var ya=d.daily_activities||d.yesterday_activities||{}, ld=d.training_load||{}, ai=d.ai_insight||{};

  var conclusion=$('todayConclusion'),conclusionText=ai.conclusion||execution.headline||'当日事实已整理，可结合训练安排决定下一步。';
  // ── 今日结论 = 结论 + 教练观察四块话语（不再单独占区块，避免重复强调） ──
  var aiObs=(ai.observations||[]).filter(function(o){return o.indexOf('训练结构识别')!==0});
  var conclusionHtml='<h2>今天对计划意味着什么</h2><p class="ai-conclusion">'+esc(conclusionText)+'</p>';
  if(aiObs.length){conclusionHtml+='<div class="observation-list">'+aiObs.map(function(o){return '<div class="ai-block"><ul><li>'+esc(o)+'</li></ul></div>'}).join('')+'</div>';}
  if(ai.model)conclusionHtml+='<div class="ai-model">模型: '+ai.model+(ai.plan_adjusted?' | 已生成训练调整建议':'')+'</div>';
  conclusion.innerHTML=conclusionHtml;
  conclusion.hidden=false;

  // ── Hero（睡眠 / 恢复评分 / 训练准备）──
  // 没有数据的模块直接隐藏卡片，避免出现只有“—”的空白块；
  // 整组都无数据时隐藏整块区域，受限报告由顶部质量横幅说明省略项。
  var hasVal=function(v){return v!==null&&v!==undefined&&String(v).trim()!==''&&String(v)!=='—'};
  var sleepOk=hasVal(sl.total_hours),recoveryOk=hasVal(rc.overall_score),readinessOk=hasVal(mo.training_readiness_score);
  $('heroSleep').innerHTML=sleepOk?(sl.total_hours)+'<span>h</span>':'—';
  $('heroSleepQuality').textContent=sleepOk?(sl.quality||'—'):'暂无数据';
  $('heroRecovery').innerHTML=recoveryOk?(rc.overall_score)+'<span>/100</span>':'—';
  $('heroRecoveryLevel').textContent=recoveryOk?(rc.level||'—'):'暂无数据';
  $('heroReadiness').textContent=readinessOk?mo.training_readiness_score:'—';
  $('heroReadinessLevel').textContent=readinessOk?(mo.training_readiness_level||'—'):'暂无数据';
  var heroGrid=$('heroSleep').closest('.hero-grid');
  [['heroSleep',sleepOk],['heroRecovery',recoveryOk],['heroReadiness',readinessOk]].forEach(function(pair){
    $(pair[0]).closest('.hero-card').style.display=pair[1]?'':'none';
  });
  var anyHero=sleepOk||recoveryOk||readinessOk;
  if(heroGrid){var visibleCount=[sleepOk,recoveryOk,readinessOk].filter(Boolean).length;heroGrid.style.setProperty('--visible-count',String(visibleCount));}
  if(!anyHero&&heroGrid)heroGrid.style.display='none';

  // ── 指标条（HRV / 静息心率 / 身体电量 / 压力）──
  var hrvOk=hasVal(mo.hrv_ms),rhrOk=hasVal(mo.resting_hr),bbOk=hasVal(mo.body_battery_morning),stressOk=hasVal(mo.avg_stress);
  $('metHrv').textContent=hrvOk?mo.hrv_ms:'暂无数据';
  $('metRhr').textContent=rhrOk?mo.resting_hr:'暂无数据';
  $('metBb').textContent=bbOk?mo.body_battery_morning:'暂无数据';
  $('metStress').textContent=stressOk?mo.avg_stress:'暂无数据';
  var metricStrip=$('metHrv').closest('.metric-strip');
  [['metHrv',hrvOk],['metRhr',rhrOk],['metBb',bbOk],['metStress',stressOk]].forEach(function(pair){
    $(pair[0]).closest('.metric-item').style.display=pair[1]?'':'none';
  });
  var anyMetric=hrvOk||rhrOk||bbOk||stressOk;
  if(metricStrip){var visibleCount=[hrvOk,rhrOk,bbOk,stressOk].filter(Boolean).length;metricStrip.style.setProperty('--visible-count',String(visibleCount));}
  if(!anyMetric&&metricStrip)metricStrip.style.display='none';

  // Training
  var t='';
  if(ya.is_rest_day){
    t='<div class="rest-card"><div class="rest-emoji">🧘</div><h3>休息日</h3>';
    var steps=ya.daily_steps||0,dist=ya.daily_distance_km||0;
    t+='<p class="rest-detail">'+(steps>5000?steps+' 步 · '+dist.toFixed(1)+' km':'身体在恢复中')+'</p></div>';
    if(steps>0){
      t+='<div class="activity-summary-strip">';
      t+='<span>👣 '+steps+' 步</span>';
      if(dist>0)t+='<span>📏 '+dist.toFixed(1)+' km</span>';
      if(ya.daily_active_cal)t+='<span>🔥 '+ya.daily_active_cal+' cal</span>';
      t+='</div>';
    }
  }else{
    if(ya.total_duration_min||ya.total_distance_km){
      t+='<div class="activity-summary-strip">';
      t+='<span>⏱ '+(ya.total_duration_min||0)+' min</span>';
      if(ya.total_distance_km)t+='<span>📏 '+ya.total_distance_km.toFixed(1)+' km</span>';
      t+='<span>📊 负荷 '+(ya.total_training_load||0)+'</span>';
      t+='</div>';
    }
    (ya.sessions||[]).forEach(function(s){
      var icon=s.type==='running'?'🏃':s.type==='cycling'?'🚴':s.type==='swimming'?'🏊':'💪';
      var dkm=s.distance_km?s.distance_km+'km':'';
      t+='<div class="session-cards"><div class="session-card">';
      t+='<div class="session-icon">'+icon+'</div>';
      t+='<div class="session-info"><div class="session-name">'+s.name+'</div><div class="session-type">'+s.type+'</div></div>';
      t+='<div class="session-metrics">';
      t+='<div class="session-metric"><div class="val">'+s.duration_min+'</div><div class="lbl">min</div></div>';
      if(dkm)t+='<div class="session-metric"><div class="val">'+dkm+'</div><div class="lbl">距离</div></div>';
      t+='<div class="session-metric"><div class="val">'+(s.avg_hr||'—')+'</div><div class="lbl">HR</div></div>';
      t+='<div class="session-metric"><div class="val">'+(s.training_load||0)+'</div><div class="lbl">负荷</div></div>';
      t+='</div></div></div>';
    });
  }
  $('trainingArea').innerHTML=t;


// ── 训练深度分析（整体水平 / 强度分布 / 配速节奏 / 结构判定） ──
function _paceText(sec){if(!sec)return '—';var m=Math.floor(sec/60),s=Math.round(sec%60);if(s===60){m++;s=0}return m+"'"+String(s).padStart(2,'0')+'\"';}
function _durText(sec){if(!sec)return '—';var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h?h+'h'+String(m).padStart(2,'0')+'min':m+'min';}
function _marathonEst(sec){if(!sec)return '';var total=sec*42.195,h=Math.floor(total/3600),m=Math.floor(total%3600/60),s=Math.round(total%60);if(s===60){m++;s=0}if(m===60){h++;m=0}return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function _bandLabel(key,isPace){var low,high;if(key.indexOf('-inf')===0){low=null;high=parseFloat(key.slice(5));}else{var sp=key.split('-');low=parseFloat(sp[0]);high=sp[1]==='inf'?null:parseFloat(sp[1]);}
  var fmt=isPace?_paceText:String;if(low===null)return '<'+fmt(high);if(high===null)return '>'+fmt(low);return fmt(low)+'–'+fmt(high);}
function _deepBandHtml(bands,isPace){if(!bands)return '';return Object.keys(bands).sort(function(a,b){var al=parseFloat(a.split('-')[0])||0,bl=parseFloat(b.split('-')[0])||0;return al-bl}).map(function(k){return _bandLabel(k,isPace)+': '+bands[k]+'%'}).join(' · ');}
function _bandLabel(key,isPace){var low,high;if(key.indexOf('-inf')===0){low=null;high=parseFloat(key.slice(5));}else{var sp=key.split('-');low=parseFloat(sp[0]);high=sp[1]==='inf'?null:parseFloat(sp[1]);}
  var fmt=isPace?_paceText:String;if(low===null)return '<'+fmt(high);if(high===null)return '>'+fmt(low);return fmt(low)+'–'+fmt(high);}
function _topBand(bands,isPace){if(!bands)return '';var best=null,label='';Object.keys(bands).forEach(function(k){if(!best||bands[k]>bands[best]){best=k;label=_bandLabel(k,isPace);}});return best?(label+'（'+bands[best]+'%占比）'):'';}
function _bandOrder(bands,isPace){if(!bands)return '';return Object.keys(bands).sort(function(a,b){var al=parseFloat(a.split('-')[0])||0,bl=parseFloat(b.split('-')[0])||0;return al-bl}).map(function(k){return _bandLabel(k,isPace)+' '+bands[k]+'%'}).join('，');}
function deepAnalysisHtml(analyses){
  if(!analyses||!analyses.length)return '';
  var paras=[];
  analyses.forEach(function(a){
    var ss=a.session_summary||{},vol=ss.volume||{},eff=ss.effect||{},elev=ss.elevation_profile||{};
    var pp=ss.pace_profile||{},st=ss.structure||{};
    var clf=a.structure_classification||{},inten=ss.intensity||{};
    var dist=(vol.distance_m||0)/1000,dur=vol.duration_s||0,elapsed=vol.elapsed_duration_s;
    var durT=_durText(dur);
    if(elapsed&&elapsed>dur+5)durT+='（总 '+_durText(elapsed)+'，含暂停）';
    else if(elapsed&&Math.abs(elapsed-dur)<=5)durT+='（无暂停）';
    // ① 整体水平
    var s1=dist.toFixed(2)+' km 用时 '+durT+'，平均配速 '+_paceText(pp.avg_pace_sec_per_km)+'/km';
    if(pp.avg_pace_sec_per_km){var m=_marathonEst(pp.avg_pace_sec_per_km);if(m)s1+='（折全马约 '+m+'）';}
    if(pp.fastest_pace_sec_per_km)s1+='，最快 '+_paceText(pp.fastest_pace_sec_per_km)+'/km';
    if(elev.ascent_m!=null||elev.descent_m!=null){s1+='，累计爬升 '+(elev.ascent_m||0)+'m / 下降 '+(elev.descent_m||0)+'m';if(elev.max_elevation_m!=null&&elev.min_elevation_m!=null)s1+='（海拔 '+elev.min_elevation_m+'~'+elev.max_elevation_m+'m）';}
    if(st.avg_cadence){s1+='。步频 '+Math.round(st.avg_cadence)+' spm'+(st.max_cadence?'（最大 '+Math.round(st.max_cadence)+'）':'')+'，步幅 '+Math.round(st.avg_stride||0)+'cm';}
    if(vol.calories!=null){var te=eff.aerobic_training_effect!=null?('有氧 '+Number(eff.aerobic_training_effect).toFixed(1)+(eff.estimated?'（估算）':'')+'/'+(eff.anaerobic_training_effect!=null?'无氧 '+Number(eff.anaerobic_training_effect).toFixed(1):'')):'';s1+='。热量 '+Math.round(vol.calories)+' kcal'+(te?'，训练效果 '+te:'');}
    if(s1[s1.length-1]!=='。')s1+='。';
    paras.push(s1);
    // ② 结构 + 强度
    if(clf.structure_type&&clf.structure_type!=='unknown'){
      var s2='本课识别为'+esc(clf.label||clf.structure_type);
      if(clf.alternations)s2+='（'+clf.alternations+' 组快慢交替'+(clf.confidence!=null?('，置信 '+Math.round(clf.confidence*100)+'%'):'')+'）';
      var groups=clf.work_recovery_groups||[];
      if(groups.length){var gtxt=groups.map(function(g){return '第'+g.group+'组 '+_paceText(g.work_pace_sec_per_km)+'→'+_paceText(g.recovery_pace_sec_per_km)}).join('，');s2+='：'+gtxt;}
      s2+='。';
      if(clf.quantity_reliable===false)s2+='（分段距离/时长与总量偏差，仅强度模式有效）';
      if(inten.pace_bands_pct)s2+='强度上以'+_topBand(inten.pace_bands_pct,true)+'的配速为主';
      if(inten.hr_bands_pct)s2+='，心率集中在'+_topBand(inten.hr_bands_pct,false)+'。';
      paras.push(s2);
    }
    // ③ 节奏 + 疲劳
    var s3='';
    if(pp.half_pace_diff_s!=null){s3+='后半程比前半程'+(pp.half_pace_diff_s>0?'慢 ':'快 ')+_paceText(Math.abs(pp.half_pace_diff_s))+'/km';}
    if(pp.cv_pct!=null){var stab=pp.cv_pct<8?'配速控制力强':pp.cv_pct<15?'配速有一定波动':'配速波动明显';s3+=(s3?'，':'')+stab+'（CV '+pp.cv_pct+'%）';}
    if(s3)s3+='。';
    var fatigue=clf.fatigue_signal||{};
    if(fatigue.detected)s3+='存在疲劳信号：'+esc(fatigue.note||'');
    if(s3)paras.push(s3);
  });
  return paras;
}
  // Load（负荷与恢复）：急性/慢性负荷都为 0 或缺失时不展示，避免无效 ACWR 空白块
  var loadHas=Number(ld.acute_load_7d)>0||Number(ld.chronic_load_28d)>0;
  $('loadAcwr').textContent=loadHas&&hasVal(ld.acwr)?ld.acwr:'—';
  $('loadChronic').textContent=loadHas&&hasVal(ld.chronic_load_28d)?ld.chronic_load_28d:'—';
  $('loadAcute').textContent=loadHas&&hasVal(ld.acute_load_7d)?ld.acute_load_7d:'—';
  $('loadStatus').textContent=loadHas&&hasVal(ld.acwr_status)?ld.acwr_status:'—';
  var loadCard=document.querySelector('.load-card'),loadTitle=loadCard?loadCard.previousElementSibling:null;
  if(!loadHas){
    if(loadCard)loadCard.style.display='none';
    if(loadTitle&&loadTitle.classList&&loadTitle.classList.contains('section-title'))loadTitle.style.display='none';
  }

  // 依据折叠区整体为空时收拢为一行说明，避免大片空白区域
  var evidenceBody=document.querySelector('.report-evidence-body');
  if(evidenceBody){
    var evidenceGroups=evidenceBody.querySelectorAll('.hero-grid,.metric-strip,.load-card'),anyEvidence=false;
    evidenceGroups.forEach(function(el){if(el.style.display!=='none')anyEvidence=true});
    if(!anyEvidence){
      var evidence=evidenceBody.parentElement;
      if(evidence){
        var evidenceSummary=evidence.querySelector('summary');
        if(evidenceSummary)evidenceSummary.textContent='查看数据依据：当日睡眠、恢复与负荷数据暂缺（受限版）';
      }
    }
  }

}

// ── Local PNG export ──
function reportPalette(){
  var theme=document.body.getAttribute('data-theme')||'dark';
  var palettes={
    dark:{bg:'#0b1120',card:'#1a2333',subtle:'#151e2c',text:'#e2e8f0',secondary:'#94a3b8',muted:'#64748b',border:'#243044',accent:'#34d399',sleep:'#a78bfa',recovery:'#60a5fa',performance:'#4ade80',hrv:'#22d3ee'},
    sport:{bg:'#f0f0f0',card:'#ffffff',subtle:'#f5f5f5',text:'#171717',secondary:'#525252',muted:'#858585',border:'#e3e3e3',accent:'#f15b2a',sleep:'#7c3aed',recovery:'#2563eb',performance:'#16a34a',hrv:'#0891b2'},
    fresh:{bg:'#e8efe9',card:'#ffffff',subtle:'#f0f4f0',text:'#1a2e23',secondary:'#5a7d6e',muted:'#789689',border:'#d7e1da',accent:'#2d9d6f',sleep:'#7c6fcf',recovery:'#3b82b6',performance:'#22a86e',hrv:'#3b9fc6'}
  };
  return palettes[theme]||palettes.dark;
}

function roundedRect(ctx,x,y,w,h,r,fill,stroke){
  var radius=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+radius,y);
  ctx.arcTo(x+w,y,x+w,y+h,radius);
  ctx.arcTo(x+w,y+h,x,y+h,radius);
  ctx.arcTo(x,y+h,x,y,radius);
  ctx.arcTo(x,y,x+w,y,radius);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
}

function wrapCanvasText(ctx,text,maxWidth){
  var source=String(text||'').trim();
  if(!source)return [];
  var lines=[];
  source.split(/\n/).forEach(function(paragraph){
    var line='';
    Array.from(paragraph).forEach(function(char){
      var next=line+char;
      if(line&&ctx.measureText(next).width>maxWidth){lines.push(line);line=char}else{line=next}
    });
    if(line)lines.push(line);
  });
  return lines;
}

function drawCanvasLines(ctx,lines,x,y,lineHeight,color){
  ctx.fillStyle=color;
  lines.forEach(function(line,index){ctx.fillText(line,x,y+index*lineHeight)});
  return y+lines.length*lineHeight;
}

function buildReportCanvas(report){
  var width=720,scale=2,pad=36,gap=12,inner=width-pad*2;
  var colors=reportPalette();
  var font='-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';
  var measure=document.createElement('canvas').getContext('2d');
  var ai=report.ai_insight||{},ya=report.daily_activities||report.yesterday_activities||{};
  measure.font='500 22px '+font;
  var insightLines=wrapCanvasText(measure,ai.conclusion||'',inner-40);
  measure.font='400 18px '+font;
  var observationLines=[];
  (ai.observations||[]).forEach(function(item){
    observationLines=observationLines.concat(wrapCanvasText(measure,'• '+item,inner-40));
  });
  var aiHeight=insightLines.length||observationLines.length?64+insightLines.length*32+observationLines.length*27:0;
  var sessions=ya.sessions||[];
  var trainingRows=ya.is_rest_day?1:Math.max(1,sessions.length);
  var trainingHeight=48+trainingRows*86+Math.max(0,trainingRows-1)*10;
  var totalHeight=105+132+18+108+18+(aiHeight?aiHeight+18:0)+trainingHeight+18+150+86;
  var canvas=document.createElement('canvas');
  canvas.width=width*scale;
  canvas.height=totalHeight*scale;
  var ctx=canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.textBaseline='alphabetic';
  ctx.fillStyle=colors.bg;
  ctx.fillRect(0,0,width,totalHeight);

  var y=38;
  ctx.font='800 13px '+font;ctx.fillStyle=colors.accent;ctx.fillText('NEURUN DAILY',pad,y);
  ctx.font='800 34px '+font;ctx.fillStyle=colors.text;ctx.fillText('当日训练',pad,y+42);
  ctx.font='500 16px '+font;ctx.textAlign='right';ctx.fillStyle=colors.secondary;ctx.fillText(report.report_date||'最新日报',width-pad,y+37);ctx.textAlign='left';
  y=105;

  var sleep=report.last_night_sleep||{},recovery=report.recovery||{},morning=report.this_morning||{};
  var hero=[
    {label:'睡眠',value:(sleep.total_hours||'—')+'h',sub:sleep.quality||'—',color:colors.sleep},
    {label:'恢复',value:(recovery.overall_score||'—')+'/100',sub:recovery.level||'—',color:colors.recovery},
    {label:'训练准备',value:morning.training_readiness_score||'—',sub:morning.training_readiness_level||'—',color:colors.performance}
  ];
  var heroWidth=(inner-gap*2)/3;
  hero.forEach(function(item,index){
    var x=pad+index*(heroWidth+gap);
    roundedRect(ctx,x,y,heroWidth,132,18,colors.card,colors.border);
    ctx.textAlign='center';ctx.font='800 31px '+font;ctx.fillStyle=item.color;ctx.fillText(String(item.value),x+heroWidth/2,y+53);
    ctx.font='700 15px '+font;ctx.fillStyle=colors.text;ctx.fillText(item.label,x+heroWidth/2,y+82);
    ctx.font='500 13px '+font;ctx.fillStyle=colors.muted;ctx.fillText(String(item.sub),x+heroWidth/2,y+108);ctx.textAlign='left';
  });
  y+=150;

  var metrics=[['HRV',morning.hrv_ms||'—','ms',colors.hrv],['静息心率',morning.resting_hr||'—','bpm',colors.performance],['身体电量',morning.body_battery_morning!=null?morning.body_battery_morning:'—','',colors.accent],['压力',morning.avg_stress||'—','',colors.sleep]];
  var metricWidth=(inner-gap*3)/4;
  metrics.forEach(function(item,index){
    var x=pad+index*(metricWidth+gap);
    roundedRect(ctx,x,y,metricWidth,108,16,colors.card,colors.border);
    ctx.textAlign='center';ctx.font='800 26px '+font;ctx.fillStyle=item[3];ctx.fillText(String(item[1]),x+metricWidth/2,y+45);
    ctx.font='700 12px '+font;ctx.fillStyle=colors.secondary;ctx.fillText(item[0]+(item[2]?' · '+item[2]:''),x+metricWidth/2,y+76);ctx.textAlign='left';
  });
  y+=126;

  if(aiHeight){
    roundedRect(ctx,pad,y,inner,aiHeight,18,colors.card,colors.border);
    ctx.font='800 13px '+font;ctx.fillStyle=colors.accent;ctx.fillText('AI 教练洞察',pad+20,y+29);
    ctx.font='500 22px '+font;
    var textY=drawCanvasLines(ctx,insightLines,pad+20,y+62,32,colors.text);
    ctx.font='400 18px '+font;
    drawCanvasLines(ctx,observationLines,pad+20,textY+4,27,colors.secondary);
    y+=aiHeight+18;
  }

  ctx.font='800 13px '+font;ctx.fillStyle=colors.muted;ctx.fillText('昨日训练',pad,y+20);
  y+=36;
  if(ya.is_rest_day){
    roundedRect(ctx,pad,y,inner,86,18,colors.card,colors.border);
    ctx.font='800 24px '+font;ctx.fillStyle=colors.text;ctx.fillText('休息日',pad+20,y+37);
    ctx.font='500 15px '+font;ctx.fillStyle=colors.secondary;
    var restText=ya.daily_steps?ya.daily_steps+' 步 · '+Number(ya.daily_distance_km||0).toFixed(1)+' km':'身体在恢复中';
    ctx.fillText(restText,pad+20,y+64);
    y+=86;
  }else if(sessions.length){
    sessions.forEach(function(session,index){
      roundedRect(ctx,pad,y,inner,86,18,colors.card,colors.border);
      ctx.font='800 18px '+font;ctx.fillStyle=colors.text;
      var name=String(session.name||session.type||'训练');
      ctx.fillText(name.length>27?name.slice(0,27)+'…':name,pad+20,y+34);
      ctx.font='500 14px '+font;ctx.fillStyle=colors.secondary;
      var details=[(session.duration_min||0)+' min'];
      if(session.distance_km)details.push(session.distance_km+' km');
      if(session.avg_hr)details.push('HR '+session.avg_hr);
      details.push('负荷 '+(session.training_load||0));
      ctx.fillText(details.join('  ·  '),pad+20,y+62);
      y+=86+(index<sessions.length-1?10:0);
    });
  }else{
    roundedRect(ctx,pad,y,inner,86,18,colors.card,colors.border);
    ctx.font='600 17px '+font;ctx.fillStyle=colors.secondary;ctx.fillText('暂无训练记录',pad+20,y+50);
    y+=86;
  }
  y+=18;

  var load=report.training_load||{};
  roundedRect(ctx,pad,y,inner,150,18,colors.card,colors.border);
  ctx.font='800 13px '+font;ctx.fillStyle=colors.muted;ctx.fillText('训练负荷',pad+20,y+29);
  ctx.font='800 42px '+font;ctx.fillStyle=colors.text;ctx.fillText(String(load.acwr||'—'),pad+20,y+78);
  ctx.font='600 14px '+font;ctx.fillStyle=colors.secondary;ctx.fillText('ACWR · '+(load.acwr_status||'—'),pad+20,y+105);
  ctx.textAlign='right';ctx.font='700 17px '+font;ctx.fillStyle=colors.text;ctx.fillText('急性 '+(load.acute_load||'—'),width-pad-20,y+61);ctx.fillText('慢性 '+(load.chronic_load||'—'),width-pad-20,y+94);ctx.textAlign='left';
  y+=150;

  ctx.textAlign='center';ctx.font='700 12px '+font;ctx.fillStyle=colors.muted;ctx.fillText('Generated locally by neurun · 训练数据仅在浏览器中处理',width/2,totalHeight-35);ctx.textAlign='left';
  return canvas;
}

function canvasBlob(canvas){
  return new Promise(function(resolve,reject){
    canvas.toBlob(function(blob){blob?resolve(blob):reject(new Error('浏览器未能生成图片'))},'image/png');
  });
}

function downloadImageBlob(blob,filename){
  var url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},1000);
}

async function saveReportImage(){
  if(!currentReport)return;
  var btn=$('saveImageBtn'),status=$('saveStatus'),original=btn.textContent;
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>生成中';status.textContent='正在本地生成高清日报图片…';status.className='save-status';
  try{
    var canvas=buildReportCanvas(currentReport),blob=await canvasBlob(canvas);
    var reportDate=currentReport.report_date||new Date().toISOString().slice(0,10);
    var filename='neurun-daily-'+reportDate+'.png';
    var file=new File([blob],filename,{type:'image/png'});
    var shareData={files:[file],title:'neurun 训练日报',text:reportDate+' 训练日报'};
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share(shareData);
      status.textContent='已打开系统分享，可选择保存到相册';status.className='save-status success';
    }else{
      downloadImageBlob(blob,filename);
      status.textContent='图片已下载';status.className='save-status success';
    }
  }catch(error){
    if(error&&error.name==='AbortError'){status.textContent='已取消保存'}
    else{status.textContent='保存失败：'+(error.message||'请稍后重试');status.className='save-status error'}
  }finally{
    btn.disabled=!currentReport;btn.textContent=original;
  }
}

// ── Load ──
async function loadDashboard(){
  $('loading').style.display='block';
  $('dashboard').style.display='none';
  try{
    var url='/api/dashboard';
    var dp=new URLSearchParams(location.search).get('date');
    if(dp)url+='?date='+dp;
    var r=await fetch(url);
    if(r.status===401){location.href='/';return}
    render(await r.json());
  }catch(e){
    $('loading').innerHTML='<p style="color:var(--danger)">加载失败: '+e.message+'</p>';
  }
}

function onDateChange(){
  var d=$('viewDate').value;
  if(d)location.href='/?date='+d;
}

// ── Init ──
var today=new Date().toISOString().slice(0,10);
$('viewDate').value=today;
var dp=new URLSearchParams(location.search).get('date');
if(dp)$('viewDate').value=dp;

loadDashboard();
</script>
