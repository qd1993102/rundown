<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>neurun — 我的</title>
<style>
[data-theme="fresh"] {
  --bg:#e8efe9; --bg-card:#fff; --text:#1a2e23; --text-secondary:#5a7d6e; --text-muted:#8aa89a;
  --accent:#2d9d6f; --accent-glow:rgba(45,157,111,.1); --recovery:#3b82b6; --recovery-glow:rgba(59,130,246,.08);
  --performance:#22a86e; --performance-glow:rgba(34,168,110,.08); --sleep:#7c6fcf; --sleep-glow:rgba(124,111,207,.08);
  --warning:#d4a017; --danger:#dc5b51; --hrv:#3b9fc6;
  --card-shadow:0 2px 8px rgba(0,0,0,.06); --card-shadow-hover:0 8px 30px rgba(0,0,0,.1);
  --border-subtle:#dde5df; --bg-subtle:#f0f4f0;
}
[data-theme="sport"] {
  --bg:#f0f0f0; --bg-card:#fff; --text:#171717; --text-secondary:#525252; --text-muted:#a3a3a3;
  --accent:#f15b2a; --accent-glow:rgba(241,91,42,.08); --recovery:#2563eb; --recovery-glow:rgba(37,99,235,.08);
  --performance:#16a34a; --performance-glow:rgba(22,163,74,.08); --sleep:#7c3aed; --sleep-glow:rgba(124,58,237,.08);
  --warning:#eab308; --danger:#ef4444; --hrv:#0891b2;
  --card-shadow:0 2px 10px rgba(0,0,0,.07); --card-shadow-hover:0 10px 35px rgba(0,0,0,.1);
  --border-subtle:#ebebeb; --bg-subtle:#f5f5f5;
}
[data-theme="dark"] {
  --bg:#0b1120; --bg-card:#1a2333; --text:#e2e8f0; --text-secondary:#94a3b8; --text-muted:#64748b;
  --accent:#34d399; --accent-glow:rgba(52,211,153,.12); --recovery:#60a5fa; --recovery-glow:rgba(96,165,250,.1);
  --performance:#4ade80; --performance-glow:rgba(74,222,128,.1); --sleep:#a78bfa; --sleep-glow:rgba(167,139,250,.1);
  --warning:#fbbf24; --danger:#f87171; --hrv:#22d3ee;
  --card-shadow:0 2px 10px rgba(0,0,0,.35); --card-shadow-hover:0 10px 30px rgba(0,0,0,.5);
  --border-subtle:#243044; --bg-subtle:#151e2c;
}
*{margin:0;padding:0;box-sizing:border-box}
html{min-width:320px;background:var(--bg)}
body{min-width:320px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input,select{font:inherit}
.container{width:100%;max-width:560px;margin:0 auto;padding:12px 12px calc(112px + env(safe-area-inset-bottom))}

/* Shared app navigation */
.app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 12px}
.app-brand{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px;font-weight:800;letter-spacing:.2px}
.app-brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:11px;background:var(--accent);color:#fff;font-size:17px;font-weight:900}
.app-nav{position:fixed;z-index:50;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 24px),520px);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border:1px solid var(--border-subtle);border-radius:22px;background:color-mix(in srgb,var(--bg-card) 92%,transparent);box-shadow:0 12px 40px rgba(0,0,0,.22);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.app-nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;min-height:54px;padding:6px 5px;border-radius:16px;color:var(--text-muted);text-decoration:none;transition:color .2s,background .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app-nav-item[aria-current="page"]{background:var(--accent-glow);color:var(--accent)}
.app-nav-icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app-nav-label{font-size:10px;font-weight:750;line-height:1;letter-spacing:.2px}
.theme-bar{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--border-subtle);border-radius:14px;background:var(--bg-card);box-shadow:var(--card-shadow)}
.theme-btn{min-height:40px;border:1px solid transparent;padding:6px 10px;border-radius:10px;font-size:11px;font-weight:650;cursor:pointer;background:transparent;color:var(--text-muted);transition:color .2s,background .2s,border-color .2s;letter-spacing:.2px}
.theme-btn.active{background:var(--accent);color:#fff}
.btn{padding:8px 18px;border-radius:20px;border:1px solid var(--border-subtle);background:transparent;color:var(--text-secondary);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Card */
.card{background:var(--bg-card);border-radius:16px;padding:28px;box-shadow:var(--card-shadow);margin-bottom:16px}
.card h2{font-size:15px;font-weight:700;color:var(--text);margin-bottom:16px}
.card .sub{font-size:11px;color:var(--text-muted);margin-bottom:16px}

/* Info rows */
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-subtle);font-size:14px}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--text-muted)}
.info-val{color:var(--text);font-weight:500}

/* Form */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border-subtle);background:var(--bg-subtle);color:var(--text);font-size:14px;outline:none;font-family:inherit;transition:border-color .2s}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-hint{margin-top:12px;font-size:12px;color:var(--text-muted);line-height:1.6}
.form-actions{text-align:center;margin-top:20px}

/* Loading */
.loading{text-align:center;padding:60px;color:var(--text-muted)}
.loading .spinner{width:24px;height:24px;display:block;margin:0 auto 12px}
.account-actions{display:flex;justify-content:flex-end;margin-top:16px}
.footer{text-align:center;padding:40px 0 20px;font-size:11px;color:var(--text-muted)}
.footer span{background:linear-gradient(135deg,var(--accent),#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700}
@media(min-width:641px){
  .container{padding:24px 20px 80px}
  .app-header{padding-bottom:20px}
  .app-brand{display:none}
  .app-nav{position:static;transform:none;width:auto;display:flex;padding:4px;border-radius:24px;box-shadow:var(--card-shadow);-webkit-backdrop-filter:none;backdrop-filter:none}
  .app-nav-item{flex-direction:row;gap:7px;min-width:84px;min-height:40px;padding:8px 16px;border-radius:20px}
  .app-nav-icon{width:17px;height:17px}
  .app-nav-label{font-size:12px}
  .theme-btn{min-height:36px;border-radius:20px;padding:5px 12px}
}
@media(hover:hover){
  .app-nav-item:hover{color:var(--accent);background:var(--accent-glow)}
  .theme-btn:hover{opacity:.82}
}
</style>
</head>
<body data-theme="dark">

<div class="container">

<header class="app-header">
  <div class="app-brand" aria-hidden="true"><span class="app-brand-mark">n</span><span>neurun</span></div>
  <nav class="app-nav" aria-label="主要导航">
    <a href="/training" class="app-nav-item" data-nav-item>
      <svg class="app-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h3l2-5 4 10 2-5h5"/><path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg>
      <span class="app-nav-label">训练</span>
    </a>
    <a href="/reports" class="app-nav-item" data-nav-item>
      <svg class="app-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      <span class="app-nav-label">报告</span>
    </a>
    <a href="/sync" class="app-nav-item" data-nav-item>
      <svg class="app-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7h-3.5A7 7 0 0 0 5 9M20 3v4h-4M4 17h3.5A7 7 0 0 0 19 15M4 21v-4h4"/></svg>
      <span class="app-nav-label">同步</span>
    </a>
    <a href="/profile" class="app-nav-item" data-nav-item aria-current="page">
      <svg class="app-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c.5-4 3-6 7-6s6.5 2 7 6"/></svg>
      <span class="app-nav-label">我的</span>
    </a>
  </nav>
  <div class="theme-bar" role="group" aria-label="主题">
    <button class="theme-btn active" data-theme="dark" onclick="setTheme('dark')">暗黑</button>
    <button class="theme-btn" data-theme="sport" onclick="setTheme('sport')">运动</button>
    <button class="theme-btn" data-theme="fresh" onclick="setTheme('fresh')">清新</button>
  </div>
</header>

<div class="loading" id="loading"><span class="spinner"></span>加载中...</div>

<div id="content" style="display:none">

  <!-- Application account -->
  <div class="card">
    <h2>👤 neurun 账号</h2>
    <div class="info-row"><span class="info-label">昵称</span><span class="info-val" id="accountNickname">—</span></div>
    <div class="info-row"><span class="info-label">登录邮箱</span><span class="info-val" id="accountEmail">—</span></div>
    <div class="account-actions"><button class="btn danger" onclick="doLogout()">退出登录</button></div>
  </div>

  <!-- Account -->
  <div class="card">
    <h2>🔗 数据源</h2>
    <div class="info-row"><span class="info-label">平台</span><span class="info-val" id="accProvider">—</span></div>
    <div class="info-row"><span class="info-label">账号</span><span class="info-val" id="accEmail">—</span></div>
    <div class="info-row"><span class="info-label">状态</span><span class="info-val" id="accStatus">—</span></div>
    <div class="info-row"><span class="info-label">上次同步</span><span class="info-val" id="accSync">—</span></div>
    <div class="info-row" id="corosTrainingRow" style="display:none"><span class="info-label">运动数据认证（Training Hub）</span><span class="info-val" id="corosTrainingStatus">—</span></div>
    <div class="info-row" id="corosReloginRow" style="display:none"><span class="info-label">运动自动鉴权</span><span class="info-val" id="corosReloginStatus">—</span></div>
    <div class="account-actions" id="corosTrainingAction" style="display:none;gap:8px">
      <a class="btn" href="/setup?rebind=coros&scope=training">认证 Coros 运动数据</a>
      <button class="btn danger" id="corosReloginDisable" onclick="disableCorosAutoRefresh('training')">关闭运动自动鉴权</button>
    </div>
    <div class="info-row" id="corosSleepRow" style="display:none"><span class="info-label">睡眠数据认证（Coros App）</span><span class="info-val" id="corosSleepStatus">—</span></div>
    <div class="info-row" id="corosSleepRefreshRow" style="display:none"><span class="info-label">睡眠自动鉴权</span><span class="info-val" id="corosSleepRefreshStatus">—</span></div>
    <div class="account-actions" id="corosSleepAction" style="display:none;gap:8px">
      <a class="btn" href="/setup?rebind=coros&scope=sleep">认证 Coros 睡眠数据</a>
      <button class="btn danger" id="corosSleepRefreshDisable" onclick="disableCorosAutoRefresh('sleep')">关闭睡眠自动鉴权</button>
    </div>
  </div>

  <!-- Profile -->
  <div class="card">
    <h2>🏃 身体数据</h2>
    <div class="form-row">
      <div class="form-group"><label>身高 (cm)</label><input id="pfHeight" type="number" placeholder="175"></div>
      <div class="form-group"><label>体重 (kg)</label><input id="pfWeight" type="number" placeholder="70"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>年龄</label><input id="pfAge" type="number" placeholder="30"></div>
      <div class="form-group"><label>性别</label><select id="pfGender"><option value="male">男</option><option value="female">女</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>静息心率 (bpm)</label><input id="pfRestHr" type="number" min="30" max="110" placeholder="55"></div>
      <div class="form-group"><label>最大心率 (bpm)</label><input id="pfMaxHr" type="number" min="100" max="240" placeholder="190"></div>
    </div>
    <p class="form-hint">用于校准个人阈值心率（≈88% 心率储备）和强度判断；不填则强度评估降级为“不可用”，不会用近期跑步猜测。</p>
  </div>

  <!-- PBs -->
  <div class="card">
    <h2>🏆 最佳成绩</h2>
    <div class="form-row">
      <div class="form-group"><label>5K</label><input id="pb5k" placeholder="MM:SS"></div>
      <div class="form-group"><label>10K</label><input id="pb10k" placeholder="MM:SS"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>半马</label><input id="pbHm" placeholder="H:MM:SS"></div>
      <div class="form-group"><label>全马</label><input id="pbM" placeholder="H:MM:SS"></div>
    </div>
    <div class="form-group"><label>VO2max</label><input id="pbVo2" type="number" placeholder="45"></div>
    <div class="form-actions"><button class="btn primary" id="btnProfile" onclick="saveProfile()">保存</button></div>
    <div id="profileMsg" style="text-align:center;font-size:13px;margin-top:8px"></div>
  </div>

  <!-- Preferences -->
  <div class="card">
    <h2>⚙️ 训练偏好</h2>
    <div class="form-row">
      <div class="form-group"><label>偏好时间</label><select id="prTime"><option value="morning">早晨</option><option value="afternoon">下午</option><option value="evening" selected>傍晚</option></select></div>
      <div class="form-group"><label>偏好地形</label><select id="prTerrain"><option value="田径场">田径场</option><option value="公路" selected>公路</option><option value="混合">混合</option></select></div>
    </div>
    <div class="form-group"><label>偏好训练类型（逗号分隔）</label><input id="prWorkouts" placeholder="间歇,节奏,长距离"></div>
    <div class="form-group"><label>伤病史</label><input id="prInjury" placeholder="无则留空"></div>
    <div class="form-group"><label>训练理念</label><input id="prPhilosophy" placeholder="数据驱动，极化训练"></div>
    <div class="form-actions"><button class="btn primary" id="btnPref" onclick="savePrefs()">保存</button></div>
  </div>

  <div class="footer">Built with <span>neurun</span></div>
</div>

</div>

<script>
var savedTheme=localStorage.getItem('neurun-theme')||'dark';
document.body.setAttribute('data-theme',savedTheme);
document.querySelectorAll('.theme-btn').forEach(function(b){b.classList.toggle('active',b.dataset.theme===savedTheme)});
function setTheme(t){document.body.setAttribute('data-theme',t);localStorage.setItem('neurun-theme',t);document.querySelectorAll('.theme-btn').forEach(function(b){b.classList.toggle('active',b.dataset.theme===t)})}

async function load(){
  try{
    var r=await fetch('/api/profile');
    if(r.status===401){location.href='/';return}
    var d=await r.json();
    document.getElementById('loading').style.display='none';
    document.getElementById('content').style.display='block';

    // Account
    document.getElementById('accountNickname').textContent=d.nickname||'—';
    document.getElementById('accountEmail').textContent=d.account_email||'—';
    document.getElementById('accProvider').textContent=d.provider||'—';
    document.getElementById('accEmail').textContent=d.email||'—';
    document.getElementById('accStatus').textContent=d.token_status==='active'?'✅ 已连接':'⚠ 未连接';
    document.getElementById('accSync').textContent=d.last_sync||'—';
    if(d.provider==='coros'){
      document.getElementById('corosTrainingRow').style.display='flex';
      document.getElementById('corosTrainingStatus').textContent=d.training_auth_status==='active'?'✅ 已认证':'⚠ 需重新认证';
      document.getElementById('corosTrainingAction').style.display='flex';
      document.getElementById('corosSleepRow').style.display='flex';
      document.getElementById('corosSleepStatus').textContent=d.sleep_auth_status==='active'?'✅ 已认证':'⚠ 需认证';
      document.getElementById('corosSleepAction').style.display='flex';
      document.getElementById('corosReloginRow').style.display='flex';
      document.getElementById('corosReloginStatus').textContent=d.training_auto_refresh_enabled?'✅ 已启用':'未启用';
      document.getElementById('corosReloginDisable').style.display=d.training_auto_refresh_enabled?'inline-block':'none';
      document.getElementById('corosSleepRefreshRow').style.display='flex';
      document.getElementById('corosSleepRefreshStatus').textContent=d.sleep_auto_refresh_enabled?'✅ 已启用':'未启用';
      document.getElementById('corosSleepRefreshDisable').style.display=d.sleep_auto_refresh_enabled?'inline-block':'none';
    }

    // Profile
    var p=d.profile||{},pi=p.personal_info||{},pbs=p.personal_bests||{};
    document.getElementById('pfHeight').value=pi.height_cm||'';
    document.getElementById('pfWeight').value=pi.weight_kg||'';
    document.getElementById('pfAge').value=pi.age||'';
    document.getElementById('pfGender').value=pi.gender||'male';
    document.getElementById('pfRestHr').value=pi.resting_heart_rate||'';
    document.getElementById('pfMaxHr').value=pi.max_heart_rate||'';
    document.getElementById('pb5k').value=(pbs['5k']||{}).time||'';
    document.getElementById('pb10k').value=(pbs['10k']||{}).time||'';
    document.getElementById('pbHm').value=(pbs.half_marathon||{}).time||'';
    document.getElementById('pbM').value=(pbs.marathon||{}).time||'';
    document.getElementById('pbVo2').value=pbs.vo2max_estimate||'';

    // Preferences
    var pr=d.preferences||{},tp=pr.training_preferences||{};
    document.getElementById('prTime').value=tp.preferred_time||'evening';
    document.getElementById('prTerrain').value=(tp.preferred_terrain||['公路'])[0]||'公路';
    document.getElementById('prWorkouts').value=(tp.preferred_workouts||[]).join(',');
    document.getElementById('prInjury').value=(pr.injury_history||[]).length>0?pr.injury_history[0].description:'';
    document.getElementById('prPhilosophy').value=pr.training_philosophy||'';
  }catch(e){
    document.getElementById('loading').innerHTML='<p style="color:var(--danger)">加载失败: '+e.message+'</p>';
  }
}

async function disableCorosAutoRefresh(scope){
  if(!confirm('关闭后将立即删除该认证域保存的加密重放凭据，当前 Token 不受影响。是否继续？'))return;
  var isTraining=scope==='training';
  var btn=document.getElementById(isTraining?'corosReloginDisable':'corosSleepRefreshDisable');btn.disabled=true;
  try{
    var endpoint=isTraining?'/api/coros/auth/training/refresh-credential':'/api/coros/auth/sleep/refresh-credential';
    var r=await fetch(endpoint,{method:'DELETE'});
    var d=await r.json();
    if(!r.ok||d.status!=='ok')throw new Error(d.message||'删除失败');
    document.getElementById(isTraining?'corosReloginStatus':'corosSleepRefreshStatus').textContent='未启用';
    btn.style.display='none';
  }catch(e){alert(e.message||'删除失败');btn.disabled=false}
}

async function saveProfile(){
  var btn=document.getElementById('btnProfile');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
  try{
    var r=await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      height_cm:document.getElementById('pfHeight').value||null,weight_kg:document.getElementById('pfWeight').value||null,
      age:document.getElementById('pfAge').value||null,gender:document.getElementById('pfGender').value,
      resting_heart_rate:document.getElementById('pfRestHr').value||null,max_heart_rate:document.getElementById('pfMaxHr').value||null,
      pbs:{'5k':document.getElementById('pb5k').value||null,'10k':document.getElementById('pb10k').value||null,
        half_marathon:document.getElementById('pbHm').value||null,marathon:document.getElementById('pbM').value||null,
        vo2max:document.getElementById('pbVo2').value||null}
    })});
    var d=await r.json();
    document.getElementById('profileMsg').innerHTML=d.status==='ok'?'<span style="color:var(--performance)">✅ 已保存</span>':'<span style="color:var(--danger)">❌ '+(d.message||'失败')+'</span>';
  }catch(e){document.getElementById('profileMsg').innerHTML='<span style="color:var(--danger)">网络错误</span>'}
  btn.disabled=false;btn.textContent='保存';
}

async function savePrefs(){
  var btn=document.getElementById('btnPref');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
  try{
    await fetch('/api/preferences',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      preferred_time:document.getElementById('prTime').value,
      preferred_workouts:document.getElementById('prWorkouts').value||'间歇,节奏,长距离',
      preferred_terrain:document.getElementById('prTerrain').value,
      injury_history:document.getElementById('prInjury').value||'',
      training_philosophy:document.getElementById('prPhilosophy').value||'数据驱动，极化训练，重视恢复'
    })});
    btn.textContent='✅ 已保存';setTimeout(function(){btn.textContent='保存'},1500);
  }catch(e){}
  btn.disabled=false;
}
