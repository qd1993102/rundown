<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>neurun — 训练日报</title>
<style>
/* ═══════════════════════════════════════════
   neurun Dashboard — 复用 render.py 三主题系统
   ═══════════════════════════════════════════ */

[data-theme="fresh"] {
  --bg:#e8efe9; --bg-card:#fff; --text:#1a2e23; --text-secondary:#5a7d6e; --text-muted:#8aa89a;
  --accent:#2d9d6f; --accent-glow:rgba(45,157,111,.1); --recovery:#3b82b6; --recovery-glow:rgba(59,130,246,.08);
  --performance:#22a86e; --performance-glow:rgba(34,168,110,.08); --sleep:#7c6fcf; --sleep-glow:rgba(124,111,207,.08);
  --warning:#d4a017; --danger:#dc5b51; --hrv:#3b9fc6;
  --card-shadow:0 2px 8px rgba(0,0,0,.06); --card-shadow-hover:0 8px 30px rgba(0,0,0,.1);
  --border-subtle:#dde5df; --bg-subtle:#f0f4f0;
}
[data-theme="sport"] {
  --bg:#f0f0f0; --bg-card:#fff; --text:#171717; --text-secondary:#525252; --text-muted:#a3a3a3;
  --accent:#f15b2a; --accent-glow:rgba(241,91,42,.08); --recovery:#2563eb; --recovery-glow:rgba(37,99,235,.08);
  --performance:#16a34a; --performance-glow:rgba(22,163,74,.08); --sleep:#7c3aed; --sleep-glow:rgba(124,58,237,.08);
  --warning:#eab308; --danger:#ef4444; --hrv:#0891b2;
  --card-shadow:0 2px 10px rgba(0,0,0,.07); --card-shadow-hover:0 10px 35px rgba(0,0,0,.1);
  --border-subtle:#ebebeb; --bg-subtle:#f5f5f5;
}
[data-theme="dark"] {
  --bg:#0b1120; --bg-card:#1a2333; --text:#e2e8f0; --text-secondary:#94a3b8; --text-muted:#64748b;
  --accent:#34d399; --accent-glow:rgba(52,211,153,.12); --recovery:#60a5fa; --recovery-glow:rgba(96,165,250,.1);
  --performance:#4ade80; --performance-glow:rgba(74,222,128,.1); --sleep:#a78bfa; --sleep-glow:rgba(167,139,250,.1);
  --warning:#fbbf24; --danger:#f87171; --hrv:#22d3ee;
  --card-shadow:0 2px 10px rgba(0,0,0,.35); --card-shadow-hover:0 10px 30px rgba(0,0,0,.5);
  --border-subtle:#243044; --bg-subtle:#151e2c;
}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
.container{max-width:720px;margin:0 auto;padding:24px 20px 80px}

/* ── Header ── */
.header{display:flex;justify-content:space-between;align-items:center;padding:0 0 12px;flex-wrap:wrap;gap:8px}
.nav-tabs{display:flex;gap:4px;background:var(--bg-card);border-radius:24px;padding:4px;box-shadow:var(--card-shadow)}
.nav-tab{padding:8px 20px;border-radius:20px;font-size:13px;font-weight:600;color:var(--text-muted);text-decoration:none;transition:all .2s;letter-spacing:.5px}
.nav-tab:hover{color:var(--text-secondary)}
.nav-tab.active{background:var(--accent);color:#fff}
.header-actions{display:flex;align-items:center;gap:8px}

/* ── Theme Bar ── */
.theme-bar{display:flex;gap:4px}
.theme-btn{border:none;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;background:var(--border-subtle);color:var(--text-muted);transition:all .2s;letter-spacing:.5px}
.theme-btn:hover{opacity:.8}
.theme-btn.active{background:var(--accent);color:#fff}

/* ── Buttons ── */
.btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border-subtle);background:transparent;color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Loading ── */
.loading{text-align:center;padding:80px 20px;color:var(--text-muted);font-size:14px}
.loading .spinner{width:20px;height:20px;border-width:2px;margin-bottom:12px;display:block;margin-left:auto;margin-right:auto}

/* ── Plan Strip ── */
.plan-strip{display:flex;gap:10px;margin-bottom:20px;background:var(--accent-glow);border-radius:14px;padding:14px 18px;border:1px solid var(--border-subtle)}
.plan-item{flex:1;text-align:center}
.plan-val{display:block;font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;font-size:15px;font-weight:700;color:var(--text)}
.plan-lbl{display:block;font-size:10px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}

/* ── Hero Grid ── */
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.hero-card{background:var(--bg-card);border-radius:16px;padding:24px 18px;box-shadow:var(--card-shadow);text-align:center;transition:transform .15s,box-shadow .15s}
.hero-card:hover{transform:translateY(-2px);box-shadow:var(--card-shadow-hover)}
.hero-value{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1;margin-bottom:4px}
.hero-value span{font-size:16px;font-weight:500;opacity:.5;margin-left:4px}
.hero-value.sleep{color:var(--sleep)}.hero-value.recovery{color:var(--recovery)}.hero-value.readiness{color:var(--performance)}
.hero-label{font-size:13px;color:var(--text-secondary);font-weight:600}
.hero-sub{font-size:11px;color:var(--text-muted);margin-top:2px;text-transform:capitalize}

/* ── Metric Strip ── */
.metric-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:32px}
.metric-item{background:var(--bg-card);border-radius:12px;padding:18px 12px;text-align:center;box-shadow:var(--card-shadow)}
.metric-val{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1}
.metric-val.hrv{color:var(--hrv)}.metric-val.rhr{color:var(--performance)}.metric-val.bb{color:var(--accent)}.metric-val.stress{color:var(--sleep)}
.metric-lbl{font-size:10px;color:var(--text-muted);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}

/* ── Section Titles ── */
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin:28px 0 12px}

/* ── Session Cards ── */
.session-cards{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.session-card{background:var(--bg-card);border-radius:16px;padding:18px 20px;box-shadow:var(--card-shadow);display:flex;align-items:center;gap:16px;transition:box-shadow .15s}
.session-card:hover{box-shadow:var(--card-shadow-hover)}
.session-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:var(--accent-glow)}
.session-info{flex:1;min-width:0}
.session-name{font-weight:600;font-size:15px;color:var(--text)}
.session-type{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
.session-metrics{display:flex;gap:20px;flex-shrink:0}
.session-metric{text-align:center}
.session-metric .val{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;font-size:18px;font-weight:700;color:var(--text)}
.session-metric .lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.activity-summary-strip{display:flex;gap:12px;margin-bottom:14px;font-size:13px;color:var(--text-secondary);flex-wrap:wrap}
.activity-summary-strip span{background:var(--bg-card);padding:6px 14px;border-radius:20px;box-shadow:var(--card-shadow);font-weight:600}

/* ── Rest Day ── */
.rest-card{background:var(--bg-card);border-radius:16px;padding:36px;text-align:center;box-shadow:var(--card-shadow);margin-bottom:8px}
.rest-emoji{font-size:48px;margin-bottom:8px}
.rest-card h3{font-size:18px;color:var(--text);margin-bottom:4px}
.rest-detail{font-size:13px;color:var(--text-secondary)}

/* ── Load Card ── */
.load-card{background:var(--bg-card);border-radius:16px;padding:28px;box-shadow:var(--card-shadow);margin-bottom:8px}
.load-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}
.load-header h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted)}
.load-score{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;font-size:44px;font-weight:800;letter-spacing:-1px;color:var(--text)}
.load-stats{display:flex;gap:24px;justify-content:center;margin-top:18px}
.load-stat{text-align:center}
.load-stat .val{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;font-size:20px;font-weight:700;color:var(--text)}
.load-stat .lbl{font-size:11px;color:var(--text-muted)}

/* ── Plan Execution Card ── */
.plan-exec-card{background:var(--bg-card);border-radius:16px;padding:20px 24px;box-shadow:var(--card-shadow);margin-bottom:12px;border-left:3px solid var(--accent)}
.pe-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.pe-label{color:var(--text-muted);min-width:64px}
.pe-val{color:var(--text);font-weight:500;text-align:right}

/* ── AI Insight ── */
.ai-section{background:var(--bg-card);border-radius:16px;padding:28px;box-shadow:var(--card-shadow);margin-bottom:8px;border-left:3px solid var(--accent)}
.ai-conclusion{font-size:16px;color:var(--text);line-height:1.8;font-weight:500;padding:14px 18px;background:var(--accent-glow);border-radius:12px;margin-bottom:14px}
.ai-block{margin-bottom:10px}
.ai-block h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;color:var(--text-muted)}
.ai-block ul{list-style:none}
.ai-block li{font-size:13px;color:var(--text-secondary);padding:2px 0}
.ai-model{font-size:10px;color:var(--text-muted);margin-top:12px;text-align:right}

/* ── Empty / Footer ── */
.empty-state{text-align:center;padding:60px 20px}
.empty-state .icon{font-size:48px;margin-bottom:16px}
.empty-state h2{font-size:18px;color:var(--text);margin-bottom:8px}
.empty-state p{font-size:13px;color:var(--text-muted);margin-bottom:24px;line-height:1.6}
.footer{text-align:center;padding:40px 0 20px;font-size:11px;color:var(--text-muted);letter-spacing:1px;font-weight:500}
.footer span{background:linear-gradient(135deg,var(--accent),#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700}

@media(max-width:640px){
  .container{padding:16px 14px 60px}
  .hero-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .hero-card{padding:14px 8px}
  .hero-value{font-size:28px}
  .metric-strip{grid-template-columns:repeat(2,1fr)}
  .metric-val{font-size:22px}
  .session-card{flex-direction:column;align-items:flex-start;gap:12px}
  .session-metrics{width:100%;justify-content:space-between}
  .load-stats{flex-direction:column;gap:8px}
  .sync-options{gap:6px}
}
</style>
</head>
<body data-theme="dark">

<div class="container">

<!-- Header Row: Nav + Theme -->
<div class="header">
  <div class="nav-tabs">
    <a href="/sync" class="nav-tab">同步</a>
    <a href="/reports" class="nav-tab active">日报</a>
    <a href="/profile" class="nav-tab">我的</a>
  </div>
  <div class="header-actions">
    <div class="theme-bar">
      <button class="theme-btn active" data-theme="dark" onclick="setTheme('dark')">暗黑</button>
      <button class="theme-btn" data-theme="sport" onclick="setTheme('sport')">运动</button>
      <button class="theme-btn" data-theme="fresh" onclick="setTheme('fresh')">清新</button>
    </div>
    <input type="date" id="viewDate" style="padding:5px 10px;border-radius:20px;border:1px solid var(--border-subtle);background:var(--bg-card);color:var(--text);font-size:12px;outline:none;font-family:inherit" onchange="onDateChange()" title="查看指定日期">
  </div>
</div>

<!-- Loading -->
<div class="loading" id="loading"><span class="spinner"></span>加载中...</div>

<!-- Dashboard -->
<div id="dashboard" style="display:none">

  <!-- Plan Status -->
  <div class="plan-strip" id="planStrip" style="display:none">
    <div class="plan-item"><span class="plan-val" id="planPhase">—</span><span class="plan-lbl">阶段</span></div>
    <div class="plan-item"><span class="plan-val" id="planWeek">—</span><span class="plan-lbl">剩余周数</span></div>
    <div class="plan-item"><span class="plan-val" id="planTarget">—</span><span class="plan-lbl">周目标 km</span></div>
    <div class="plan-item"><span class="plan-val" id="planNote">—</span><span class="plan-lbl">大纲状态</span></div>
  </div>

  <!-- AI Insight (置顶) -->
  <div id="aiArea"></div>

  <!-- Hero Grid -->
  <div class="hero-grid">
    <div class="hero-card">
      <div class="hero-value sleep" id="heroSleep">—<span>h</span></div>
      <div class="hero-label">睡眠</div>
      <div class="hero-sub" id="heroSleepQuality">—</div>
    </div>
    <div class="hero-card">
      <div class="hero-value recovery" id="heroRecovery">—<span>/100</span></div>
      <div class="hero-label">恢复评分</div>
      <div class="hero-sub" id="heroRecoveryLevel">—</div>
    </div>
    <div class="hero-card">
      <div class="hero-value readiness" id="heroReadiness">—</div>
      <div class="hero-label">训练准备</div>
      <div class="hero-sub" id="heroReadinessLevel">—</div>
    </div>
  </div>

  <!-- Metric Strip -->
  <div class="metric-strip">
    <div class="metric-item"><div class="metric-val hrv" id="metHrv">—</div><div class="metric-lbl">HRV ms</div></div>
    <div class="metric-item"><div class="metric-val rhr" id="metRhr">—</div><div class="metric-lbl">静息心率</div></div>
    <div class="metric-item"><div class="metric-val bb" id="metBb">—</div><div class="metric-lbl">身体电量</div></div>
    <div class="metric-item"><div class="metric-val stress" id="metStress">—</div><div class="metric-lbl">压力</div></div>
  </div>

  <!-- Training -->
  <div class="section-title">🏃 昨日训练</div>
  <div id="trainingArea"></div>

  <!-- Load -->
  <div class="section-title">📈 训练负荷</div>
  <div class="load-card">
    <div class="load-header">
      <h3>负荷与恢复</h3>
      <div class="load-score" id="loadAcwr">—</div>
    </div>
    <div class="load-stats">
      <div class="load-stat"><div class="val" id="loadChronic">—</div><div class="lbl">慢性负荷</div></div>
      <div class="load-stat"><div class="val" id="loadAcute">—</div><div class="lbl">急性负荷</div></div>
      <div class="load-stat"><div class="val" id="loadStatus">—</div><div class="lbl">状态</div></div>
    </div>
  </div>

  <!-- Empty -->
  <div class="empty-state" id="emptyState" style="display:none">
    <div class="icon">📡</div>
    <h2>暂无数据</h2>
    <p>选择日期，点击「同步」生成日报。</p>
  </div>

  <div class="footer">Built with <span>neurun</span></div>
</div>

</div><!-- /.container -->

<script>
function $(id){return document.getElementById(id)}

// ── Theme ──
var savedTheme = localStorage.getItem('neurun-theme')||'dark';
document.body.setAttribute('data-theme', savedTheme);
document.querySelectorAll('.theme-btn').forEach(function(b){
  b.classList.toggle('active', b.dataset.theme===savedTheme);
});

function setTheme(t){
  document.body.setAttribute('data-theme', t);
  localStorage.setItem('neurun-theme', t);
  document.querySelectorAll('.theme-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.theme===t);
  });
}

// ── Render ──
function render(d){
  if(!d.has_data){
    $('dashboard').style.display='block';
    $('emptyState').style.display='block';
    return;
  }
  $('dashboard').style.display='block';
  $('loading').style.display='none';
  $('emptyState').style.display='none';

  // Plan context
  var pc=d.plan_context||{};
  if(pc.exists){
    $('planStrip').style.display='flex';
    $('planPhase').textContent=pc.phase||'—';
    $('planWeek').textContent=pc.weeks_to_race||'—';
    $('planTarget').textContent=(pc.weekly_km_target||'—')+' km';
    $('planNote').textContent='📋 大纲已生效';
  }else{
    $('planStrip').style.display='none';
  }

  var sl=d.last_night_sleep||{}, rc=d.recovery||{}, mo=d.this_morning||{};
  var ya=d.yesterday_activities||{}, ld=d.training_load||{}, ai=d.ai_insight||{};

  // ── AI Insight (置顶) ──
  var aiHtml='';
  if(ai.conclusion){
    aiHtml+='<div class="section-title" style="margin-top:0">🤖 AI 教练洞察</div>';
    var pe=ai.plan_execution||{};
    if(pe.today_planned){
      var mc=pe.today_match==='完全执行'?'var(--performance)':pe.today_match==='部分执行'?'var(--warning)':'var(--danger)';
      aiHtml+='<div class="plan-exec-card">';
      aiHtml+='<div class="pe-row"><span class="pe-label">大纲要求</span><span class="pe-val">'+pe.today_planned+'</span></div>';
      aiHtml+='<div class="pe-row"><span class="pe-label">实际执行</span><span class="pe-val">'+pe.today_actual+'</span></div>';
      aiHtml+='<div class="pe-row"><span class="pe-label">执行状态</span><span class="pe-val" style="color:'+mc+'">'+pe.today_match+'</span></div>';
      if(pe.week_completion)aiHtml+='<div class="pe-row"><span class="pe-label">本周完成</span><span class="pe-val">'+pe.week_completion+'</span></div>';
      if(pe.deviation_note)aiHtml+='<div class="pe-row"><span class="pe-label">偏离说明</span><span class="pe-val">'+pe.deviation_note+'</span></div>';
      aiHtml+='</div>';
    }
    aiHtml+='<div class="ai-section">';
    aiHtml+='<div class="ai-conclusion">'+ai.conclusion+'</div>';
    (ai.observations||[]).forEach(function(o){aiHtml+='<div class="ai-block"><ul><li>'+o+'</li></ul></div>'});
    if(ai.model)aiHtml+='<div class="ai-model">模型: '+ai.model+(ai.plan_adjusted?' | 大纲已调整':'')+'</div>';
    aiHtml+='</div>';
  }
  $('aiArea').innerHTML=aiHtml;

  // ── Hero ──
  $('heroSleep').innerHTML=(sl.total_hours||'—')+'<span>h</span>';
  $('heroSleepQuality').textContent=sl.quality||'—';
  $('heroRecovery').innerHTML=(rc.overall_score||'—')+'<span>/100</span>';
  $('heroRecoveryLevel').textContent=rc.level||'—';
  $('heroReadiness').textContent=mo.training_readiness_score||'—';
  $('heroReadinessLevel').textContent=mo.training_readiness_level||'—';

  $('metHrv').textContent=mo.hrv_ms||'—';
  $('metRhr').textContent=mo.resting_hr||'—';
  $('metBb').textContent=mo.body_battery_morning!=null?mo.body_battery_morning:'—';
  $('metStress').textContent=mo.avg_stress||'—';

  // Training
  var t='';
  if(ya.is_rest_day){
    t='<div class="rest-card"><div class="rest-emoji">🧘</div><h3>休息日</h3>';
    var steps=ya.daily_steps||0,dist=ya.daily_distance_km||0;
    t+='<p class="rest-detail">'+(steps>5000?steps+' 步 · '+dist.toFixed(1)+' km':'身体在恢复中')+'</p></div>';
    if(steps>0){
      t+='<div class="activity-summary-strip">';
      t+='<span>👣 '+steps+' 步</span>';
      if(dist>0)t+='<span>📏 '+dist.toFixed(1)+' km</span>';
      if(ya.daily_active_cal)t+='<span>🔥 '+ya.daily_active_cal+' cal</span>';
      t+='</div>';
    }
  }else{
    if(ya.total_duration_min||ya.total_distance_km){
      t+='<div class="activity-summary-strip">';
      t+='<span>⏱ '+(ya.total_duration_min||0)+' min</span>';
      if(ya.total_distance_km)t+='<span>📏 '+ya.total_distance_km.toFixed(1)+' km</span>';
      t+='<span>📊 负荷 '+(ya.total_training_load||0)+'</span>';
      t+='</div>';
    }
    (ya.sessions||[]).forEach(function(s){
      var icon=s.type==='running'?'🏃':s.type==='cycling'?'🚴':s.type==='swimming'?'🏊':'💪';
      var dkm=s.distance_km?s.distance_km+'km':'';
      t+='<div class="session-cards"><div class="session-card">';
      t+='<div class="session-icon">'+icon+'</div>';
      t+='<div class="session-info"><div class="session-name">'+s.name+'</div><div class="session-type">'+s.type+'</div></div>';
      t+='<div class="session-metrics">';
      t+='<div class="session-metric"><div class="val">'+s.duration_min+'</div><div class="lbl">min</div></div>';
      if(dkm)t+='<div class="session-metric"><div class="val">'+dkm+'</div><div class="lbl">距离</div></div>';
      t+='<div class="session-metric"><div class="val">'+(s.avg_hr||'—')+'</div><div class="lbl">HR</div></div>';
      t+='<div class="session-metric"><div class="val">'+(s.training_load||0)+'</div><div class="lbl">负荷</div></div>';
      t+='</div></div></div>';
    });
  }
  $('trainingArea').innerHTML=t;

  // Load
  $('loadAcwr').textContent=ld.acwr||'—';
  $('loadChronic').textContent=ld.chronic_load||'—';
  $('loadAcute').textContent=ld.acute_load||'—';
  $('loadStatus').textContent=ld.acwr_status||'—';

}

// ── Load ──
async function loadDashboard(){
  $('loading').style.display='block';
  $('dashboard').style.display='none';
  try{
    var url='/api/dashboard';
    var dp=new URLSearchParams(location.search).get('date');
    if(dp)url+='?date='+dp;
    var r=await fetch(url);
    if(r.status===401){location.href='/';return}
    render(await r.json());
  }catch(e){
    $('loading').innerHTML='<p style="color:var(--danger)">加载失败: '+e.message+'</p>';
  }
}

function onDateChange(){
  var d=$('viewDate').value;
  if(d)location.href='/?date='+d;
}

// ── Init ──
var today=new Date().toISOString().slice(0,10);
$('viewDate').value=today;
var dp=new URLSearchParams(location.search).get('date');
if(dp)$('viewDate').value=dp;

loadDashboard();
</script>
