<script>
const app=document.getElementById('app'),statusNode=document.getElementById('status');let home=null,setupState=null,draftTaskId=null,draftPollTimer=null;
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const planTextMap={'Easy Run':'轻松跑','easy run':'轻松跑','easy':'轻松跑','Tempo Run':'节奏跑','tempo run':'节奏跑','tempo':'节奏跑','Long Run':'长距离跑','long run':'长距离跑','long':'长距离跑','Intervals':'间歇跑','Interval Run':'间歇跑','interval run':'间歇跑','interval':'间歇跑','fartlek':'变速跑','quality':'质量训练','Recovery Run':'恢复跑','recovery run':'恢复跑','recovery':'恢复跑','Rest and Recovery':'休息与恢复','rest':'休息','Aerobic Base':'有氧基础期','aerobic base':'有氧基础期','aerobic_base':'有氧基础期','base':'基础期','Base':'基础期','Build':'提升期','build':'提升期','Volume & Strength':'跑量与力量期','Peak':'巅峰期','Taper':'赛前减量期','taper':'赛前减量期','phase_1':'基础期','phase_2':'提升期','phase_3':'专项期','phase_4':'赛前减量期','aerobic base building':'建立有氧基础','Build aerobic foundation and running economy':'建立有氧基础与跑步经济性','Increase mileage with added quality sessions':'逐步增加跑量并加入质量训练','Race simulation with high volume and intensity':'高负荷与专项强度模拟','Reduce volume while sharpening race-specific fitness':'降低跑量并保持专项状态','aerobic endurance':'有氧耐力','pace_change':'配速变化','threshold':'阈值耐力','race_specific':'比赛专项','controlled':'可控强度','easy effort':'轻松强度','hard but controlled':'较高但可控的强度','easy until breathing recovers':'放慢到呼吸恢复','easy jog or walk':'轻松慢跑或步行'};
const zhPlan=v=>{const raw=String(v??'');return planTextMap[raw]||planTextMap[raw.toLowerCase()]||raw.replaceAll('_',' ')};
function draftProgressMarkup(updating=false,task=null){const stages=['读取并校验训练事实','生成训练框架','生成当前与下一周课表','补全配速并校验安全边界'],state=task?.state||'waiting',current=state==='succeeded'?4:state==='running'?2:1;return `<section class="draft-progress" aria-label="草稿生成进度"><div class="draft-progress-head"><strong>${state==='succeeded'?'草稿已完成':updating?'正在重新计算方案草稿':'正在生成方案草稿'}</strong><span>${state==='waiting'?'已排队':state==='running'?'处理中':'已完成'}</span></div><div class="draft-progress-track">${stages.map((stage,index)=>`<span class="draft-progress-step ${index<current?'done':''} ${index+1===current&&state!=='succeeded'?'active':''}">${stage}</span>`).join('')}</div><div class="draft-progress-facts"><span>能力、当前状态与目标需求并行准备</span><span>缺失信息会标记并降级生成</span><span>恢复优先，ACWR 次级校验</span></div></section>`}
function draftFailureMarkup(task){const stageLabels={sync_readiness:'训练事实准备',daily_summary:'单日训练复盘',training_framework:'训练框架',near_term_schedule:'当前与下一周课表',local_validation:'本地结构校验'};const stage=stageLabels[task?.failure_stage]||task?.failure_stage||'方案生成';const completed=(task?.completed_stages||[]).map(x=>stageLabels[x]||x).join('、')||'暂无';const retry=task?.retryable!==false?`<button class="btn primary" type="button" id="retryDraft">重新生成</button>`:'';return `<section class="draft-progress" aria-live="assertive"><div class="draft-progress-head"><strong>草稿生成失败</strong><span>${esc(stage)}</span></div><p><strong>失败阶段：</strong>${esc(stage)}</p><p><strong>原因：</strong>${esc(task?.message||'未得到完整可执行结果')}</p><p><strong>已完成：</strong>${esc(completed)}</p><p><strong>未完成：</strong>${esc(stage)}及后续本地校验</p><p class="muted">已成功的阶段会在重新生成时复用；缺失数据不会自动补造。</p>${retry}</section>`}
function saveDraftTask(id){draftTaskId=id;try{localStorage.setItem('neurun-training-draft-task',id)}catch(e){}}
function clearDraftTask(){draftTaskId=null;if(draftPollTimer){clearTimeout(draftPollTimer);draftPollTimer=null}try{localStorage.removeItem('neurun-training-draft-task')}catch(e){}}
function setDraftFormBusy(busy){const form=document.getElementById('constraintsForm')||document.getElementById('supplementForm');if(!form)return;form.querySelectorAll('input,select,textarea,button').forEach(control=>{control.disabled=busy});if(!busy){const submit=form.querySelector('[type="submit"]');if(submit)submit.disabled=false}}
function scheduleDraftPoll(id,delay=1000){if(draftPollTimer)clearTimeout(draftPollTimer);draftPollTimer=setTimeout(()=>pollDraftTask(id),delay)}
async function pollDraftTask(id){if(!id||id!==draftTaskId)return;try{const r=await api(`/api/training/tasks/${encodeURIComponent(id)}`),task=r.task;setDraftFormBusy(task.state==='queued'||task.state==='waiting'||task.state==='running');statusNode.innerHTML=task.state==='failed'?draftFailureMarkup(task):draftProgressMarkup(false,task);if(task.state==='queued'||task.state==='waiting'||task.state==='running'){scheduleDraftPoll(id,1000);return}clearDraftTask();if(task.state==='succeeded'){say('草稿已生成，请先查看依据和首周结构。');await load(false)}else{setDraftFormBusy(false);const retry=document.getElementById('retryDraft');if(retry)retry.addEventListener('click',()=>createDraft())}}catch(e){if(e.status===404){clearDraftTask();setDraftFormBusy(false);say('之前的草稿任务已失效，请重新生成。');return}scheduleDraftPoll(id,2000)}}
const api=async(path,options={})=>{const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})},cache:'no-store'});const data=await r.json();if(!r.ok){const error=new Error(data.message||'请求失败');error.status=r.status;throw error}return data};
const say=message=>{statusNode.textContent=message||''};
const statusLabel={completed:'已完成',partially_completed:'部分完成',skipped:'今天没练',unmatched:'等待匹配',planned:'待训练',rest:'休息'};
const modeLabel={continuous_running:'持续跑步陪伴',race_preparation:'目标赛事备赛'};
const modeBannerMarkup=()=>'';
const feasibilityLabel={feasible:'目标可行',challenging:'具有挑战',not_recommended:'当前不建议',insufficient_data:'信息不足'};
const decisionLabel={ai_validated:'AI 专业方案',ai_repaired:'AI 方案 · 已安全规范化',ai_risk_advisory:'AI 风险评估 · 待你选择',deterministic_fallback:'保守规则兜底'};
function decisionMeta(s){const status=s.decision_status||(s.generation_mode==='skill'?'ai_validated':'deterministic_fallback');return {status,label:decisionLabel[status]||status,isAI:status!=='deterministic_fallback',warning:status!=='ai_validated'}}
function setTheme(theme){document.body.dataset.theme=theme;localStorage.setItem('neurun-theme',theme);document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active',b.dataset.theme===theme))}
document.querySelectorAll('.theme-btn').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.theme)));setTheme(localStorage.getItem('neurun-theme')||'dark');
async function load(clearStatus=true){try{if(clearStatus)say('');home=await api('/api/training/home');home.has_active_plan?renderActive():renderEmpty();await loadReportProposal()}catch(e){app.innerHTML=`<section class="empty"><h2>暂时无法读取训练方案</h2><p>${esc(e.message)}</p><button class="btn" onclick="load()">重试</button></section>`}}
function timelineMarkup(timeline){const phases=timeline?.phases||[];if(!phases.length)return '<p class="timeline-note">阶段时间线仍在生成中。</p>';const bridge=timeline.status==='bridge',total=Number(timeline.total_weeks||0),planned=Number(timeline.planned_week||0),percent=Number(timeline.progress_percent||0),current=timeline.current_phase||{};const headline=bridge?'当前为衔接周，不计入阶段进度':`计划时间线 ${percent}%`;const detail=bridge?`首个完整训练周从 ${esc(timeline.first_full_week_start||'下周')} 开始`:`第 ${planned} / ${total} 周 · ${esc(current.name||'阶段待确认')}${timeline.current_phase_week?`（本阶段第 ${timeline.current_phase_week} / ${current.weeks} 周）`:''}`;return `<div class="timeline-summary"><strong>${headline}</strong><span>${detail}</span></div><div class="timeline-track" role="progressbar" aria-label="训练方案计划时间线" aria-valuemin="0" aria-valuemax="${esc(total)}" aria-valuenow="${esc(planned)}">${phases.map(phase=>`<span class="timeline-segment ${esc(phase.status||'upcoming')}" style="flex:${Math.max(1,Number(phase.weeks)||1)}" title="${esc(phase.name)} · ${esc(phase.weeks)} 周"></span>`).join('')}</div><div class="phase-timeline">${phases.map(phase=>`<article class="timeline-phase ${esc(phase.status||'upcoming')}"><span>${esc(phase.status==='current'?'计划所处阶段':phase.status==='completed'?'已过时间段':'后续阶段')} · ${esc(phase.weeks)} 周</span><strong>${esc(phase.name)}</strong><p>${esc(phase.purpose||'')}</p></article>`).join('')}</div><p class="timeline-note">${esc(timeline.note||'这是计划时间线；实际是否加快、保持或减量以周复盘和你的确认决定。')}</p>`}
function factsMarkup(){const capacity=home.capacity_profile||{},sustainable=capacity.current_sustainable_capacity||{},coverage=home.sync_coverage||{},weeklyKm=Number(sustainable.weekly_km||0),coverageText=coverage.expected_days?`${coverage.covered_days||0} / ${coverage.expected_days} 天已覆盖`:'尚未形成当周覆盖';return `<section class="card"><div class="card-head"><div><span class="eyebrow">训练基础与数据状态</span><h2>当前能力参考</h2></div><a class="btn" href="/sync?from=training&return_to=/training#single-sync">同步事实</a></div><div class="scheme-grid"><div class="scheme-stat"><span>近期可持续能力（估算）</span><strong>${weeklyKm?`${esc(weeklyKm)} km / 周`:'待更多数据'}</strong></div><div class="scheme-stat"><span>数据截至</span><strong>${esc(capacity.facts_cutoff||'尚无活动')}</strong></div><div class="scheme-stat"><span>本周数据覆盖</span><strong>${esc(coverageText)}</strong></div></div><p class="why" style="margin-top:12px">这是依据已同步近期活动形成的能力参考，不等同于本周实际跑量，也不会单独推进训练阶段。${capacity.interpretation?` ${esc(capacity.interpretation)}`:''}</p></section>`}

function adjustmentKind(text){const s=String(text||'');return /对齐|结算|补齐|延展|骨架/.test(s)?'tech':'schedule'}
function adjustmentsMarkup(adjustments){
  const items=adjustments||[];if(!items.length)return '';
  const sched=items.filter(function(a){return adjustmentKind(a)==='schedule'}),tech=items.length-sched.length;
  if(!sched.length)return `<section class="plan-section"><h4>安全校验</h4><p class="muted">方案已通过确定性安全校验${tech?`；另有 ${tech} 项周目标/负荷的技术性对齐为内部处理，不影响你的训练安排。`:'。'}</p></section>`;
  return `<section class="plan-section"><h4>方案已做哪些安全调整</h4><ul class="evidence-list">${sched.map(function(x){return `<li>${esc(zhPlan(String(x)))}</li>`}).join('')}</ul>${tech?`<p class="muted" style="margin-top:6px">另有 ${tech} 项周目标/负荷技术性对齐已自动处理，不影响训练安排。</p>`:''}</section>`;
}
function adjustmentsInlineMarkup(adjustments){
  const items=adjustments||[];if(!items.length)return '';
  const sched=items.filter(function(a){return adjustmentKind(a)==='schedule'}),tech=items.length-sched.length;
  const text=sched.length?sched.map(function(x){return zhPlan(String(x))}).join('；'):'仅技术性对齐，训练安排未变';
  return text+(tech?`（另有 ${tech} 项周目标/负荷对齐为内部处理）`:'');
}

function weekRhythmCardMarkup(){const w=home.week,t=home.today,weekItems=(w.workouts||[]).map((day,index)=>({day,index})),stimuli=[...new Set(weekItems.flatMap(({day})=>day.training_prescription?.stimuli||[]))].slice(0,4),keyCount=weekItems.filter(({day})=>day.is_key).length,longCount=weekItems.filter(({day})=>day.type==='long').length,coverage=home.sync_coverage||{},incompleteDays=(coverage.incomplete_dates||[]).length,upcoming=weekItems.filter(({day})=>String(day.date)>String(t?.date||'')).slice(0,3);const doneCount=Number(w.progress.completed_sessions||0);const planPills=doneCount>0?`<span class="pill">完成 ${esc(doneCount)} 次</span><span class="pill">已跑 ${esc(w.progress.completed_km)} km</span>`:'';const syncNote=coverage.checked_through?`进度统计至 ${esc(coverage.checked_through)} · 已覆盖 ${esc(coverage.covered_days||0)}/${esc(coverage.expected_days||0)} 天`:'';return `<section class="card" id="weekRhythmCard"><div class="card-head"><div><span class="eyebrow">本周怎么跑 / 进度如何</span><h2>${esc(w.week_start)} — ${esc(w.week_end)}</h2></div><div class="week-actions"><a class="btn" href="/reports?tab=weekly&week=${encodeURIComponent(w.week_start)}">查看本周进度</a><button class="btn" type="button" onclick="refreshWeekProgress(this)">刷新进度</button></div></div><div class="week-progress">${planPills}<span class="pill">目标 ${esc(w.progress.target_km)} km</span><span class="pill fact">实际 ${esc(w.progress.actual_sessions||0)} 次 · 跑步 ${esc(w.progress.actual_running_km||0)} km</span></div>${syncNote?`<div class="week-sync-status${incompleteDays?' warning':''}">${syncNote}${incompleteDays?` · 仍有 ${incompleteDays} 天未同步，先同步数据再刷新进度`:''}</div>`:''}<p class="week-rhythm-copy">本周 ${keyCount} 节关键训练${longCount?`，${longCount} 次长距离`:''}；先完成今天，再按本周进度推进。</p><div class="week-focus">${stimuli.map(item=>`<span class="pill">${esc(stimulusLabel[item]||item)}</span>`).join('')}</div>${upcoming.length?`<div class="upcoming-section"><span class="eyebrow">接下来几天</span><div class="upcoming-grid">${upcoming.map(item=>sessionCard(item,'upcomingSessionPanel','upcoming-day')).join('')}</div><div id="upcomingSessionPanel" class="week-session-panel" aria-live="polite"></div></div>`:'<p class="muted" style="margin-top:12px">本自然周没有更多训练安排，按恢复与下周计划衔接。</p>'}<details class="week-overview"><summary>查看本周完整安排（7 天）</summary><div class="week-overview-content"><div class="week-grid">${weekItems.map(item=>sessionCard(item,'weekSessionPanel')).join('')}</div><div id="weekSessionPanel" class="week-session-panel" aria-live="polite"></div></div></details></section>`}
async function refreshWeekProgress(button){button.disabled=true;try{home=await api('/api/training/home');const el=document.getElementById('weekRhythmCard');if(el)el.outerHTML=weekRhythmCardMarkup();document.querySelectorAll('#weekRhythmCard [data-session-detail]').forEach(b=>b.addEventListener('click',()=>openSessionDetail(b.dataset.sessionDetail,b.dataset.sessionDetailPanel)));say('本周进度已刷新')}catch(e){say(e.message)}finally{button.disabled=false}}
function findingMarkup(result){const f=result.finding||{},fallback=result.generation_mode!=='skill';return `<section class="proposal"><div><span class="eyebrow">${fallback?'保守规则说明':'AI Coach Skill'}</span><h3>${esc(f.conclusion||'暂无结论')}</h3>${fallback?`<p class="muted">降级原因：${esc(result.fallback_reason||'在线 AI 不可用')}</p>`:''}</div>${(f.evidence||[]).length?`<div class="detail-block"><strong>依据</strong><p>${f.evidence.map(esc).join('；')}</p></div>`:''}${(f.recommendations||[]).length?`<div class="detail-block"><strong>建议</strong><ul class="evidence-list">${f.recommendations.map(item=>`<li>${esc(item)}</li>`).join('')}</ul></div>`:''}${(f.uncertainties||[]).length?`<p class="why">不确定性：${f.uncertainties.map(esc).join('、')}</p>`:''}</section>`}
function sessionBriefMarkup(brief){const f=brief.finding||{},recommendations=(f.recommendations||[]).slice(0,5),risks=(f.risk_flags||[]).slice(0,2),pace=f.pace_result||{},paceLabel=pace.range?`今日配速 ${esc(pace.range)}`:pace.safety_action?esc(pace.safety_action):pace.status==='feel_only'?'配速按体感执行':'';return `<section class="proposal"><div><span class="eyebrow">训练前说明</span><h3>${esc(f.conclusion||'按今天的训练安排执行。')}</h3>${paceLabel?`<p class="prescription-target"><strong>${paceLabel}</strong></p>`:''}</div>${recommendations.length?`<div class="detail-block"><strong>怎么做</strong><ul class="evidence-list">${recommendations.map(item=>`<li>${esc(item)}</li>`).join('')}</ul></div>`:''}${risks.length?`<p class="why">${risks.map(esc).join('；')}</p>`:''}${recommendationExplanationMarkup(f.explanation)}</section>`}
async function loadSessionBrief(event){const button=event.currentTarget;button.disabled=true;try{const data=await api(`/api/training/session-brief?date=${encodeURIComponent(home.today.date)}`);document.getElementById('sessionBriefPanel').innerHTML=sessionBriefMarkup(data.brief);say('训练前说明已生成，只提供执行指导，不修改方案。')}catch(e){say(e.message)}finally{if(button)button.disabled=false}}
async function loadRaceStrategy(event){const button=event.currentTarget;button.disabled=true;try{const data=await api('/api/training/race-strategy',{method:'POST',body:JSON.stringify({})});document.getElementById('raceStrategyPanel').innerHTML=findingMarkup(data.strategy);say('比赛策略已生成；缺失的赛道、天气或补给事实已明确标注。')}catch(e){say(e.message)}finally{if(button)button.disabled=false}}
function openSchemeRevision(){const c=home.scheme.constraints||{};document.getElementById('schemeRevisionPanel').innerHTML=`<form class="feedback-panel" id="schemeRevisionForm"><div><span class="eyebrow">调整目标或重规划</span><h3>什么长期变化使当前方案不再适合？</h3><p class="muted">目标、赛事日期、连续执行或固定日程发生变化时，在这里先生成差异，再由你确认新版本；不会直接改写正在执行的计划。</p></div><label>变化类型<select name="trigger"><option value="execution_deviation">连续执行偏差</option><option value="constraints_change">长期日程变化</option><option value="goal_change">目标变化</option><option value="long_break">长期停训或回归</option><option value="race_rescheduled">赛事延期</option></select></label><label>具体原因<textarea name="reason" required placeholder="例如：赛事改期到 11 月，或未来六周每周只能跑三次"></textarea></label><div class="form-grid"><label>每周可训练日<span class="day-checks">${[0,1,2,3,4,5,6].map(day=>`<label><input type="checkbox" name="available_days" value="${day}" ${(c.available_days||[]).includes(day)?'checked':''}>周${'一二三四五六日'[day]}</label>`).join('')}</span></label><label>单次最长训练（分钟）<input name="max_session_minutes" type="number" min="20" max="360" value="${esc(c.max_session_minutes||90)}" required></label></div><div class="proposal-actions"><button class="btn primary" type="submit">生成重规划差异</button><button class="btn" type="button" data-cancel-revision>取消</button></div></form>`;document.querySelector('#schemeRevisionForm').addEventListener('submit',submitSchemeRevision);document.querySelector('[data-cancel-revision]').addEventListener('click',()=>document.getElementById('schemeRevisionPanel').replaceChildren())}
async function submitSchemeRevision(event){event.preventDefault();const submitter=event.submitter;submitter.disabled=true;const f=new FormData(event.currentTarget),days=f.getAll('available_days').map(Number);if(!days.length){say('请至少选择一个可训练日。');submitter.disabled=false;return}try{const data=await api('/api/training/scheme-revisions',{method:'POST',body:JSON.stringify({trigger:f.get('trigger'),reason:f.get('reason'),constraints:{available_days:days,max_session_minutes:Number(f.get('max_session_minutes'))}})});document.getElementById('schemeRevisionPanel').innerHTML=proposalMarkup(data.proposal);wireProposalActions();say('方案级重规划已生成，当前版本尚未改变。')}catch(e){say(e.message);submitter.disabled=false}}
function openFeedback(kind){const labels={constraint_change:'时间或安排变了',time_limited:'时间不足',fatigue:'有点疲劳',pain:'出现疼痛',schedule_conflict:'日程冲突'};const panel=document.getElementById('feedbackPanel');panel.innerHTML=`<form class="feedback-panel" id="feedbackForm"><div><span class="eyebrow">训练反馈</span><h3>${labels[kind]}</h3></div>${kind==='constraint_change'||kind==='time_limited'?'<label>今天可用分钟数（可选）<input name="available_minutes" type="number" min="10" max="360" value="30"></label>':''}${kind==='constraint_change'?`<label>长期可训练日（可选）<span class="day-checks">${[0,1,2,3,4,5,6].map(day=>`<label><input type="checkbox" name="new_available_days" value="${day}">周${'一二三四五六日'[day]}</label>`).join('')}</span><span class="muted">填写后从下个自然周生效；不填写则只调整当前安排。</span></label>`:''}${kind==='pain'?'<div class="form-grid"><label>疼痛部位<input name="pain_location" required placeholder="例如：右膝外侧"></label><label>严重程度 1–10<input name="pain_severity" type="number" min="1" max="10" value="3" required></label></div>':''}<label>补充说明（可选）<textarea name="note" placeholder="例如：昨晚睡眠不足，或下午要开会"></textarea></label><div class="proposal-actions"><button class="btn primary" type="submit">生成调整提案</button><button class="btn" type="button" data-cancel>取消</button></div></form>`;panel.querySelector('[data-cancel]').addEventListener('click',()=>panel.replaceChildren());panel.querySelector('form').addEventListener('submit',event=>submitFeedback(event,kind))}
async function submitFeedback(event,kind){event.preventDefault();const submitter=event.submitter;submitter.disabled=true;const f=new FormData(event.currentTarget),days=f.getAll('new_available_days').map(Number);const payload={feedback_type:kind,target_date:home.today.date,note:f.get('note')||'',available_minutes:f.get('available_minutes')?Number(f.get('available_minutes')):null,new_available_days:days.length?days:null,pain:kind==='pain'?{location:f.get('pain_location'),severity:Number(f.get('pain_severity')),affects_daily_life:false}:{}};try{say('正在生成调整差异…');const feedback=await api('/api/training/feedback',{method:'POST',body:JSON.stringify(payload)});const proposal=await api('/api/training/proposals',{method:'POST',body:JSON.stringify({feedback_id:feedback.feedback.feedback_id})});document.getElementById('feedbackPanel').innerHTML=proposalMarkup(proposal.proposal);wireProposalActions();say('提案已生成，当前方案尚未改变。')}catch(e){say(e.message);submitter.disabled=false}}
function proposalMarkup(p){if(p.scope==='scheme')return schemeProposalMarkup(p);const c=p.changes[0],before=c.before,after=c.after;return `<section class="proposal" data-proposal="${esc(p.proposal_id)}"><div><span class="eyebrow">待你确认</span><h3>${esc(p.reason)}</h3><p class="muted">基于方案 v${esc(p.base_version)} · ${esc(p.impact.summary)}</p></div><div class="proposal-change"><div class="change-box"><span>原安排</span><strong>${esc(before.title)}</strong><p class="muted">${esc(before.duration_minutes||0)} 分钟 · ${esc(before.distance_km||0)} km</p></div><div class="change-arrow" aria-hidden="true">→</div><div class="change-box"><span>建议安排</span><strong>${esc(after.title)}</strong><p class="muted">${esc(after.duration_minutes||0)} 分钟 · ${esc(after.distance_km||0)} km</p></div></div>${p.risk_flags?.length?`<p class="why">安全提示：${p.risk_flags.map(esc).join('、')}</p>`:''}<div class="proposal-actions"><button class="btn primary" data-approve data-version="${esc(p.base_version)}">确认调整</button><button class="btn" data-reject>保持原计划</button></div></section>`}
function schemeProposalMarkup(p){const s=p.proposed_scheme||{},meta=decisionMeta(s),oldKm=p.changes?.find(c=>c.field==='weekly_mileage_target')?.before,newKm=s.weekly_mileage_target,oldPhase=p.changes?.find(c=>c.field==='current_phase')?.before,effectiveCopy=p.effective_from?`确认后从 ${esc(p.effective_from)} 生效，本周安排保持不变。`:'';return `<section class="proposal" data-proposal="${esc(p.proposal_id)}"><div><span class="eyebrow">完整方案重规划 · 待确认</span><h3>${esc(p.reason)}</h3><p class="muted">基于方案 v${esc(p.base_version)} · ${esc(meta.label)}</p></div>${effectiveCopy?`<p class="notice">${effectiveCopy}</p>`:''}${meta.status==='deterministic_fallback'?`<p class="notice">在线 AI 重规划未完成：${esc(p.fallback_reason||'未知原因')}。候选仍经过安全校验，但不会标记为 AI 推荐。</p>`:meta.status==='ai_risk_advisory'?'<p class="notice">AI 已完成重规划，但当前建议存在风险或信息缺口，请检查依据后再确认。</p>':''}${adjustmentsMarkup(s.adjustments)}<div class="proposal-change"><div class="change-box"><span>当前方案</span><strong>${esc(oldPhase||'当前阶段')}</strong><p class="muted">首周 ${esc(oldKm)} km</p></div><div class="change-arrow" aria-hidden="true">→</div><div class="change-box"><span>重规划候选</span><strong>${esc(s.current_phase?.name||'新阶段')}</strong><p class="muted">首周 ${esc(newKm)} km</p></div></div><p class="why">${esc(p.impact?.summary||'确认后生成新版本，历史版本继续保留')}</p>${(p.data_basis||[]).length?`<ul class="evidence-list">${p.data_basis.map(item=>`<li>${esc(item)}</li>`).join('')}</ul>`:''}<div class="proposal-actions"><button class="btn primary" data-approve data-version="${esc(p.base_version)}">确认重规划并生成新版本</button><button class="btn" data-reject>保持当前完整方案</button></div></section>`}
function wireProposalActions(){document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=approveProposal);document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=rejectProposal)}
async function approveProposal(event){const root=event.currentTarget.closest('[data-proposal]'),button=event.currentTarget;button.disabled=true;try{const result=await api(`/api/training/proposals/${encodeURIComponent(root.dataset.proposal)}/approve`,{method:'POST',body:JSON.stringify({base_version:Number(button.dataset.version),idempotency_key:crypto.randomUUID?crypto.randomUUID():Date.now().toString()})});say(result.scheduled?'调整已确认，将按生效日期切换；当前周安排保持不变。':'调整已确认，新版本现在生效。');await load(false)}catch(e){say(e.message);button.disabled=false}}
async function rejectProposal(event){const root=event.currentTarget.closest('[data-proposal]'),button=event.currentTarget;button.disabled=true;try{await api(`/api/training/proposals/${encodeURIComponent(root.dataset.proposal)}/reject`,{method:'POST',body:JSON.stringify({reason:'保持原计划'})});say('已保持原计划。');await load(false)}catch(e){say(e.message);button.disabled=false}}
async function loadReportProposal(){const query=new URLSearchParams(location.search),reportId=query.get('report_id'),weekId=query.get('week_id');if(!reportId||!weekId||!home?.has_active_plan)return;try{say('正在读取报告建议并生成待确认提案…');const data=await api('/api/training/proposals/from-report',{method:'POST',body:JSON.stringify({week_id:weekId})});const section=document.getElementById('pendingSection');if(section&&data.proposal){section.insertAdjacentHTML('beforeend',proposalMarkup(data.proposal));wireProposalActions()}query.delete('report_id');query.delete('week_id');history.replaceState({},'',location.pathname+(query.toString()?`?${query}`:''));say('报告建议已转成待确认训练提案，当前方案尚未改变。')}catch(e){say(e.message)}}
try{const restoredDraftTask=localStorage.getItem('neurun-training-draft-task');if(restoredDraftTask){draftTaskId=restoredDraftTask;statusNode.innerHTML=draftProgressMarkup(false);scheduleDraftPoll(restoredDraftTask,200)}}catch(e){}
load(!draftTaskId);
</script>
