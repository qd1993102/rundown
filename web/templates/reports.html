<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>neurun — 报告中心</title>
<style>
/* ═══════════════════════════════════════════
   neurun Reports List — 三主题系统
   ═══════════════════════════════════════════ */

[data-theme="fresh"] {
  --bg:#e8efe9; --bg-card:#fff; --text:#1a2e23; --text-secondary:#5a7d6e; --text-muted:#8aa89a;
  --accent:#2d9d6f; --accent-glow:rgba(45,157,111,.1); --recovery:#3b82b6; --recovery-glow:rgba(59,130,246,.08);
  --performance:#22a86e; --performance-glow:rgba(34,168,110,.08); --sleep:#7c6fcf; --sleep-glow:rgba(124,111,207,.08);
  --warning:#d4a017; --danger:#dc5b51; --hrv:#3b9fc6;
  --card-shadow:0 2px 8px rgba(0,0,0,.06); --card-shadow-hover:0 8px 30px rgba(0,0,0,.1);
  --border-subtle:#dde5df; --bg-subtle:#f0f4f0;
}
[data-theme="sport"] {
  --bg:#f0f0f0; --bg-card:#fff; --text:#171717; --text-secondary:#525252; --text-muted:#a3a3a3;
  --accent:#f15b2a; --accent-glow:rgba(241,91,42,.08); --recovery:#2563eb; --recovery-glow:rgba(37,99,235,.08);
  --performance:#16a34a; --performance-glow:rgba(22,163,74,.08); --sleep:#7c3aed; --sleep-glow:rgba(124,58,237,.08);
  --warning:#eab308; --danger:#ef4444; --hrv:#0891b2;
  --card-shadow:0 2px 10px rgba(0,0,0,.07); --card-shadow-hover:0 10px 35px rgba(0,0,0,.1);
  --border-subtle:#ebebeb; --bg-subtle:#f5f5f5;
}
[data-theme="dark"] {
  --bg:#0b1120; --bg-card:#1a2333; --text:#e2e8f0; --text-secondary:#94a3b8; --text-muted:#64748b;
  --accent:#34d399; --accent-glow:rgba(52,211,153,.12); --recovery:#60a5fa; --recovery-glow:rgba(96,165,250,.1);
  --performance:#4ade80; --performance-glow:rgba(74,222,128,.1); --sleep:#a78bfa; --sleep-glow:rgba(167,139,250,.1);
  --warning:#fbbf24; --danger:#f87171; --hrv:#22d3ee;
  --card-shadow:0 2px 10px rgba(0,0,0,.35); --card-shadow-hover:0 10px 30px rgba(0,0,0,.5);
  --border-subtle:#243044; --bg-subtle:#151e2c;
}

*{margin:0;padding:0;box-sizing:border-box}
html{min-width:320px;background:var(--bg)}
body{min-width:320px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input{font:inherit}button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.container{width:100%;max-width:720px;margin:0 auto;padding:12px 12px calc(112px + env(safe-area-inset-bottom))}

/* Shared app navigation */
.app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 12px}
.app-brand{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px;font-weight:800;letter-spacing:.2px}
.app-brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:11px;background:var(--accent);color:#fff;font-size:17px;font-weight:900}
.app-nav{position:fixed;z-index:50;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 24px),520px);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border:1px solid var(--border-subtle);border-radius:22px;background:color-mix(in srgb,var(--bg-card) 92%,transparent);box-shadow:0 12px 40px rgba(0,0,0,.22);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.app-nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;min-height:54px;padding:6px 5px;border-radius:16px;color:var(--text-muted);text-decoration:none;transition:color .2s,background .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app-nav-item[aria-current="page"]{background:var(--accent-glow);color:var(--accent)}
.app-nav-icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app-nav-label{font-size:10px;font-weight:750;line-height:1;letter-spacing:.2px}
.theme-bar{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--border-subtle);border-radius:14px;background:var(--bg-card);box-shadow:var(--card-shadow)}
.theme-btn{min-height:40px;border:1px solid transparent;padding:6px 10px;border-radius:10px;font-size:11px;font-weight:650;cursor:pointer;background:transparent;color:var(--text-muted);transition:color .2s,background .2s,border-color .2s;letter-spacing:.2px}
.theme-btn.active{background:var(--accent);color:#fff}

.btn{min-height:44px;padding:9px 16px;border-radius:12px;border:1px solid var(--border-subtle);background:transparent;color:var(--text-secondary);font-size:13px;font-weight:700;cursor:pointer;transition:color .2s,background .2s,border-color .2s,opacity .2s;letter-spacing:.3px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.spinner-sm{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
.gen-card{background:var(--bg-card);border-radius:18px;padding:16px;box-shadow:var(--card-shadow);margin-bottom:16px;display:grid;grid-template-columns:minmax(0,1fr);align-items:center;gap:10px}
.gen-card input[type=date]{width:100%;min-width:0;min-height:44px;padding:8px 11px;border-radius:12px;border:1px solid var(--border-subtle);background:var(--bg-subtle);color:var(--text);font-size:14px;outline:none;color-scheme:dark}
[data-theme="fresh"] .gen-card input[type=date],[data-theme="sport"] .gen-card input[type=date]{color-scheme:light}
.gen-card input[type=date]:focus{border-color:var(--accent)}
.gen-actions{display:flex;flex-wrap:wrap;gap:8px}.gen-actions .btn{flex:1 1 150px}
.gen-card .gen-hint{font-size:12px;color:var(--text-muted)}
.gen-msg{grid-column:1/-1;min-height:20px;font-size:13px}
.readiness-card{display:grid;gap:8px;padding:12px;border:1px solid var(--border-subtle);border-radius:14px;background:var(--bg-subtle);font-size:12px;color:var(--text-secondary)}
.readiness-card.ready{border-color:color-mix(in srgb,var(--performance) 45%,var(--border-subtle))}
.readiness-card.limited{border-color:color-mix(in srgb,var(--warning) 55%,var(--border-subtle))}
.readiness-card.blocked{border-color:color-mix(in srgb,var(--danger) 55%,var(--border-subtle))}
.readiness-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;color:var(--text)}
.readiness-list{display:grid;gap:5px;margin:0;padding-left:18px}.readiness-list li{overflow-wrap:anywhere}
.readiness-meta{color:var(--text-muted)}
.report-date-picker{display:grid;gap:10px;padding:14px;margin-bottom:14px;border:1px solid var(--border-subtle);border-radius:16px;background:var(--bg-card);box-shadow:var(--card-shadow)}.report-date-summary{display:grid;gap:2px;min-width:0}.report-date-summary span{font-size:10px;font-weight:800;letter-spacing:.6px;color:var(--accent);text-transform:uppercase}.report-date-summary strong{font-size:17px;line-height:1.35;color:var(--text)}.report-date-summary small{font-size:12px;color:var(--text-secondary)}.report-date-actions{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:stretch}.report-date-step{display:grid;place-items:center;min-height:46px;border:1px solid var(--border-subtle);border-radius:12px;background:var(--bg-subtle);color:var(--text-secondary);font-size:21px;cursor:pointer;transition:border-color .2s,color .2s,background .2s}.report-date-step:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}.report-date-step:disabled{opacity:.35;cursor:not-allowed}.report-date-input{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:9px;min-height:46px;padding:0 12px;border:1px solid var(--border-subtle);border-radius:12px;background:var(--bg-subtle);color:var(--text-secondary);cursor:pointer}.report-date-input span{font-size:11px;font-weight:750;color:var(--text-muted);white-space:nowrap}.report-date-input input[type=date]{min-width:0;width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:14px;font-weight:750;cursor:pointer;color-scheme:light dark}.report-date-shortcuts{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.report-date-shortcuts button{min-height:32px;padding:4px 11px;border:1px solid var(--border-subtle);border-radius:999px;background:transparent;color:var(--text-secondary);font-size:12px;font-weight:700;cursor:pointer;transition:border-color .2s,color .2s,background .2s}.report-date-shortcuts button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}.report-date-shortcuts small{margin-left:auto;color:var(--text-muted);font-size:11px;text-align:right}
.report-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:16px 0}.report-tab{min-height:44px;border:1px solid var(--border-subtle);border-radius:12px;background:var(--bg-card);color:var(--text-muted);font-size:13px;font-weight:750;cursor:pointer}.report-tab[aria-selected="true"]{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}[hidden]{display:none!important}.report-panel[hidden]{display:none}.report-status{display:grid;gap:10px;padding:16px;border-radius:16px;background:var(--bg-card);box-shadow:var(--card-shadow);margin-bottom:18px}.report-status h2{font-size:17px}.report-status p{font-size:13px;color:var(--text-secondary)}.report-status-actions{display:flex;flex-wrap:wrap;gap:8px}.report-status-actions .btn{flex:1 1 145px}.weekly-freshness{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:9px 11px;border:1px solid var(--border-subtle);border-radius:12px;background:var(--bg-subtle);color:var(--text-secondary);font-size:12px;line-height:1.5}.weekly-freshness .freshness-dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--performance)}.weekly-freshness.stale{border-color:var(--warning);background:color-mix(in srgb,var(--warning) 9%,transparent)}.weekly-freshness.stale .freshness-dot{background:var(--warning)}.weekly-freshness.incomplete{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,transparent)}.weekly-freshness.incomplete .freshness-dot{background:var(--danger)}.weekly-freshness .btn{flex:0 0 auto;margin-left:auto;min-height:34px;padding:5px 12px;font-size:12px}.report-subhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 10px}.report-subhead h2{font-size:16px}.report-subhead span{font-size:12px;color:var(--text-muted)}
.report-quality{display:inline-flex;align-items:center;min-height:20px;margin-top:5px;padding:2px 7px;border-radius:999px;background:var(--bg-subtle);color:var(--text-muted);font-size:10px;font-weight:750}
.report-quality.limited{color:var(--warning)}
.report-section{margin-top:20px}.report-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 0 10px}.report-section-head h2{font-size:17px}.report-section-head p{margin-top:3px;color:var(--text-muted);font-size:12px}.weekly-grid,.record-list{display:grid;gap:10px}.weekly-card,.record-card{display:grid;gap:8px;padding:16px;border-radius:16px;background:var(--bg-card);box-shadow:var(--card-shadow)}.weekly-meta{display:flex;flex-wrap:wrap;gap:7px;color:var(--text-muted);font-size:11px}.weekly-review-details{border-top:1px solid var(--border-subtle);padding-top:10px}.weekly-review-details summary{cursor:pointer;color:var(--accent);font-size:12px;font-weight:800;list-style-position:inside}.weekly-review-body{display:grid;gap:12px;margin-top:12px}.weekly-review-details:not([open])>.weekly-review-body{display:none}.weekly-review-section{display:grid;gap:5px;padding:11px 12px;border-radius:12px;background:var(--bg-subtle)}.weekly-review-section h3{font-size:13px}.weekly-review-section p,.weekly-review-section li{color:var(--text-secondary);font-size:12px;line-height:1.55}.weekly-review-section ul,.weekly-review-section ol{display:grid;gap:3px;margin:2px 0 0;padding-left:20px}.weekly-risk{font-size:10px;font-weight:800;color:var(--text-muted)}.weekly-risk.high{color:var(--danger)}.weekly-risk.medium{color:#b26a00}.weekly-actions{display:flex;flex-wrap:wrap;gap:8px}.weekly-actions .btn{flex:1 1 140px}.record-card{grid-template-columns:minmax(0,1fr) auto;align-items:center}.record-card p{color:var(--text-secondary);font-size:12px}.record-status{font-size:11px;font-weight:800;color:var(--accent)}.report-pagination{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:8px;border:1px solid var(--border-subtle);border-radius:14px;background:var(--bg-card);box-shadow:var(--card-shadow)}.report-pagination span{min-width:0;color:var(--text-secondary);font-size:12px;text-align:center}.report-pagination .btn{min-width:76px;min-height:40px;padding:7px 10px}

/* Loading */
.loading{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:14px}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin-bottom:12px;display:block;margin-left:auto;margin-right:auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* Report Cards */
.report-list{display:flex;flex-direction:column;gap:10px}
.report-card{min-height:44px;background:var(--bg-card);border-radius:16px;padding:16px;box-shadow:var(--card-shadow);cursor:pointer;transition:transform .15s,box-shadow .15s;text-decoration:none;display:block;color:inherit;-webkit-tap-highlight-color:transparent}
.report-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px}
.report-date{text-align:center;min-width:0}
.report-date .d{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;font-size:22px;font-weight:700;color:var(--text);line-height:1}
.report-date .w{font-size:10px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.report-body{flex:1;min-width:0}
.report-training{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:600;color:var(--text)}
.report-insight{font-size:12px;color:var(--text-secondary);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.report-scores{grid-column:auto;display:flex;flex-wrap:nowrap;justify-content:flex-end;gap:8px;min-width:max-content}
.report-score{text-align:center;min-width:36px;white-space:nowrap}
.report-score .sv{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;font-size:18px;font-weight:700}
.report-score .sv.sleep-c{color:var(--sleep)}.report-score .sv.recovery-c{color:var(--recovery)}
.report-score .sl{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}

/* Empty / Footer */
.empty-state{text-align:center;padding:60px 20px}
.empty-state .icon{font-size:48px;margin-bottom:16px}
.empty-state h2{font-size:18px;color:var(--text);margin-bottom:8px}
.empty-state p{font-size:13px;color:var(--text-muted);line-height:1.6}
.footer{text-align:center;padding:40px 0 20px;font-size:11px;color:var(--text-muted);letter-spacing:1px;font-weight:500}
.footer span{background:linear-gradient(135deg,var(--accent),#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700}

@media(min-width:641px){
  .container{padding:24px 20px 80px}
  .app-header{padding-bottom:20px}
  .app-brand{display:none}
  .app-nav{position:static;transform:none;width:auto;display:flex;padding:4px;border-radius:24px;box-shadow:var(--card-shadow);-webkit-backdrop-filter:none;backdrop-filter:none}
  .app-nav-item{flex-direction:row;gap:7px;min-width:84px;min-height:40px;padding:8px 16px;border-radius:20px}
  .app-nav-icon{width:17px;height:17px}
  .app-nav-label{font-size:12px}
  .theme-btn{min-height:36px;border-radius:20px;padding:5px 12px}
  .gen-card{padding:20px 24px;grid-template-columns:150px minmax(0,1fr);gap:14px;margin-bottom:20px}
  .gen-card .gen-hint,.readiness-card{grid-column:1/-1}
  .gen-msg{grid-column:1/-1}
  .report-card{padding:20px 24px}
  .report-row{grid-template-columns:56px minmax(0,1fr) auto;gap:16px}
  .report-date{min-width:56px}
  .report-scores{gap:16px}
  .report-score{min-width:44px}
}
@media(max-width:420px){.report-date-shortcuts small{flex-basis:100%;margin-left:0;text-align:left}}

@media(hover:hover){
  .app-nav-item:hover{color:var(--accent);background:var(--accent-glow)}
  .theme-btn:hover{opacity:.82}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary:hover{color:#fff;opacity:.86}
  .report-card:hover{transform:translateY(-2px);box-shadow:var(--card-shadow-hover)}
}

@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body data-theme="dark">

<div class="container">

<header class="app-header">
  <div class="app-brand" aria-hidden="true"><span class="app-brand-mark">n</span><span>neurun</span></div>
  <nav class="app-nav" aria-label="主要导航">
    <a href="/training" class="app-nav-item" data-nav-item>
      <svg class="app-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h3l2-5 4 10 2-5h5"/><path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg>
      <span class="app-nav-label">训练</span>
    </a>
    <a href="/reports" class="app-nav-item" data-nav-item aria-current="page">
      <svg class="app-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      <span class="app-nav-label">报告</span>
    </a>
    <a href="/sync" class="app-nav-item" data-nav-item>
      <svg class="app-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7h-3.5A7 7 0 0 0 5 9M20 3v4h-4M4 17h3.5A7 7 0 0 0 19 15M4 21v-4h4"/></svg>
      <span class="app-nav-label">同步</span>
    </a>
    <a href="/profile" class="app-nav-item" data-nav-item>
      <svg class="app-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c.5-4 3-6 7-6s6.5 2 7 6"/></svg>
      <span class="app-nav-label">我的</span>
    </a>
  </nav>
  <div class="theme-bar" role="group" aria-label="主题">
    <button class="theme-btn active" data-theme="dark" onclick="setTheme('dark')">暗黑</button>
    <button class="theme-btn" data-theme="sport" onclick="setTheme('sport')">运动</button>
    <button class="theme-btn" data-theme="fresh" onclick="setTheme('fresh')">清新</button>
  </div>
</header>

<section class="report-section">
  <div class="report-section-head"><div><h1>报告</h1><p>日报看一天，周复盘看一周；计划调整只在训练中确认。</p></div></div>
  <div class="report-tabs" role="tablist" aria-label="报告类别">
    <button class="report-tab" role="tab" aria-selected="true" data-report-tab="daily">日报</button>
    <button class="report-tab" role="tab" aria-selected="false" data-report-tab="weekly">周复盘</button>
  </div>
  <section id="aiTaskStatus" class="report-status" aria-live="polite" hidden></section>

  <section class="report-panel" id="dailyPanel" role="tabpanel">
    <section class="report-date-picker" aria-label="选择日报日期">
      <div class="report-date-summary" aria-live="polite"><span>日报日期</span><strong id="genDateLabel">—</strong><small id="genDateHint">选择日期后检查数据完整性</small></div>
      <div class="report-date-actions">
        <button class="report-date-step" id="genDatePrev" type="button" aria-label="前一天" onclick="shiftDailyDate(-1)">‹</button>
        <label class="report-date-input" for="genDate"><span>修改日期</span><input type="date" id="genDate" aria-label="选择日报日期" onchange="handleDailyDateChange()"></label>
        <button class="report-date-step" id="genDateNext" type="button" aria-label="后一天" onclick="shiftDailyDate(1)">›</button>
      </div>
      <div class="report-date-shortcuts"><button type="button" onclick="setDailyDateOffset(-1)">昨天</button><button type="button" onclick="setDailyDateOffset(0)">今天</button><small>日报只解释选定日期当天的事实</small></div>
    </section>
    <section id="dailyStatus" class="report-status" aria-live="polite"><p>正在检查该日报告状态</p></section>
    <span id="genMsg" class="gen-msg" aria-live="polite"></span>
    <div class="report-subhead"><h2>最近日报</h2><span>训练摘要与报告状态</span></div>
    <div class="loading" id="loading"><span class="spinner"></span>加载中...</div>
    <div class="report-list" id="reportList"></div>
    <nav class="report-pagination" id="dailyPagination" aria-label="日报列表分页" hidden></nav>

  <section class="report-panel" id="weeklyPanel" role="tabpanel" hidden>

  </section>

</section>

<div class="footer">Built with <span>neurun</span></div>

</div>

<script>
// ── Theme (shared with dashboard via localStorage) ──
var savedTheme = localStorage.getItem('neurun-theme')||'dark';
document.body.setAttribute('data-theme', savedTheme);
document.querySelectorAll('.theme-btn').forEach(function(b){
  b.classList.toggle('active', b.dataset.theme===savedTheme);
});

function setTheme(t){
  document.body.setAttribute('data-theme', t);
  localStorage.setItem('neurun-theme', t);
  document.querySelectorAll('.theme-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.theme===t);
  });
}

var weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
var currentReadiness=null, reportItems=[], selectedReport=null;
var dailyPagination={page:1,per_page:7,total:0,total_pages:1},weeklyPagination={page:1,per_page:7,total:0,total_pages:1};
var aiStatusTimer=null,restoredWeeklyTaskId=null;
var aiOperationLabels={daily_report:'训练日报',weekly_review:'周复盘',training_draft:'训练方案草稿',training_draft_update:'训练方案重算',training_adjustment:'训练调整',scheme_revision:'方案重规划',race_strategy:'比赛策略'};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function localDateString(value){return value.getFullYear()+'-'+String(value.getMonth()+1).padStart(2,'0')+'-'+String(value.getDate()).padStart(2,'0')}
function dateFromValue(value){return new Date(value+'T00:00:00')}
function formatReportDate(value){var date=dateFromValue(value);return isNaN(date.getTime())?'请选择日期':(date.getMonth()+1)+' 月 '+date.getDate()+' 日 · '+weekdays[date.getDay()]}
function naturalWeekLabel(value){var date=dateFromValue(value);if(isNaN(date.getTime()))return '请选择日期';var monday=new Date(date),offset=(date.getDay()+6)%7;monday.setDate(date.getDate()-offset);var sunday=new Date(monday);sunday.setDate(monday.getDate()+6);return (monday.getMonth()+1)+' 月 '+monday.getDate()+' 日 — '+(sunday.getMonth()+1)+' 月 '+sunday.getDate()+' 日'}
function setPickerDate(inputId,value,onChange){var input=document.getElementById(inputId);if(value>todayStr)return;input.value=value;onChange()}
function updateDailyDatePicker(){var value=document.getElementById('genDate').value,existing=selectedDaily(),hint=document.getElementById('genDateHint');document.getElementById('genDateLabel').textContent=formatReportDate(value);document.getElementById('genDateNext').disabled=!value||value>=todayStr;hint.textContent=existing?'已有日报 · '+(existing.data_readiness==='complete'?'数据完整':existing.data_readiness==='limited'?'受限版':'完整性未知'):'选择日期后检查数据完整性'}
function updateWeekDatePicker(){var value=document.getElementById('weekDate').value;document.getElementById('weekDateLabel').textContent=naturalWeekLabel(value);document.getElementById('weekDateHint').textContent=value?'自然周 · '+formatReportDate(value):'选择该自然周中的任意一天';document.getElementById('weekDateNext').disabled=!value||value>=todayStr}
function handleDailyDateChange(){var input=document.getElementById('genDate');if(!input.value||input.value>todayStr)input.value=todayStr;selectedReport=null;updateDailyDatePicker();loadDailyPage(dailyPagination.page).catch(function(e){document.getElementById('dailyStatus').innerHTML='<p style="color:var(--danger)">加载失败: '+esc(e.message)+'</p>'})}
function shiftDailyDate(offset){var input=document.getElementById('genDate'),date=dateFromValue(input.value||todayStr);date.setDate(date.getDate()+offset);setPickerDate('genDate',localDateString(date),handleDailyDateChange)}
function setDailyDateOffset(offset){var date=new Date();date.setDate(date.getDate()+offset);setPickerDate('genDate',localDateString(date),handleDailyDateChange)}
function handleWeekDateChange(){var input=document.getElementById('weekDate');if(!input.value||input.value>todayStr)input.value=todayStr;updateWeekDatePicker();updateWeekAction()}
function shiftWeekDate(offset){var input=document.getElementById('weekDate'),date=dateFromValue(input.value||todayStr);date.setDate(date.getDate()+offset);setPickerDate('weekDate',localDateString(date),handleWeekDateChange)}
function setWeekDateOffset(offset){var date=new Date();date.setDate(date.getDate()+offset);setPickerDate('weekDate',localDateString(date),handleWeekDateChange)}

function reportTab(){var tab=new URLSearchParams(location.search).get('tab');return ['daily','weekly'].includes(tab)?tab:'daily'}
function selectTab(tab,updateUrl){
  document.querySelectorAll('[data-report-tab]').forEach(function(button){button.setAttribute('aria-selected',String(button.dataset.reportTab===tab))});
  ['daily','weekly'].forEach(function(name){document.getElementById(name+'Panel').hidden=name!==tab});
  if(updateUrl){var query=new URLSearchParams(location.search);query.set('tab',tab);history.replaceState({},'',location.pathname+'?'+query.toString())}
}
document.querySelectorAll('[data-report-tab]').forEach(function(button){button.addEventListener('click',function(){selectTab(button.dataset.reportTab,true)})});

function pageFromQuery(key){var value=Number(new URLSearchParams(location.search).get(key)||1);return Number.isInteger(value)&&value>0?value:1}
function updatePageQuery(key,page){var query=new URLSearchParams(location.search);if(page<=1)query.delete(key);else query.set(key,String(page));history.replaceState({},'',location.pathname+'?'+query.toString())}
function renderPagination(kind,pagination){var el=document.getElementById(kind+'Pagination'),previous=pagination.page-1,next=pagination.page+1;if(!pagination.total||pagination.total_pages<=1){el.hidden=true;el.innerHTML='';return}el.hidden=false;el.innerHTML='<button class="btn" type="button" data-report-page="'+kind+'" data-page="'+previous+'" '+(previous<1?'disabled':'')+'>上一页</button><span>第 '+pagination.page+' / '+pagination.total_pages+' 页 · 共 '+pagination.total+' 份</span><button class="btn" type="button" data-report-page="'+kind+'" data-page="'+next+'" '+(next>pagination.total_pages?'disabled':'')+'>下一页</button>';el.querySelectorAll('[data-report-page]').forEach(function(button){button.addEventListener('click',function(){loadReportPage(button.dataset.reportPage,Number(button.dataset.page))})})}
async function loadDailyPage(page){var dateValue=document.getElementById('genDate').value,query=new URLSearchParams({page:String(page||1),per_page:'7'});if(dateValue)query.set('date',dateValue);var response=await fetch('/api/reports?'+query.toString());if(response.status===401){location.href='/';return}if(!response.ok)throw new Error('日报加载失败');var payload=await response.json();reportItems=payload.reports||[];selectedReport=payload.selected||null;dailyPagination=payload.pagination||dailyPagination;render(reportItems,dailyPagination);renderDailyStatus()}
async function loadWeeklyPage(page){var query=new URLSearchParams({page:String(page||1),per_page:'7'}),response=await fetch('/api/reports/weekly?'+query.toString());if(response.status===401){location.href='/';return}if(!response.ok)throw new Error('周复盘加载失败');var payload=await response.json();weeklyPagination=payload.pagination||weeklyPagination;renderWeekly(payload.reports||[],weeklyPagination)}
async function loadReportPage(kind,page){var pagination=kind==='daily'?dailyPagination:weeklyPagination;if(page<1||page>pagination.total_pages)return;updatePageQuery(kind+'Page',page);try{if(kind==='daily')await loadDailyPage(page);else await loadWeeklyPage(page)}catch(e){document.getElementById(kind==='daily'?'loading':'weeklyList').innerHTML='<p style="color:var(--danger)">加载失败: '+esc(e.message)+'</p>'}}
async function load(){try{await Promise.all([loadDailyPage(pageFromQuery('dailyPage')),loadWeeklyPage(pageFromQuery('weeklyPage'))])}catch(e){document.getElementById('loading').innerHTML='<p style="color:var(--danger)">加载失败: '+esc(e.message)+'</p>'}}

function decisionLabel(action){return {accelerate:'建议加快（待确认）',advance:'按方案推进',hold:'保持当前阶段',deload:'建议减量（待确认）',insufficient_data:'数据不足',not_final:'周中检查（未定案）'}[action]||action||'尚未形成决定'}
function weeklyFreshnessLevel(report){
  var dataAsOf=report.data_as_of||'',ls=lastSync||'',incomplete=((report.data_quality||{}).sync_coverage||{}).incomplete_dates?.length||0;
  if(incomplete>0)return {level:'incomplete',incomplete:incomplete,dataAsOf:dataAsOf,lastSync:ls};
  if(ls&&dataAsOf&&ls>dataAsOf)return {level:'stale',incomplete:0,dataAsOf:dataAsOf,lastSync:ls};
  return {level:'fresh',incomplete:0,dataAsOf:dataAsOf,lastSync:ls};
}
function weeklyFreshnessMarkup(report,refreshButton){
  var f=weeklyFreshnessLevel(report),copy;
  if(f.level==='stale')copy='检测到 '+esc(f.lastSync)+' 之后的训练数据 · 当前进度截至 '+esc(f.dataAsOf);
  else if(f.level==='incomplete')copy='当前进度仍有 '+f.incomplete+' 天未同步，进度截至 '+esc(f.dataAsOf||'未知');
  else copy='进度已是最新（截至 '+esc(f.dataAsOf||'未知')+'）';
  return '<div class="weekly-freshness '+f.level+'"><span class="freshness-dot"></span><span>'+copy+'</span>'+refreshButton+'</div>';
}
function weeklyReviewList(items,ordered){if(!items?.length)return '';var tag=ordered?'ol':'ul';return '<'+tag+'>'+items.map(function(item){return '<li>'+esc(typeof item==='object'?(item.message||item.label||''):item)+'</li>'}).join('')+'</'+tag+'>'}
function paceText(seconds){seconds=Number(seconds);if(!seconds)return '';return Math.floor(seconds/60)+"'"+String(Math.round(seconds%60)).padStart(2,'0')+'"/km'}
function qualitySessionList(section){
  if(!section?.items?.length)return '';
  return '<ul>'+section.items.map(function(item){
    var metrics=item.metrics||{},parts=[item.date,item.label||item.quality_type];
    if(item.distance_km)parts.push(item.distance_km+' km');
    if(item.duration_minutes)parts.push(item.duration_minutes+' 分钟');
    var pace=metrics.average_pace?.value,hr=metrics.heart_rate?.value;
    if(pace)parts.push('平均配速 '+paceText(pace));
    if(hr)parts.push('平均心率 '+hr+' bpm');
    return '<li>'+esc(parts.filter(Boolean).join(' · '))+'</li>';
  }).join('')+'</ul>';
}
function weeklyReviewDetails(report,open){
  var sections=report.review_sections||{},overview=sections.overview,quality=sections.quality_sessions,trend=sections.trend,risk=sections.recovery_and_risk,next=sections.next_week;
  if(!overview||!trend||!risk||!next)return '';
  var riskLabel={high:'高风险',medium:'需关注',low:'未见明确风险',unknown:'恢复数据不足'}[risk.level]||'恢复状态未知';
  var riskItems=[].concat(risk.flags||[],risk.uncertainties||[]);
  return '<details class="weekly-review-details" '+(open?'open':'')+'><summary>查看完整复盘</summary><div class="weekly-review-body">'
    +'<section class="weekly-review-section"><h3>本周概览</h3><p>'+esc(overview.headline||'')+'</p>'+weeklyReviewList(overview.highlights||[],false)+'</section>'
    +(quality?'<section class="weekly-review-section"><h3>质量课总结</h3><p>'+esc(quality.headline||'')+'</p>'+qualitySessionList(quality)+'</section>':'')
    +'<section class="weekly-review-section"><h3>近期变化</h3><p>'+esc(trend.headline||'')+'</p>'+weeklyReviewList(trend.evidence||[],false)+'</section>'
    +'<section class="weekly-review-section"><h3>恢复与风险 <span class="weekly-risk '+esc(risk.level||'unknown')+'">'+esc(riskLabel)+'</span></h3><p>'+esc(risk.headline||'')+'</p>'+weeklyReviewList(riskItems,false)+'</section>'
    +'<section class="weekly-review-section"><h3>下周行动</h3><p>'+esc(next.headline||'')+'</p>'+weeklyReviewList(next.actions||[],true)+'</section>'
    +'</div></details>';
}
function renderWeekly(reports,pagination){
  var el=document.getElementById('weeklyList');
  archivedWeeks={};(reports||[]).forEach(function(r){if(r.report_id)archivedWeeks[r.week_start]=true});
  if(!reports.length){el.innerHTML='<article class="weekly-card"><strong>还没有已完成周复盘</strong><p>周中可查看本周进度；自然周结束后才会在此归档正式结论。</p></article>';renderPagination('weekly',pagination);return}
  el.innerHTML=reports.map(function(r){
    var actual=r.actual_summary||{},execution=r.plan_execution_summary||r.execution_summary,decision=r.progression_decision,quality=r.data_quality||{},sync=quality.sync_coverage||(execution||{}).sync_coverage||{},finding=typeof r.finding==='object'?(r.finding.conclusion||''):r.finding;
    var action=r.training_url?'<a class="btn" href="'+esc(r.training_url)+'">查看训练安排</a>':'<a class="btn" href="/training">制定训练方案（可选）</a>';
    if(r.report_id&&r.training_handoff?.status==='proposal_available')action='<a class="btn primary" href="/training?report_id='+encodeURIComponent(r.report_id)+'&week_id='+encodeURIComponent(r.week_id||'')+'">在训练中生成调整提案</a>';
    if(decision&&decision.action==='insufficient_data'&&r.sync_url)action='<a class="btn primary" href="'+esc(r.sync_url)+'">补齐同步数据</a>';
    var headline=((r.review_sections||{}).overview||{}).headline||finding||(decision||{}).rationale||'本周实际运动与恢复已归档。';
    var actualLabel='实际 '+esc(actual.activity_count||0)+' 次';
    if(actual.active_days!=null)actualLabel+=' · '+esc(actual.active_days)+' 个运动日';
    actualLabel+=' · 跑步 '+esc(actual.running_distance_km||0)+' km';
    if(actual.running_days!=null)actualLabel+=' / '+esc(actual.running_days)+' 天';
    var meta='<span>'+actualLabel+'</span>';
    if(actual.total_duration_minutes)meta+='<span>累计 '+esc(actual.total_duration_minutes)+' 分钟</span>';
    if(actual.longest_running_activity?.distance_km)meta+='<span>最长 '+esc(actual.longest_running_activity.distance_km)+' km</span>';
    meta+=execution?'<span>计划执行 '+esc(execution.completed_km||0)+' / '+esc(execution.target_km||0)+' km</span>':'<span>未关联训练方案</span>';
    if(decision)meta+='<span>'+esc(decisionLabel(decision.action))+'</span>';
    meta+='<span>数据截至 '+esc(r.data_as_of||actual.latest_activity_date||'未知')+'</span>';
    if(sync.incomplete_dates?.length)meta+='<span>仍缺 '+esc(sync.incomplete_dates.length)+' 天同步</span>';
    return '<article class="weekly-card"><div><strong>'+esc(r.week_start)+' — '+esc(r.week_end)+'</strong><p>'+esc(headline)+'</p></div><div class="weekly-meta">'+meta+'</div>'+weeklyReviewDetails(r,false)+'<div class="weekly-actions">'+action+'</div></article>';
  }).join('');
  renderPagination('weekly',pagination);
}

function render(reports,pagination){
  document.getElementById('loading').style.display='none';

  if(!reports.length){
    document.getElementById('emptyState').style.display='block';
    document.getElementById('reportList').innerHTML='';
    renderPagination('daily',pagination);
    return;
  }
  document.getElementById('emptyState').style.display='none';

  var html = '';
  reports.forEach(function(r){
    var parts = r.date.split('-');
    var day = parts.length===3 ? parseInt(parts[2]) : '?';
    var wd = '';
    try {
      var d = new Date(r.date+'T00:00:00');
      if(!isNaN(d.getTime())) wd = weekdays[d.getDay()];
    }catch(e){}

    html += '<a class="report-card" href="/?date='+encodeURIComponent(r.date)+'">';
    html += '<div class="report-row">';
    html += '<div class="report-date"><div class="d">'+day+'</div><div class="w">'+wd+'</div></div>';
    html += '<div class="report-body">';
    html += '<div class="report-training">'+esc(r.training)+'</div>';
    var quality=r.data_readiness||'unknown';
    html += '<span class="report-quality '+(quality==='limited'?'limited':'')+'">'+(quality==='complete'?'数据完整':quality==='limited'?'受限版':'完整性未知')+(r.report_finality==='provisional'?' · 暂态':'')+'</span>';
    html += '</div>';
    html += '</div></a>';
  });
  document.getElementById('reportList').innerHTML = html;
  renderPagination('daily',pagination);
  updateDailyDatePicker();
}

var dimensionNames={activity:'报告日活动',sleep:'报告日睡眠',recovery:'恢复指标',trends_7d:'近 7 天趋势',load_7d:'近 7 天负荷',load_28d:'近 28 天负荷'};
var actionNames={sync_day:'同步这一天',retry_day_sync:'重试单日同步',wait_for_sync:'等待当前同步完成',authorize_or_sync_sleep:'授权并同步睡眠',sync_health:'同步健康数据',sync_7d:'同步近 7 天',sync_28d:'同步近 28 天',choose_past_date:'选择今天或更早日期'};

function selectedDaily(){var d=document.getElementById('genDate').value;if(selectedReport&&selectedReport.date===d)return selectedReport;return reportItems.find(function(report){return report.date===d})}
function renderDailyStatus(force){
  var existing=selectedDaily(),card=document.getElementById('dailyStatus');
  document.getElementById('genMsg').textContent='';
  if(existing&&!force){
    var quality=existing.data_readiness==='complete'?'数据完整':existing.data_readiness==='limited'?'受限版':'完整性未知';
    card.innerHTML='<h2>'+esc(existing.date)+' 日报已生成</h2><p>'+esc(existing.training||'当日训练已归档')+' · '+quality+'</p><div class="report-status-actions"><a class="btn primary" href="/?date='+encodeURIComponent(existing.date)+'">查看日报</a><button class="btn" type="button" onclick="renderDailyStatus(true)">重新生成</button></div>';
    return;
  }
  checkReadiness();
}
async function checkReadiness(){
  var d=document.getElementById('genDate').value,card=document.getElementById('dailyStatus');
  currentReadiness=null;card.className='report-status';
  card.innerHTML='<p>正在检查 '+esc(d)+' 的数据完整性</p>';
  if(!d)return;
  try{
    var r=await fetch('/api/reports/readiness?date='+encodeURIComponent(d));
    var j=await r.json();
    if(!r.ok||j.status!=='ok')throw new Error(j.message||'检查失败');
    currentReadiness=j.readiness;
    var status=currentReadiness.status,dims=currentReadiness.dimensions||{},issues=[];
    Object.keys(dims).forEach(function(key){var dim=dims[key];if(dim.status!=='complete'&&dim.status!=='unsupported')issues.push((dimensionNames[key]||key)+'：'+(dim.reason||dim.status))});
    var title=status==='ready'?'✅ 数据可生成完整日报':status==='limited'?'⚠️ 数据只能生成受限版':'⛔ 数据尚不能生成日报';
    var meta=currentReadiness.data_as_of?'数据截止 '+esc(String(currentReadiness.data_as_of).slice(0,19)):'';
    var html='<h2>'+title+'</h2><p>'+meta+'</p>';
    if(issues.length)html+='<ul class="readiness-list">'+issues.map(function(item){return '<li>'+esc(item)+'</li>'}).join('')+'</ul>';
    var actions='<div class="report-status-actions">';
    if(status==='ready')actions+='<button class="btn primary" id="genBtn" onclick="genReport(\'complete\')">生成日报</button>';
    if(status==='limited')actions+='<a class="btn primary" href="/sync?date='+encodeURIComponent(d)+'&from=reports&return_to='+encodeURIComponent('/reports?tab=daily&date='+d)+'#single-sync">先补齐数据</a><button class="btn" id="limitedBtn" onclick="genReport(\'limited\')">生成受限版</button>';
    if(status==='blocked')actions+='<a class="btn primary" href="/sync?date='+encodeURIComponent(d)+'&from=reports&return_to='+encodeURIComponent('/reports?tab=daily&date='+d)+'#single-sync">前往同步</a>';
    actions+='</div>';
    card.className='report-status '+status;card.innerHTML=html+actions;
  }catch(e){card.className='report-status blocked';card.innerHTML='<h2>⛔ 数据检查失败</h2><p>'+esc(e.message||'请稍后重试')+'</p>'}
}

async function genReport(mode){
  var d=document.getElementById('genDate').value,msg=document.getElementById('genMsg'),active=document.getElementById(mode==='limited'?'limitedBtn':'genBtn');
  if(active){active.disabled=true;active.innerHTML='<span class="spinner-sm"></span>生成中'}
  msg.textContent='';
  try{
    var r=await fetch('/api/reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:d,mode:mode})});
    var j=await r.json();
    if(j.code==='ai_request_in_progress'){await refreshAIStatus();return}
    if(j.status==='ok'){
      msg.innerHTML='<span style="color:var(--performance)">✅ 已生成'+(j.data_readiness==='limited'?'受限版':'完整日报')+' <a href="/?date='+encodeURIComponent(j.date)+'" style="color:var(--recovery)">查看 →</a></span>';
      load();
    }else{msg.innerHTML='<span style="color:var(--danger)">❌ '+esc(j.message||'失败')+'</span>';if(j.readiness){currentReadiness=j.readiness;checkReadiness()}}
  }catch(e){msg.innerHTML='<span style="color:var(--danger)">网络错误</span>'}
  renderDailyStatus();
}

async function genWeeklyReport(){
  var button=document.getElementById('weekBtn'),d=document.getElementById('weekDate').value,msg=document.getElementById('weekMsg');
  // 已归档自然周重新生成会覆盖归档版本，先明确提示（周中 checkpoint 非持久化，无此问题）
  var chosen=new Date(d+'T00:00:00'),weekStart=new Date(chosen);weekStart.setDate(chosen.getDate()-(chosen.getDay()+6)%7);
  if(archivedWeeks[localDateString(weekStart)]&&!confirm('该周已有正式周复盘，重新生成将覆盖当前归档版本。确定继续？'))return;
  button.disabled=true;button.innerHTML='<span class="spinner-sm"></span>生成中';msg.textContent='';
  try{
    var r=await fetch('/api/reports/weekly',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:d})}),j=await r.json();
    if(j.code==='ai_request_in_progress'){await refreshAIStatus();return}
    if(!r.ok||j.status!=='ok')throw new Error(j.message||'生成失败');
    if(j.last_sync)lastSync=j.last_sync;
    var decision=j.report.progression_decision,isCheckpoint=j.report.type==='weekly_checkpoint';
    msg.innerHTML='<span style="color:var(--performance)">✅ '+(isCheckpoint?'本周进度已更新':'周复盘已生成')+(decision?' · '+esc(decisionLabel(decision.action)):' · 基础周复盘')+'</span>';
    renderWeeklyOutcome(j.report);
    load();
  }catch(e){msg.innerHTML='<span style="color:var(--danger)">❌ '+esc(e.message||'生成失败')+'</span>'}
  button.disabled=false;updateWeekAction();
}
function formatAIElapsed(seconds){seconds=Math.max(0,Number(seconds)||0);if(seconds<60)return seconds+' 秒';return Math.floor(seconds/60)+' 分 '+String(seconds%60).padStart(2,'0')+' 秒'}
function scheduleAIStatusRefresh(){if(aiStatusTimer)clearTimeout(aiStatusTimer);aiStatusTimer=setTimeout(refreshAIStatus,2000)}
async function refreshAIStatus(){
  var button=document.getElementById('weekBtn'),msg=document.getElementById('weekMsg'),banner=document.getElementById('aiTaskStatus');
  try{
    var response=await fetch('/api/ai/tasks/current'),payload=await response.json();
    if(response.status===401){location.href='/';return}
    if(!response.ok||payload.status!=='ok')throw new Error(payload.message||'任务状态读取失败');
    var task=payload.task,active=task&&['waiting','running'].includes(task.state);
    if(!task){banner.hidden=true;if(button){button.disabled=false;updateWeekAction()}return}
    if(active){
      var label=aiOperationLabels[task.operation]||'AI 内容';banner.hidden=false;banner.innerHTML='<h2><span class="spinner-sm"></span> '+esc(task.state==='waiting'?label+'等待执行':label+'正在生成')+'</h2><p>'+esc(task.message||label+'正在处理')+' · 已用时 '+esc(formatAIElapsed(task.elapsed_seconds))+'</p>';
      if(button){button.disabled=true;button.innerHTML='<span class="spinner-sm"></span>'+(task.state==='waiting'?'等待中':'生成中')}
      scheduleAIStatusRefresh();return;
    }
    banner.hidden=true;
    if(task.state==='failed'){
      banner.hidden=false;banner.innerHTML='<h2>生成失败</h2><p>'+esc(task.message||task.error_message||'AI 生成失败，请重试')+'</p>';
      if(task.operation==='weekly_review'&&msg)msg.innerHTML='<span style="color:var(--danger)">❌ '+esc(task.message||task.error_message||'周复盘生成失败，请重试')+'</span>';
      if(button){button.disabled=false;updateWeekAction()}return;
    }
    if(task.operation==='daily_report'&&task.state==='succeeded'){await loadDailyPage(dailyPagination.page);if(button){button.disabled=false;updateWeekAction()}return}
    if(task.operation!=='weekly_review'){if(button){button.disabled=false;updateWeekAction()}return}
    if(task.state==='succeeded'){
      var report=((task.result||{}).report);
      if(report&&restoredWeeklyTaskId!==task.task_id){restoredWeeklyTaskId=task.task_id;renderWeeklyOutcome(report);await loadWeeklyPage(weeklyPagination.page)}
      else if(msg){msg.innerHTML='<span style="color:var(--performance)">✅ 周复盘已生成</span>'}
      return;
    }
    if(button){button.disabled=false;updateWeekAction()}
  }catch(e){banner.hidden=false;banner.innerHTML='<h2>任务状态读取失败</h2><p>请稍后刷新页面重试。</p>';if(button){button.disabled=false;updateWeekAction()}}
}
function updateWeekAction(){
  var selected=document.getElementById('weekDate').value,button=document.getElementById('weekBtn');
  if(!selected||!button)return;
  var chosen=new Date(selected+'T00:00:00'),end=new Date(chosen),offset=(chosen.getDay()+6)%7;
  end.setDate(chosen.getDate()-offset+6);
  button.textContent=end>=new Date(todayStr+'T00:00:00')?'查看本周进度':'生成周复盘';
}
function renderWeeklyOutcome(report){
  var status=document.getElementById('weeklyStatus'),actual=report.actual_summary||{},execution=report.plan_execution_summary||report.execution_summary,decision=report.progression_decision,checkpoint=report.type==='weekly_checkpoint';
  var actualLabel='实际 '+esc(actual.activity_count||0)+' 次';
  if(actual.active_days!=null)actualLabel+=' · '+esc(actual.active_days)+' 个运动日';
  actualLabel+=' · 跑步 '+esc(actual.running_distance_km||0)+' km';
  if(actual.running_days!=null)actualLabel+=' / '+esc(actual.running_days)+' 天';
  var meta='<span>'+actualLabel+'</span>';
  if(actual.total_duration_minutes)meta+='<span>累计 '+esc(actual.total_duration_minutes)+' 分钟</span>';
  if(actual.longest_running_activity?.distance_km)meta+='<span>最长 '+esc(actual.longest_running_activity.distance_km)+' km</span>';
  meta+=execution?'<span>计划执行 '+esc(execution.completed_km||0)+' / '+esc(execution.target_km||0)+' km</span>':'<span>未关联训练方案</span>';
  if(decision)meta+='<span>'+esc(decisionLabel(decision.action))+'</span>';
  var action=report.training_url?'<a class="btn" href="'+esc(report.training_url)+'">查看训练安排</a>':'<a class="btn" href="/training">制定训练方案（可选）</a>';
  // 渐进披露：有新数据时高亮“更新进度”，无变化时弱化为“重新生成”，缺同步时引导补齐数据
  var f=weeklyFreshnessLevel(report),refresh='';
  if(f.level==='stale')refresh='<button class="btn primary" type="button" onclick="genWeeklyReport()">更新进度</button>';
  else if(f.level==='fresh')refresh='<button class="btn" type="button" onclick="genWeeklyReport()">重新生成进度</button>';
  else if(report.sync_url)refresh='<a class="btn primary" href="'+esc(report.sync_url)+'">补齐同步数据</a>';
  var headline=(((report.review_sections||{}).overview||{}).headline)||(report.finding||{}).conclusion||(decision||{}).rationale||'本周实际运动与恢复已汇总。';
  status.innerHTML='<h2>'+esc(report.week_start)+' — '+esc(report.week_end)+(checkpoint?' · 周中检查':' · 周复盘')+'</h2><p>'+esc(headline)+'</p><div class="plan-execution-meta">'+meta+'</div>'+weeklyFreshnessMarkup(report,refresh)+weeklyReviewDetails(report,true)+'<div class="report-status-actions">'+action+'</div>';
}

var todayStr=localDateString(new Date()),requestedDate=new URLSearchParams(location.search).get('date'),requestedWeek=new URLSearchParams(location.search).get('week');
var lastSync=null,archivedWeeks={};
document.getElementById('genDate').value=/^\d{4}-\d{2}-\d{2}$/.test(requestedDate||'')?requestedDate:todayStr;
document.getElementById('weekDate').value=/^\d{4}-\d{2}-\d{2}$/.test(requestedWeek||'')?requestedWeek:(/^\d{4}-\d{2}-\d{2}$/.test(requestedDate||'')?requestedDate:todayStr);
document.getElementById('genDate').max=todayStr;
document.getElementById('weekDate').max=todayStr;
document.getElementById('weekDate').addEventListener('change',handleWeekDateChange);
updateDailyDatePicker();
updateWeekDatePicker();
updateWeekAction();
selectTab(reportTab(),false);

async function doLogout(){
  await fetch('/api/logout',{method:'POST'});
  location.href='/login';
}

async function loadUserMeta(){
  try{var response=await fetch('/api/user'),payload=await response.json();if(payload.bound)lastSync=payload.last_sync||null}catch(e){}
}
loadUserMeta();
load();
refreshAIStatus();
</script>
</body>
